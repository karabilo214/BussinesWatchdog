openapi: 3.1.0
info:
  title: Business Watchdog core API
  version: 1.0.0
  description: |
    Core contracts for P0 and P1. This document is a specification, not a running API.
    HMAC canonicalization and transport limits are normative in TZ sections 11 and 27.
    UI CRUD, auth, billing, export and credential rotation must be added before their implementation.
    All monetary amounts are decimal strings in minor units. All timestamps are RFC3339 UTC.
servers:
  - url: https://watchdog.example.invalid
tags:
  - name: Ingestion
  - name: Incidents
  - name: Checks
  - name: BrowserInternal
paths:
  /api/v1/ingest/events:
    post:
      tags: [Ingestion]
      operationId: ingestEvents
      security:
        - IntegrationKeyId: []
      description: |
        Derive tenant, store and integration from verified key; never from body fields.
        Verify raw-body HMAC before JSON parse. Maximum 100 events and 1 MiB uncompressed.
        Fresh transport nonce is required for retry; event IDs remain unchanged.
        Accepted means committed to durable PostgreSQL inbox, not fully processed.
      parameters:
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/SignatureVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: ./event.schema.json
      responses:
        '202':
          description: All records durably accepted or known identical duplicates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '207':
          description: Valid batch envelope with mixed per-record results; retry only unaccepted records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      description: Rate-limited (signup per hour per IP). CSRF cookie required (Sanctum SPA).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation, organization_name, timezone]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                email: {type: string, format: email, maxLength: 255}
                password: {type: string, minLength: 12, maxLength: 128}
                password_confirmation: {type: string}
                organization_name: {type: string, minLength: 1, maxLength: 100}
                timezone: {type: string}
                locale: {enum: [ru, en, de]}
      responses:
        "201":
          description: Registered; owner of a new tenant; session started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      description: Generic failure that does not reveal whether the e-mail exists; 5 per minute per e-mail+IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                remember: {type: boolean}
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security:
        - {UserSession: []}
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: me
      security:
        - {UserSession: []}
      responses:
        "200":
          description: "Current user, active tenant and memberships"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/tenants/{tenant_id}/activate:
    post:
      tags: [Tenancy]
      operationId: activateTenant
      security:
        - {UserSession: []}
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200":
          description: Active tenant switched
          content:
            application/json:
              schema:
                type: object
                required: [active_tenant_id]
                properties:
                  active_tenant_id: {type: string, format: uuid}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/tenants/context:
    get:
      tags: [Tenancy]
      operationId: tenantContext
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Resolved tenant context
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_tenant_id: {type: [string, "null"], format: uuid}
                  tenant_context_id: {type: [string, "null"], format: uuid}
                  tenant_context_source: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/stores:
    get:
      tags: [Stores]
      operationId: listStores
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Stores of the active tenant with coverage
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Store"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
    post:
      tags: [Stores]
      operationId: createStore
      security:
        - {UserSession: []}
      description: Owner/admin.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, base_url, timezone, default_currency]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                base_url:
                  type: string
                  format: uri
                  description: "Public HTTPS origin; private destinations, credentials, fragments and non-standard ports are rejected."
                timezone: {type: string}
                locale: {enum: [ru, en, de]}
                default_currency: {type: string, pattern: "^[A-Z]{3}$"}
      responses:
        "201":
          description: "Created (onboarding, unverified)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Store"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}:
    get:
      tags: [Stores]
      operationId: getStore
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Store with coverage summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Store"}
          headers:
            ETag:
              description: Quoted version for If-Match
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [Stores]
      operationId: updateStore
      security:
        - {UserSession: []}
      description: Owner/admin; If-Match carries config_version. Activation and browser checks require a verified domain (422 store_not_verified).
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                base_url: {type: string, format: uri, description: Changing it clears verification and browser checks.}
                timezone: {type: string}
                locale: {enum: [ru, en, de]}
                default_currency: {type: string, pattern: "^[A-Z]{3}$"}
                status: {enum: [paused, active]}
                browser_enabled: {type: boolean}
                telemetry_enabled: {type: boolean}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Store"}
          headers:
            ETag:
              description: Quoted version for If-Match
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/verify:
    post:
      tags: [Stores]
      operationId: startStoreVerification
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method]
              properties:
                method: {enum: [dns, plugin_challenge]}
      responses:
        "202":
          description: Verification started
          content:
            application/json:
              schema:
                type: object
                required: [id, method, instructions]
                properties:
                  id: {type: string, format: uuid}
                  method: {enum: [dns, plugin_challenge]}
                  challenge: {type: string}
                  instructions: {type: object, description: DNS TXT name/value or the URL the connector must serve.}
                  expires_at: {type: string, format: date-time}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/verification:
    get:
      tags: [Stores]
      operationId: getStoreVerification
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Latest verification
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoreVerification"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/verification/check:
    post:
      tags: [Stores]
      operationId: checkStoreVerification
      security:
        - {UserSession: []}
      description: SSRF-safe DNS/HTTP check; rate-limited.
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200":
          description: Checked now
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoreVerification"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/pairing-codes:
    post:
      tags: [Stores]
      operationId: createPairingCode
      security:
        - {UserSession: []}
      description: Owner/admin.
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "201":
          description: "One-time code (15 min), shown once, never logged"
          content:
            application/json:
              schema:
                type: object
                required: [id, store_id, pairing_code, expires_at, saas_endpoint, service_url]
                properties:
                  id: {type: string, format: uuid}
                  store_id: {type: string, format: uuid}
                  pairing_code: {type: string}
                  expires_at: {type: string, format: date-time}
                  saas_endpoint: {type: string, format: uri}
                  service_url: {type: string, format: uri, description: "Service URL the connector settings ask for (the exchange path is appended by the connector)."}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations:
    get:
      tags: [Integrations]
      operationId: listStoreIntegrations
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Integrations of the store
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Integration"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/pairing/exchange:
    post:
      tags: [Pairing]
      operationId: exchangePairingCode
      description: Called by the store connector; base_url must equal the store base URL. Rate-limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pairing_code, install_id, connector_code, plugin_version, base_url]
              properties:
                pairing_code: {type: string, minLength: 16, maxLength: 128}
                install_id: {type: string, format: uuid}
                connector_code: {type: string, pattern: "^[a-z][a-z0-9_]{1,63}$"}
                plugin_version: {type: string, maxLength: 100}
                base_url: {type: string, format: uri}
      responses:
        "201":
          description: Credential issued once (at-most-once exchange)
          content:
            application/json:
              schema:
                type: object
                required: [integration_id, key_id, secret, secret_encoding, signature_version]
                properties:
                  integration_id: {type: string, format: uuid}
                  key_id: {type: string}
                  secret: {type: string}
                  secret_encoding: {const: base64}
                  signature_version: {const: "1"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations:
    get:
      tags: [Integrations]
      operationId: listIntegrations
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Integrations of the active tenant
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Integration"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}:
    get:
      tags: [Integrations]
      operationId: getIntegration
      security:
        - {UserSession: []}
      parameters:
        - name: integration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Integration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}/revoke:
    post:
      tags: [Integrations]
      operationId: revokeIntegration
      security:
        - {UserSession: []}
      parameters:
        - name: integration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200":
          description: Revoked with credentials; provider revocation requeues the store reconciliation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}/rotate:
    post:
      tags: [Integrations]
      operationId: requestCredentialRotation
      security:
        - {UserSession: []}
      parameters:
        - name: integration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "202":
          description: Rotation requested; the connector picks it up on its next heartbeat
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/findings:
    get:
      tags: [Money]
      operationId: listFindings
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - name: status
          in: query
          schema: {enum: [ok, pending, mismatch, unsupported, unknown]}
        - name: rule_code
          in: query
          schema: {type: string}
        - name: currency
          in: query
          schema: {type: string, pattern: "^[A-Z]{3}$"}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 2048}
        - name: current
          in: query
          description: "Only findings of the latest run per order and of the latest store-wide unmatched-payment scan."
          schema: {type: boolean}
      responses:
        "200":
          description: "Findings, newest first; null amounts are unknown, not zero"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Finding"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/reconciliations:
    post:
      tags: [Money]
      operationId: triggerReconciliation
      security:
        - {UserSession: []}
      description: Without order_ids runs the store-wide unmatched-payment scan.
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                order_ids:
                  type: array
                  maxItems: 100
                  items: {type: string, format: uuid}
                currency: {type: string, pattern: "^[A-Z]{3}$"}
                dry_run: {type: boolean, description: Not supported yet (422).}
      responses:
        "202":
          description: Runs evaluated
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/ReconciliationRunSummary"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/unmatched-payments:
    get:
      tags: [Money]
      operationId: listUnmatchedPayments
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 2048}
      responses:
        "200":
          description: Unallocated provider captures with suggestions (read-only)
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/UnmatchedPayment"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/orders/{order_id}:
    get:
      tags: [Money]
      operationId: getOrder
      security:
        - {UserSession: []}
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Order with latest finding per rule and money operations; no customer data
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Order"}
                  - type: object
                    required: [findings, captures, refunds, refund_transactions, allocations, refund_allocations, revisions]
                    properties:
                      findings:
                        type: array
                        description: Findings of the latest reconciliation run of the order.
                        items: {$ref: "#/components/schemas/Finding"}
                      captures:
                        type: array
                        items: {$ref: "#/components/schemas/FinancialTransaction"}
                      refunds:
                        type: array
                        items: {$ref: "#/components/schemas/Refund"}
                      refund_transactions:
                        type: array
                        description: Provider refunds linked to the order's refunds, plus provider refunds of the payments allocated to it (candidates for a manual refund link).
                        items: {$ref: "#/components/schemas/FinancialTransaction"}
                      allocations:
                        type: array
                        items: {$ref: "#/components/schemas/PaymentAllocation"}
                      refund_allocations:
                        type: array
                        items: {$ref: "#/components/schemas/RefundAllocation"}
                      revisions:
                        type: array
                        items: {$ref: "#/components/schemas/OrderRevision"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/payments/{payment_id}:
    get:
      tags: [Money]
      operationId: getPayment
      security:
        - {UserSession: []}
      parameters:
        - name: payment_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Payment with transactions and allocations
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Payment"}
                  - type: object
                    required: [findings, transactions, allocations, refund_allocations]
                    properties:
                      findings:
                        type: array
                        items: {$ref: "#/components/schemas/Finding"}
                      transactions:
                        type: array
                        items: {$ref: "#/components/schemas/FinancialTransaction"}
                      allocations:
                        type: array
                        items: {$ref: "#/components/schemas/PaymentAllocation"}
                      refund_allocations:
                        type: array
                        items: {$ref: "#/components/schemas/RefundAllocation"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/payment-allocations:
    post:
