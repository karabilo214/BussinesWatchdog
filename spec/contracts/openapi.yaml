          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: "60-second link; Cache-Control: no-store"
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, content_type, size_bytes]
                properties:
                  url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
                  content_type: {type: string}
                  size_bytes: {type: integer}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/ingest/heartbeat:
    post:
      tags: [Ingestion]
      operationId: ingestHeartbeat
      description: Every 5 minutes. Three missing heartbeats mark the connector stale; an old oldest_pending_at marks it partial (ADR 0009).
      parameters:
        - {$ref: "#/components/parameters/SignatureTimestamp"}
        - {$ref: "#/components/parameters/SignatureNonce"}
        - {$ref: "#/components/parameters/Signature"}
        - {$ref: "#/components/parameters/SignatureVersion"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Heartbeat"}
      responses:
        "200":
          description: Self-report stored; a heartbeat does not prove complete order coverage
          content:
            application/json:
              schema:
                type: object
                required: [status, integration_id, credential_rotation_requested, store_verification]
                properties:
                  status: {const: ok}
                  integration_id: {type: string, format: uuid}
                  credential_rotation_requested: {type: boolean}
                  store_verification:
                    type: [object, "null"]
                    description: Pending plugin challenge the connector must serve publicly.
                    properties:
                      id: {type: string, format: uuid}
                      challenge: {type: string}
                      url: {type: string, format: uri}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
      security:
        - {IntegrationKeyId: []}
  /api/v1/ingest/credentials/rotate:
    post:
      tags: [Ingestion]
      operationId: rotateConnectorCredential
      description: Called by the connector after the heartbeat reports credential_rotation_requested.
      parameters:
        - {$ref: "#/components/parameters/SignatureTimestamp"}
        - {$ref: "#/components/parameters/SignatureNonce"}
        - {$ref: "#/components/parameters/Signature"}
        - {$ref: "#/components/parameters/SignatureVersion"}
      responses:
        "201":
          description: New credential issued once; the previous key drains
          content:
            application/json:
              schema:
                type: object
                required: [integration_id, key_id, secret, secret_encoding, signature_version]
                properties:
                  integration_id: {type: string, format: uuid}
                  key_id: {type: string}
                  secret: {type: string}
                  secret_encoding: {const: base64}
                  signature_version: {const: 1}
                  previous_key_draining_until: {type: [string, "null"], format: date-time}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
      security:
        - {IntegrationKeyId: []}
  /internal/v1/browser/leases:
    post:
      tags: [BrowserInternal]
      operationId: leaseBrowserAttempt
      security:
        - WorkerToken: []
      description: Worker identity comes from token, not body. DB claim uses SKIP LOCKED and fencing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [browser_version, location]
              properties:
                browser_version: {type: string, minLength: 1, maxLength: 100}
                location: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200':
          description: New attempt leased; secret token returned once and never logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserLease'
        '204':
          description: No eligible run; worker polls with bounded backoff and jitter
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /internal/v1/browser/attempts/{attempt_id}/heartbeat:
    post:
      tags: [BrowserInternal]
      operationId: heartbeatBrowserAttempt
      security:
        - WorkerToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/LeaseToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fencing_token]
              properties:
                fencing_token: {type: integer, minimum: 1}
      responses:
        '200':
          description: Valid lease heartbeat persisted; absolute deadline unchanged
          content:
            application/json:
              schema:
                type: object
                required: [lease_until, absolute_deadline_at]
                properties:
                  lease_until: {type: string, format: date-time}
                  absolute_deadline_at: {type: string, format: date-time}
        '409':
          $ref: '#/components/responses/Problem'
  /internal/v1/browser/attempts/{attempt_id}/artifacts:
    post:
      tags: [BrowserInternal]
      operationId: uploadBrowserArtifact
      security:
        - WorkerToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/LeaseToken'
        - {name: X-BW-Fencing-Token, in: header, required: true, schema: {type: integer, minimum: 1}}
        - {name: X-BW-Sha256, in: header, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
        - {name: X-BW-Redaction-Version, in: header, required: true, schema: {type: string, maxLength: 32}}
      description: |
        Redacted screenshot of a live attempt (deviation from a presigned upload URL, ADR 0013):
        the worker never receives storage credentials or URLs. The backend chooses the private
        object key, checks size (≤ 2 MiB), image signature and SHA-256, stores the object and
        records it as ready. At most 3 per attempt. Reference the id in the result's artifact_ids.
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, format: binary}}
          image/png: {schema: {type: string, format: binary}}
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [artifact_id, state]
                properties:
                  artifact_id: {type: string, format: uuid}
                  state: {const: ready}
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /internal/v1/browser/attempts/{attempt_id}/result:
    post:
      tags: [BrowserInternal]
      operationId: completeBrowserAttempt
      security:
        - WorkerToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/LeaseToken'
      description: |
        Verify worker identity, current lease and fencing token transactionally.
        Repeated identical final result is 200; altered result or stale attempt is 409.
        Store attempt result and domain outbox in one transaction.
        Lease expiry never turns infrastructure error into a confirmed site failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserResult'
      responses:
        '200':
          description: Result durably persisted or known identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    IntegrationKeyId:
      type: apiKey
      in: header
      name: X-BW-Key-Id
      description: Key ID plus mandatory raw-body HMAC signature headers; key ID alone never authenticates.
    UserSession:
      type: apiKey
      in: cookie
      name: watchdog_session
      description: Same-origin Sanctum session with CSRF on mutations.
    WorkerToken:
      type: http
      scheme: bearer
      description: Scoped worker credential restricted to private ingress.
  parameters:
    SignatureTimestamp:
      name: X-BW-Timestamp
      in: header
      required: true
      schema: {type: string, pattern: '^[0-9]{10,12}$'}
    SignatureNonce:
      name: X-BW-Nonce
      in: header
      required: true
      schema: {type: string, format: uuid}
    Signature:
      name: X-BW-Signature
      in: header
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{64}$'}
    SignatureVersion:
      name: X-BW-Signature-Version
      in: header
      required: true
      schema: {type: string, const: '1'}
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    LeaseToken:
      name: X-BW-Lease-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 256}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing quoted incident revision, for example "3".
      schema: {type: string, pattern: '^"[0-9]+"$'}
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  responses:
    Problem:
      description: Structured safe problem response; HTTP status determines retry policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MoneyMinor:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Signed 64-bit integer encoded as decimal string; semantic validator enforces bigint bounds.
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string, format: uuid}
        errors: {type: array, items: {type: object}}
        retry_after_seconds: {type: integer, minimum: 0}
    Accepted:
      type: object
      additionalProperties: false
      required: [request_id, accepted]
      properties:
        request_id: {type: string, format: uuid}
        accepted: {const: true}
    BatchResult:
      type: object
      additionalProperties: false
      required: [request_id, results]
      properties:
        request_id: {type: string, format: uuid}
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [index, status]
            properties:
              index: {type: integer, minimum: 0, maximum: 99}
              event_id: {type: [string, 'null'], format: uuid}
              inbox_id: {type: [string, 'null'], format: uuid}
              status: {type: string, enum: [accepted, duplicate, invalid, conflict, temporarily_rejected]}
              code: {type: string}
    User:
      type: object
      required: [id, name, email, locale, email_verified, mfa_enabled]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        locale: {enum: [ru, en, de]}
        email_verified: {type: boolean}
        mfa_enabled: {type: boolean}
    Membership:
      type: object
      required: [tenant_id, role, created_at]
      properties:
        tenant_id: {type: string, format: uuid}
        role: {enum: [owner, admin, operator, viewer]}
        created_at: {type: string, format: date-time}
    AuthSession:
      type: object
      required: [user, active_tenant_id, memberships]
      properties:
        user: {$ref: "#/components/schemas/User"}
        active_tenant_id: {type: [string, "null"], format: uuid}
        memberships:
          type: array
          items: {$ref: "#/components/schemas/Membership"}
    StoreCoverage:
      type: object
      required: [connector, money, payment_attempts, browser_checks]
      properties:
        connector:
          type: object
          required: [state]
          properties:
            state: {enum: [not_connected, warming_up, fresh, stale, partial]}
            provider: {type: [string, "null"]}
            last_heartbeat_at: {type: [string, "null"], format: date-time}
            plugin_version: {type: [string, "null"]}
        money:
          type: object
          required: [state, providers]
          properties:
            state:
              enum: [provider_not_connected, store_not_connected, store_data_stale, reconciling]
              description: "Money is reconciled only with a connected independent provider and fresh store data; otherwise results are unknown, never \"fine\"."
            providers:
              type: array
              items:
                type: object
                required: [provider, status]
                properties:
                  provider: {type: string}
                  status: {type: string}
        payment_attempts:
          type: object
          required: [state]
          properties:
            state: {enum: [store_not_connected, store_data_stale, no_attempts_seen, no_recent_attempts, observing]}
            last_window_end_at: {type: [string, "null"], format: date-time}
        browser_checks:
          type: object
          required: [state]
          properties:
            state:
              enum:
                - store_not_verified
                - disabled
                - not_configured
                - scenario_disabled
                - scheduled
                - passing
                - failing
                - not_conclusive
            last_run_status: {type: [string, "null"]}
            last_run_error_code: {type: [string, "null"]}
            last_run_finished_at: {type: [string, "null"], format: date-time}
            next_due_at: {type: [string, "null"], format: date-time}
    Store:
      type: object
      required:
        - id
        - name
        - base_url
        - platform
        - timezone
        - locale
        - default_currency
        - status
        - verified_at
        - browser_enabled
        - telemetry_enabled
        - config_version
        - coverage
        - last_successful_check_at
        - active_incident_count
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        base_url: {type: string, format: uri}
        platform: {type: string}
        timezone: {type: string}
        locale: {enum: [ru, en, de]}
        default_currency: {type: string, pattern: "^[A-Z]{3}$"}
        status: {enum: [onboarding, active, paused, degraded, deleted]}
        verified_at: {type: [string, "null"], format: date-time}
        browser_enabled: {type: boolean}
        telemetry_enabled: {type: boolean}
        config_version: {type: integer, minimum: 1}
        coverage: {$ref: "#/components/schemas/StoreCoverage"}
        last_successful_check_at: {type: [string, "null"], format: date-time}
        active_incident_count: {type: integer, minimum: 0}
    StoreVerification:
      type: object
      required: [id, store_id, method, state]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        method: {enum: [dns, plugin_challenge]}
        state: {enum: [pending, verified, failed, expired]}
        verified_origin: {type: [string, "null"]}
        expires_at: {type: [string, "null"], format: date-time}
        verified_at: {type: [string, "null"], format: date-time}
        reason_code: {type: [string, "null"]}
        attempts: {type: integer}
        last_checked_at: {type: [string, "null"], format: date-time}
        instructions:
          type: object
          description: "Only while pending: DNS TXT name/value or the URL the connector must serve, so the instructions survive a page reload."
    IntegrationCredential:
      type: object
      required: [id, kind, key_id_suffix, status]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        key_id_suffix: {type: string}
        key_version: {type: integer}
        status: {enum: [active, draining, revoked]}
        expires_at: {type: [string, "null"], format: date-time}
        rotated_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    Integration:
      type: object
      required: [id, store_id, provider, mode, source_authority, status, capabilities, health, credentials]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        provider: {type: string}
        external_account_id: {type: [string, "null"]}
        install_id: {type: [string, "null"], format: uuid}
        mode: {enum: [live, test]}
        source_authority: {enum: [store_reported, independent_provider]}
        status: {enum: [pending, active, degraded, revoked, disabled]}
        capabilities: {type: object}
        api_version: {type: [string, "null"]}
        connector_version: {type: [string, "null"]}
        last_heartbeat_at: {type: [string, "null"], format: date-time}
        last_successful_sync_at: {type: [string, "null"], format: date-time}
        health:
          type: object
          description: "Freshness (state, reason, since), last heartbeat self-report, rotation flags. No secrets."
        credentials:
          type: array
          items: {$ref: "#/components/schemas/IntegrationCredential"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Finding:
      type: object
      required: [id, run_id, rule_code, status, currency, evaluated_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        order_id: {type: [string, "null"], format: uuid}
        payment_id: {type: [string, "null"], format: uuid}
        rule_code: {type: string}
        status: {enum: [ok, pending, mismatch, unsupported, unknown]}
        reason_code: {type: [string, "null"]}
        currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: [integer, "null"]}
        expected_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        actual_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        difference_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        gross_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        captured_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        refund_expected_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        refund_actual_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        evidence: {type: object}
        evaluated_at: {type: string, format: date-time}
        order_display_number: {type: [string, "null"], description: "Store order number; present in finding lists and incident details."}
    ReconciliationRunSummary:
      type: object
      required: [run_id, store_id, status, findings_count]
      properties:
        run_id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        order_id: {type: [string, "null"], format: uuid}
        status: {type: string}
        algorithm_version: {type: string}
        config_version: {type: integer}
        findings_count: {type: integer}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
    Order:
      type: object
      required: [id, store_id, external_id, status, currency, currency_exponent, total_minor, financial_support]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        integration_id: {type: string, format: uuid}
        external_id: {type: string}
        display_number: {type: [string, "null"]}
        status: {type: string}
        gateway: {type: [string, "null"]}
        mode: {enum: [live, test]}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        total_minor: {$ref: "#/components/schemas/MoneyMinor"}
        payment_expected: {type: boolean}
        paid_marked_at: {type: [string, "null"], format: date-time}
        transaction_ref: {type: [string, "null"]}
        financial_support: {enum: [supported, unsupported, unknown]}
        is_synthetic: {type: boolean}
        source_created_at: {type: [string, "null"], format: date-time}
        source_updated_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FinancialTransaction:
      type: object
      required: [id, payment_id, kind, status, currency, amount_minor]
      properties:
        id: {type: string, format: uuid}
        payment_id: {type: [string, "null"], format: uuid}
        external_operation_id: {type: string}
        kind: {enum: [capture, refund, fee, dispute_debit, dispute_credit, adjustment]}
        status: {enum: [pending, succeeded, failed, cancelled]}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        occurred_at: {type: [string, "null"], format: date-time}
    Refund:
      type: object
      required: [id, order_id, currency, amount_minor, status]
      properties:
        id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        external_id: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        external_required: {type: [boolean, "null"]}
        provider_ref: {type: [string, "null"]}
        status: {enum: [requested, recorded, cancelled, deleted]}
        occurred_at: {type: [string, "null"], format: date-time}
        updated_at: {type: [string, "null"], format: date-time}
    OrderRevision:
      type: object
      required: [source_revision]
      properties:
        source_revision: {type: integer}
        status: {type: [string, "null"]}
        total_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        observed_at: {type: [string, "null"], format: date-time}
    PaymentAllocation:
      type: object
      required: [id, order_id, payment_id, capture_transaction_id, currency, amount_minor, strategy]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid}
        capture_transaction_id: {type: string, format: uuid}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        strategy: {type: string}
        evidence: {type: object}
        created_by: {type: [string, "null"], format: uuid}
        revoked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    RefundAllocation:
      type: object
      required: [id, refund_id, refund_transaction_id, payment_allocation_id, currency, amount_minor]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        refund_id: {type: string, format: uuid}
        refund_transaction_id: {type: string, format: uuid}
        payment_allocation_id: {type: string, format: uuid}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        strategy: {type: string}
        evidence: {type: object}
        created_by: {type: [string, "null"], format: uuid}
        revoked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    Payment:
      type: object
      required: [id, store_id, mode, currency, status, source_authority]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        integration_id: {type: string, format: uuid}
        external_id: {type: string}
        intent_ref: {type: [string, "null"]}
        charge_ref: {type: [string, "null"]}
        mode: {enum: [live, test]}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        status: {enum: [pending, authorized, captured, failed, cancelled, unknown]}
        source_authority: {enum: [store_reported, independent_provider]}
        source_updated_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UnmatchedPayment:
      type: object
      required: [capture_transaction_id, currency, amount_minor, reason, candidates]
      properties:
        payment_id: {type: [string, "null"], format: uuid}
        capture_transaction_id: {type: string, format: uuid}
        external_operation_id: {type: string, description: Provider operation ID (e.g. the Stripe charge) to look the capture up.}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        mode: {type: [string, "null"]}
        occurred_at: {type: [string, "null"], format: date-time}
        reason: {enum: [no_candidate_found, review_required]}
        candidates:
          type: array
          description: "Suggestions only, never an allocation."
          items:
            type: object
            required: [order_id, confidence]
            properties:
              order_id: {type: string, format: uuid}
              display_number: {type: [string, "null"]}
              confidence: {enum: [exact_candidate, manual_review]}
              provider_ref: {type: [string, "null"]}
              amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
              currency: {type: string, pattern: "^[A-Z]{3}$"}
              currency_exponent: {type: integer}
              mode: {type: [string, "null"]}
    Incident:
      type: object
      required:
        - id
        - store_id
        - family
        - component
        - state
        - severity
        - title_code
        - revision
        - first_seen_at
        - last_seen_at
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        family: {enum: [money, checkout, checkout_payment, integration]}
        component: {type: string}
        state: {enum: [open, acknowledged, resolved]}
        severity: {enum: [info, warning, critical]}
        title_code: {type: string, description: Stable code; the UI translates it (ru/en/de).}
        currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: [integer, "null"], minimum: 0, description: "Exponent of verified_discrepancy_minor, from the linked reconciliation finding; null when unknown."}
        verified_discrepancy_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        last_good_at: {type: [string, "null"], format: date-time}
        first_bad_at: {type: [string, "null"], format: date-time}
        acknowledged_by: {type: [string, "null"], format: uuid}
        acknowledged_at: {type: [string, "null"], format: date-time}
        resolved_at: {type: [string, "null"], format: date-time}
        resolution_reason: {type: [string, "null"]}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Signal:
      type: object
      required: [id, signal_type, family, severity, confidence, detected_at]
      properties:
        id: {type: string, format: uuid}
        signal_type: {enum: [reconciliation_finding, payment_attempts, connector_freshness, browser_check]}
        family: {type: string}
        component: {type: string}
        severity: {enum: [info, warning, critical]}
        confidence: {enum: [observed, corroborated, inferred, unknown]}
        rule_version: {type: string}
        config_version: {type: integer}
        currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        finding_id: {type: [string, "null"], format: uuid}
        evidence: {type: object, description: Sanitized facts; no customer data.}
        detected_at: {type: string, format: date-time}
    IncidentActivity:
      type: object
      required: [id, incident_id, kind, created_at]
      properties:
        id: {type: string, format: uuid}
        incident_id: {type: string, format: uuid}
        kind:
          enum: [created, signal_linked, acknowledged, comment, resolved, reopened, severity_changed, suppressed]
        actor_id: {type: [string, "null"], format: uuid}
        incident_revision: {type: integer}
        data: {type: object}
        created_at: {type: string, format: date-time}
    IncidentDetail:
      allOf:
        - {$ref: "#/components/schemas/Incident"}
        - type: object
          required: [signals, findings, activity, active_suppression]
          properties:
            signals:
              type: array
              items: {$ref: "#/components/schemas/Signal"}
            findings:
              type: array
              description: Reconciliation findings behind the linked signals, oldest first.
              items: {$ref: "#/components/schemas/Finding"}
            activity:
              type: array
              items: {$ref: "#/components/schemas/IncidentActivity"}
            active_suppression:
              description: Suppression in force now (notifications muted), or null.
              oneOf:
                - {$ref: "#/components/schemas/Suppression"}
                - {type: "null"}
    Suppression:
      type: object
      required: [id, incident_id, reason, starts_at, ends_at]
      properties:
        id: {type: string, format: uuid}
        incident_id: {type: string, format: uuid}
        reason: {type: string}
        created_by: {type: [string, "null"], format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    NotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        min_severity: {enum: [info, warning, critical]}
        locale: {enum: [ru, en, de]}
        timezone: {type: string}
        quiet_hours:
          type: [object, "null"]
          required: [start, end]
          properties:
            start: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$"}
            end: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$"}
        critical_bypasses_quiet_hours: {type: boolean}
        notify_recovery: {type: boolean}
        store_ids:
          type: [array, "null"]
          maxItems: 100
          items: {type: string, format: uuid}
    NotificationChannel:
      type: object
      required: [id, kind, label, destination_masked, enabled, preferences, effective_preferences, health]
      properties:
        id: {type: string, format: uuid}
        kind: {enum: [email, telegram]}
        label: {type: string}
        destination_masked: {type: string}
        enabled: {type: boolean}
        verified_at: {type: [string, "null"], format: date-time}
        preferences: {$ref: "#/components/schemas/NotificationPreferences"}
        effective_preferences: {$ref: "#/components/schemas/NotificationPreferences"}
        health: {type: object}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NotificationDelivery:
      type: object
      required: [id, channel_id, notification_kind, status, attempts]
      properties:
        id: {type: string, format: uuid}
        incident_id: {type: [string, "null"], format: uuid}
        channel_id: {type: string, format: uuid}
        notification_kind: {enum: [incident_opened, incident_reopened, incident_recovered, test]}
        incident_revision: {type: [integer, "null"]}
        template_version: {type: string}
        status: {enum: [queued, sending, sent, uncertain, failed, dead_letter, suppressed]}
        delivery_uncertain: {type: boolean}
        attempts: {type: integer}
        next_attempt_at: {type: [string, "null"], format: date-time}
        sent_at: {type: [string, "null"], format: date-time}
        error_code: {type: [string, "null"]}
        content: {type: object, description: "Sanitized template input, no PII."}
        created_at: {type: string, format: date-time}
    CheckScenario:
      type: object
      required:
        - id
        - store_id
        - name
        - mode
        - version
        - enabled
        - adapter_version
        - interval_seconds
        - supported_steps
        - untested_components
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        name: {type: string}
        mode: {const: payment_form}
        version: {type: integer, minimum: 1}
        enabled: {type: boolean}
        adapter_version: {type: string}
        product_external_id: {type: [string, "null"]}
        product_url: {type: [string, "null"], format: uri}
        cart_url: {type: [string, "null"], format: uri}
        checkout_url: {type: [string, "null"], format: uri}
        extra_allowed_origins:
          type: array
          items: {type: string, format: uri}
        synthetic_location:
          type: [object, "null"]
          properties:
            country: {type: string, pattern: "^[A-Z]{2}$"}
            postcode: {type: [string, "null"]}
        interval_seconds: {type: integer, minimum: 300, maximum: 86400}
        next_due_at: {type: [string, "null"], format: date-time}
        supported_steps:
          type: array
          items: {type: string}
        untested_components:
          type: array
          items: {type: string}
    CheckScenarioInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        product_url: {type: string, format: uri, description: HTTPS on the store origin.}
        cart_url: {type: [string, "null"], format: uri}
        checkout_url: {type: [string, "null"], format: uri}
        product_external_id: {type: [string, "null"], maxLength: 255}
        interval_seconds: {type: integer, minimum: 300, maximum: 86400}
        enabled: {type: boolean, description: Requires a verified store.}
        extra_allowed_origins:
          type: array
          maxItems: 10
          items: {type: string, format: uri}
          description: Public HTTPS gateway/CDN origins the check may load.
        synthetic_location:
          type: [object, "null"]
          additionalProperties: false
          required: [country]
          properties:
            country: {type: string, pattern: "^[A-Za-z]{2}$"}
            postcode: {type: [string, "null"], maxLength: 16}
    CheckRun:
      type: object
      required: [id, store_id, scenario_id, scenario_version, trigger, status, scheduled_at]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        scenario_id: {type: string, format: uuid}
        scenario_version: {type: integer}
        trigger: {enum: [scheduled, manual, incident]}
        status: {enum: [queued, running, passed, failed, inconclusive, blocked, unsupported, cancelled]}
        error_code: {type: [string, "null"]}
        scheduled_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
    CheckArtifact:
      type: object
      required: [id, kind, content_type, size_bytes, expires_at]
      properties:
        id: {type: string, format: uuid}
        kind: {enum: [screenshot]}
        content_type: {enum: [image/jpeg, image/png]}
        size_bytes: {type: integer}
        redaction_version: {type: string}
        expires_at: {type: string, format: date-time}
    CheckRunDetail:
      allOf:
        - {$ref: "#/components/schemas/CheckRun"}
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: array
              items:
                type: object
                required: [id, attempt_number, status, steps, artifacts]
                properties:
                  id: {type: string, format: uuid}
                  attempt_number: {type: integer}
                  status: {enum: [running, passed, failed, inconclusive, blocked, unsupported, cancelled, expired]}
                  error_code: {type: [string, "null"]}
                  location: {type: string}
                  browser_version: {type: string}
                  started_at: {type: string, format: date-time}
                  finished_at: {type: [string, "null"], format: date-time}
                  diagnostics: {type: [object, "null"], description: redaction_version and relevant_errors (sanitized metadata).}
                  artifacts:
                    type: array
                    items: {$ref: "#/components/schemas/CheckArtifact"}
                  steps:
                    type: array
                    items:
                      type: object
                      required: [index, code, status]
                      properties:
                        index: {type: integer}
                        code: {type: string}
                        status: {enum: [passed, failed, skipped, inconclusive, blocked]}
                        error_code: {type: [string, "null"]}
                        started_at: {type: string, format: date-time}
                        finished_at: {type: string, format: date-time}
                        assertions:
                          type: array
                          items: {type: object}
                        network_summary:
                          type: array
                          items: {type: object}
    Heartbeat:
      type: object
      additionalProperties: false
      properties:
        backlog_count: {type: integer, minimum: 0}
        oldest_pending_at: {type: [string, "null"], format: date-time}
        plugin_version: {type: string, maxLength: 64}
    BrowserLease:
      type: object
      additionalProperties: false
      required: [attempt_id, run_id, store_id, fencing_token, lease_token, lease_until, absolute_deadline_at, scenario, network_policy]
      properties:
        attempt_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        fencing_token: {type: integer, minimum: 1}
        lease_token: {type: string, minLength: 32}
        lease_until: {type: string, format: date-time}
        absolute_deadline_at: {type: string, format: date-time}
        scenario:
          type: object
          required: [version, adapter_version, mode, store_origin, product_url, cart_url, checkout_url, steps]
          properties:
            version: {type: integer, minimum: 1}
            adapter_version: {type: string}
            mode: {const: payment_form}
            store_origin: {type: string, format: uri}
            product_url: {type: string, format: uri}
            cart_url: {type: string, format: uri}
            checkout_url: {type: string, format: uri}
            synthetic_token: {type: string, description: Short-lived store and run bound signed token, never logged.}
            synthetic_location:
              type: [object, 'null']
              properties:
                country: {type: string, pattern: '^[A-Z]{2}$'}
                postcode: {type: [string, 'null'], maxLength: 16}
            steps:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: object
                required: [code, action]
                properties:
                  code: {type: string}
                  action: {enum: [goto, click_safe, fill_synthetic, select, assert_visible, assert_cart, wait_response]}
                  target: {enum: [product_url, cart_url, checkout_url], description: Scenario URL the step navigates to; selectors live in the versioned worker adapter.}
                  selector: {type: string, maxLength: 1000}
                  timeout_ms: {type: integer, minimum: 1000, maximum: 30000}
        network_policy:
          type: object
          required: [version, allowed_origins, blocked_operations]
          properties:
            version: {type: string}
            allowed_origins: {type: array, items: {type: string, format: uri}}
            blocked_operations: {type: array, items: {type: string}}
    BrowserResult:
      type: object
      additionalProperties: false
      required: [fencing_token, status, finished_at, steps, diagnostics]
      properties:
        fencing_token: {type: integer, minimum: 1}
        status: {type: string, enum: [passed, failed, inconclusive, blocked, unsupported, cancelled]}
        finished_at: {type: string, format: date-time}
        error_code: {type: [string, 'null'], maxLength: 128}
        steps:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [index, code, status, started_at, finished_at, assertions]
            properties:
              index: {type: integer, minimum: 0}
              code: {type: string, maxLength: 128}
              status: {enum: [passed, failed, skipped, inconclusive, blocked]}
              started_at: {type: string, format: date-time}
              finished_at: {type: string, format: date-time}
              assertions:
                type: array
                maxItems: 20
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    code: {type: string}
                    passed: {type: boolean}
                    detail_code: {type: string}
              network_summary:
                type: array
                maxItems: 50
                items:
                  type: object
                  additionalProperties: false
                  description: Path without query string or fragment; no headers or bodies.
                  properties:
                    method: {type: string}
                    origin: {type: string}
                    path: {type: string, pattern: '^[^?#@]*$'}
                    status: {type: [integer, 'null']}
                    duration_ms: {type: integer}
                    party: {enum: [first, gateway, third]}
                    failure: {type: string}
              error_code: {type: [string, 'null']}
        diagnostics:
          type: object
          additionalProperties: false
          description: Sanitized metadata only, no response bodies, secrets, cookies or full headers.
          required: [redaction_version, relevant_errors]
          properties:
            redaction_version: {type: string}
            relevant_errors:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                properties:
                  type: {type: string}
                  party: {enum: [first, gateway, third]}
                  origin: {type: string}
                  path: {type: string, pattern: '^[^?#@]*$'}
                  status: {type: [integer, 'null']}
                  step_code: {type: string}
                  message_code: {type: string}
                  count: {type: integer}
        artifact_ids:
          type: array
          maxItems: 10
          items: {type: string, format: uuid}
