openapi: 3.1.0
info:
  title: Business Watchdog platform and SaaS billing API
  version: 1.1.0
  description: Additional contracts. SaaS billing has a separate commercial provider
    account and webhook secret. Action-specific parameter validation, RBAC, step-up
    and support grants are normative in panels/ADMIN-BACKEND.md. This is a specification,
    not an application.
paths:
  /api/v1/public/plans:
    get:
      operationId: publicPlans
      description: Published LIVE plans only. No hidden prices or provider secrets.
      security: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanList'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Role, scope or support grant denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Version, idempotency or state conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: currency
        in: query
        schema: &id001
          type: string
      - name: locale
        in: query
        schema:
          enum:
          - ru
          - en
          - de
      - name: interval
        in: query
        schema:
          enum:
          - month
          - year
  /api/v1/billing/trial:
