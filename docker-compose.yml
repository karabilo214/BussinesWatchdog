name: business-watchdog

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_watchdog}
      POSTGRES_USER: ${POSTGRES_USER:-bw_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bw_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bw-local

  redis:
    image: ${REDIS_IMAGE:-redis:8}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bw-local

  s3:
    image: ${S3_IMAGE:-localstack/localstack:latest}
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${S3_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET: ${S3_BUCKET:-business-watchdog-local}
    ports:
      - "${S3_PORT:-4566}:4566"
    volumes:
      - s3-data:/var/lib/localstack
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    networks:
      - bw-local

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.31}
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - bw-local

networks:
  bw-local:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  s3-data:
