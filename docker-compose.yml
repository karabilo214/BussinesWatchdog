name: business-watchdog

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-business_watchdog}
      POSTGRES_USER: ${POSTGRES_USER:-bw_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bw_local_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bw-local

  redis:
    image: ${REDIS_IMAGE:-redis:8}
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bw-local

  s3:
    image: ${S3_IMAGE:-adobe/s3mock:5.2.2}
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-business-watchdog-local}
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "${S3_PORT:-9090}:9090"
    volumes:
      - s3-data:/s3mockroot
    networks:
      - bw-local

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.31}
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - bw-local

  backend-cli:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
      target: cli
    profiles:
      - tools
    env_file:
      - .env
    volumes:
      - ./:/workspace
      - backend-composer-cache:/tmp/composer-cache
    working_dir: /workspace/apps/backend
    networks:
      - bw-local

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
      target: fpm
    profiles:
      - app
    env_file:
      - .env
    volumes:
      - ./apps/backend:/var/www/html
    working_dir: /var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
      s3:
        condition: service_started
    networks:
      - bw-local

  nginx:
    image: nginx:1.27-alpine
    profiles:
      - app
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:80"
    volumes:
      - ./apps/backend:/var/www/html:ro
      - ./infra/nginx/backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - bw-local

networks:
  bw-local:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  s3-data:
  backend-composer-cache:
