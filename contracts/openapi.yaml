      description: "Requires tenants.support, own request only. Hides a finished request (denied, revoked, expired, cancelled) from the employee's history; nothing is deleted and the customer's history and both audits keep it. A pending or still active request answers 409 — cancel or have it revoked first. Idempotent."
      security: [{StaffSession: []}]
      parameters:
        - {name: grant, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Hidden from the staff history}
  /platform-api/v1/support-grants/{grant}/cancel:
    post:
      tags: [Platform]
      operationId: runtimePlatformCancelSupportGrant
      description: "Requires tenants.support. The requesting employee cancels their own pending request (state cancelled); the owner can no longer approve it. Repeating is idempotent; a decided request answers 409."
      security: [{StaffSession: []}]
      parameters:
        - {name: grant, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Cancelled grant, content: {application/json: {schema: {type: object}}}}
  /platform-api/v1/support-grants/{grant}/resend:
    post:
      tags: [Platform]
      operationId: runtimePlatformResendSupportGrant
      description: "Requires tenants.support, own request only. Pending: the owners get the request e-mail again (200, same grant). Denied, revoked, expired or cancelled: a new pending request with the same store, scopes, duration and reason and a new case number (201)."
      security: [{StaffSession: []}]
      parameters:
        - {name: grant, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Request e-mail sent again, content: {application/json: {schema: {type: object}}}}
        "201": {description: New pending grant, content: {application/json: {schema: {type: object}}}}
  /api/v1/support-grants:
    get:
      tags: [Account]
      operationId: runtimeCustomerListSupportGrants
      description: "Tenant owner lists requests and their effective state for the active organisation."
      security: [{CustomerSession: []}]
      responses:
        "200": {description: Grants, content: {application/json: {schema: {type: object}}}}
    post:
      tags: [Account]
      operationId: runtimeCustomerRequestSupportGrant
      description: "Tenant owner requests a grant for one store and an active support employee chosen from /api/v1/support-staff (staff_id). The case reference is assigned by the server; reason required."
      security: [{CustomerSession: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [store_id, staff_id, scopes, reason]}
      responses:
        "201": {description: Pending grant, content: {application/json: {schema: {type: object}}}}
  /api/v1/support-staff:
    get:
      tags: [Account]
      operationId: runtimeCustomerListSupportStaff
      description: "Tenant owner lists active support employees allowed to work with support access, as {id, name} sorted by name; no e-mail addresses."
      security: [{CustomerSession: []}]
      responses:
        "200": {description: Support employees, content: {application/json: {schema: {type: object}}}}
  /api/v1/support-grants/{grant}/approve:
    post:
      tags: [Account]
      operationId: runtimeCustomerApproveSupportGrant
      description: "Only tenant_owner approves; the duration begins now."
      security: [{CustomerSession: []}]
      parameters:
        - {name: grant, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Approved grant, content: {application/json: {schema: {type: object}}}}
  /api/v1/support-grants/{grant}/deny:
    post:
      tags: [Account]
      operationId: runtimeCustomerDenySupportGrant
      description: "Only tenant_owner denies a pending request."
      security: [{CustomerSession: []}]
      parameters:
        - {name: grant, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Denied grant, content: {application/json: {schema: {type: object}}}}
  /api/v1/support-grants/{grant}/revoke:
    post:
      tags: [Account]
      operationId: runtimeCustomerRevokeSupportGrant
      description: "Only tenant_owner revokes an approved grant. The next detailed request or artifact link is denied."
      security: [{CustomerSession: []}]
      parameters:
        - {name: grant, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Revoked grant, content: {application/json: {schema: {type: object}}}}
  /api/v1/support-grants/{grant}/activity:
    get:
      tags: [Account]
      operationId: runtimeCustomerSupportGrantActivity
      description: "Tenant owner sees decision, detailed read, material and recheck metadata without customer content or secrets. Each entry: id, action, at, staff_id, staff_name (support employee display name, no e-mail), target_type (store, order, check, artifact, incident), target_id."
      security: [{CustomerSession: []}]
      parameters:
        - {name: grant, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Audit activity, content: {application/json: {schema: {type: object}}}}
components:
  securitySchemes:
    IntegrationKeyId:
      type: apiKey
      in: header
      name: X-BW-Key-Id
      description: Key ID plus mandatory raw-body HMAC signature headers; key ID alone never authenticates.
    StaffSession:
      type: apiKey
      in: cookie
      name: bw-platform-session
      description: Control panel session, separate from the customer session; CSRF via the BW-PLATFORM-XSRF cookie and X-XSRF-TOKEN.
    UserSession:
      type: apiKey
      in: cookie
      name: watchdog_session
      description: Same-origin Sanctum session with CSRF on mutations.
    WorkerToken:
      type: http
      scheme: bearer
      description: Scoped worker credential restricted to private ingress.
  parameters:
    SignatureTimestamp:
      name: X-BW-Timestamp
      in: header
      required: true
      schema: {type: string, pattern: '^[0-9]{10,12}$'}
    SignatureNonce:
      name: X-BW-Nonce
      in: header
      required: true
      schema: {type: string, format: uuid}
    Signature:
      name: X-BW-Signature
      in: header
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{64}$'}
    SignatureVersion:
      name: X-BW-Signature-Version
      in: header
      required: true
      schema: {type: string, const: '1'}
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    LeaseToken:
      name: X-BW-Lease-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 256}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing quoted incident revision, for example "3".
      schema: {type: string, pattern: '^"[0-9]+"$'}
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  responses:
    Problem:
      description: Structured safe problem response; HTTP status determines retry policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ObservationTextSet:
      type: object
      required: [privacy, lia]
      properties:
        privacy: {type: string, description: "Paragraph for the store's privacy policy, plain text, paragraphs separated by blank lines; the first line is its heading"}
        lia: {type: string, description: "Legitimate interest assessment template, plain text with [placeholders] for the shop"}
    PlatformConfirmation:
      type: object
      additionalProperties: false
      required: [reason, code]
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
        code: {type: string, maxLength: 32, description: Current authenticator code or an unused recovery code}
    PlatformPlanVersion:
      type: object
      required: [id, version, state, name, description, placeholder, trial_days, entitlements, published_at, subscribers, prices]
      properties:
        id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        version: {type: integer}
        state: {enum: [draft, published, retired]}
        name: {type: object, additionalProperties: {type: string}}
        description: {type: object, additionalProperties: {type: string}}
        placeholder: {type: boolean}
        trial_days: {type: integer}
        entitlements: {type: object}
        published_at: {type: [string, "null"], format: date-time}
        subscribers: {type: integer}
        prices:
          type: array
          items:
            type: object
            required: [id, kind, mode, currency, currency_exponent, amount_minor, interval, interval_count, state, at_provider]
            properties:
              id: {type: string, format: uuid}
              kind: {enum: [base, extra_store]}
              mode: {enum: [test, live]}
              currency: {type: string}
              currency_exponent: {type: integer}
              amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
              interval: {enum: [day, week, month, year]}
              interval_count: {type: integer}
              state: {enum: [draft, published, retired]}
              at_provider: {type: boolean}
    ReminderLetter:
      type: object
      required: [subject, body]
      properties:
        subject: {type: string, minLength: 3, maxLength: 150}
        body: {type: string, minLength: 10, maxLength: 10000}
    PlatformMe:
      type: object
      additionalProperties: false
      required: [staff_id, name, email, locale, role, mfa_enabled, capabilities, billing_mode, session]
      properties:
        staff_id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string}
        locale: {type: string}
        role: {enum: [platform_owner, platform_member]}
        mfa_enabled: {const: true}
        capabilities: {type: array, items: {type: string}, description: "An owner: every capability; a member: the set the owner gave (ADR 0064)."}
        billing_mode: {enum: [test, live]}
        session:
          type: object
          required: [idle_minutes, absolute_hours]
          properties:
            idle_minutes: {type: integer}
            absolute_hours: {type: integer}
    BillingPlan:
      type: object
      additionalProperties: false
      required: [plan_code, plan_version_id, name, description, placeholder, trial_days, entitlements, prices, discounts]
      properties:
        plan_code: {type: string}
        plan_version_id: {type: string, format: uuid}
        name: {type: object, additionalProperties: {type: string}, description: Localized names by locale}
        description: {type: object, additionalProperties: {type: string}, description: Localized descriptions by locale}
        discounts: {type: array, items: {$ref: "#/components/schemas/BillingDiscount"}, description: "The best public offer and the organisation's own discount for this plan, in application order; a promo code comes third"}
        placeholder: {type: boolean, description: "Draft content not approved by the owner"}
        trial_days: {type: integer, minimum: 0}
        entitlements:
          type: object
          required: [features, limits]
          properties:
            features: {type: array, items: {type: string}}
            limits: {type: object, additionalProperties: {type: [integer, "null"]}}
        prices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, kind, currency, currency_exponent, amount_minor, interval, interval_count, tax_behavior]
            properties:
              id: {type: string, format: uuid}
              kind: {enum: [base, extra_store]}
              currency: {type: string, pattern: '^[A-Z]{3}$'}
              currency_exponent: {type: integer}
              amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
              interval: {enum: [day, week, month, year]}
              interval_count: {type: integer, minimum: 1}
              tax_behavior: {type: string}
    BillingDiscount:
      type: object
      additionalProperties: false
      required: [id, position, audience, label, kind, percent, amount_minor, currency, currency_exponent, duration, duration_periods, expires_at]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, enum: [1, 2, 3], description: "Application order: 1 offer, 2 personal, 3 promo code"}
        audience: {enum: [automatic, tenant, code]}
        label: {type: object, additionalProperties: {type: string}, description: Customer-facing text by locale}
        kind: {enum: [percentage, flat]}
        percent: {type: [string, "null"], description: "Percentage as a decimal string, e.g. \"12.5\""}
        amount_minor: {oneOf: [{$ref: "#/components/schemas/MoneyMinor"}, {type: "null"}]}
        currency: {type: [string, "null"]}
        currency_exponent: {type: [integer, "null"]}
        duration: {enum: [once, periods, forever]}
        duration_periods: {type: [integer, "null"]}
        expires_at: {type: [string, "null"], format: date-time}
    PlatformDiscount:
      allOf:
        - {$ref: "#/components/schemas/BillingDiscount"}
        - type: object
          required: [name, audience, code, usage_limit, used, plan_ids, tenants, starts_at, state, mode, created_at]
          properties:
            name: {type: string}
            audience: {enum: [code, tenant, automatic]}
            code: {type: [string, "null"]}
            usage_limit: {type: [integer, "null"]}
            used: {type: integer}
            plan_ids: {type: array, items: {type: string, format: uuid}}
            tenants: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}}}}
            starts_at: {type: [string, "null"], format: date-time}
            state: {enum: [active, archived]}
            mode: {enum: [test, live]}
            created_at: {type: [string, "null"], format: date-time}
    DiscountBreakdown:
      type: object
      required: [id, period_number, period_start, currency, currency_exponent, amount_before_minor, saving_minor, amount_after_minor, status, error_code, lines]
      properties:
        id: {type: string, format: uuid}
        period_number: {type: integer, minimum: 1, description: "1 = the purchase, 2 = the first renewal, ..."}
        period_start: {type: [string, "null"], format: date-time}
        currency: {type: string}
        currency_exponent: {type: integer}
        amount_before_minor: {$ref: "#/components/schemas/MoneyMinor"}
        saving_minor: {$ref: "#/components/schemas/MoneyMinor"}
        amount_after_minor: {$ref: "#/components/schemas/MoneyMinor"}
        status: {enum: [planned, applied, failed]}
        error_code: {type: [string, "null"]}
        lines:
          type: array
          description: In application order; each line starts from the previous line's amount after
          items:
            type: object
            required: [discount, position, amount_before_minor, saving_minor, amount_after_minor]
            properties:
              discount: {oneOf: [{$ref: "#/components/schemas/BillingDiscount"}, {type: "null"}]}
              position: {type: integer, enum: [1, 2, 3]}
              amount_before_minor: {$ref: "#/components/schemas/MoneyMinor"}
              saving_minor: {$ref: "#/components/schemas/MoneyMinor"}
              amount_after_minor: {$ref: "#/components/schemas/MoneyMinor"}
    BillingCheckout:
      type: object
      additionalProperties: false
      required: [id, status, error_code, expires_at, extra_store_quantity, discounts, access_state, provider_checkout]
      properties:
        id: {type: string, format: uuid}
        discounts: {oneOf: [{$ref: "#/components/schemas/DiscountBreakdown"}, {type: "null"}], description: "The first payment's discounts as charged: one combined Paddle discount"}
        status: {enum: [creating, pending, requires_action, confirmed, failed, cancelled, expired, unknown]}
        error_code: {type: [string, "null"]}
        expires_at: {type: string, format: date-time}
        extra_store_quantity: {type: integer, minimum: 0}
        access_state: {type: string}
        provider_checkout:
          description: What the browser needs to open the provider's checkout (Paddle.js); null unless the session is pending and not expired.
          oneOf:
            - {type: "null"}
            - type: object
              additionalProperties: false
              required: [provider, environment, client_token, transaction_id]
              properties:
                provider: {const: paddle}
                environment: {enum: [sandbox, production]}
                client_token: {type: string, description: Paddle client-side token (public by design)}
                transaction_id: {type: string}
    BillingSubscription:
      type: object
      additionalProperties: false
      required: [id, tenant_id, provider, plan_code, plan_version_id, status, access_state, access_reason_codes, paid_until, trial_ends_at, grace_until, period_end, cancel_at_period_end, withdrawal_ends_at, withdrawal_pending, withdrawal_requested, extra_store_quantity, version, entitlements]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        provider: {type: string}
        plan_code: {type: string}
        plan_version_id: {type: [string, "null"], format: uuid}
        status: {enum: [trial, active, past_due, suspended, cancelled]}
        access_state: {type: string}
        access_reason_codes: {type: array, items: {type: string}}
        paid_until: {type: [string, "null"], format: date-time}
        trial_ends_at: {type: [string, "null"], format: date-time}
        grace_until: {type: [string, "null"], format: date-time}
        period_end: {type: [string, "null"], format: date-time}
        cancel_at_period_end: {type: boolean}
        withdrawal_ends_at: {type: [string, "null"], format: date-time}
        withdrawal_pending: {type: boolean}
        withdrawal_requested: {type: boolean}
        extra_store_quantity: {type: integer, minimum: 0}
        price:
          type: [object, "null"]
          description: The base price of the period being paid (with a cheaper plan scheduled, still the old one)
          properties:
            id: {type: string, format: uuid}
            amount_minor: {type: string, pattern: "^[0-9]+$"}
            currency: {type: string}
            currency_exponent: {type: integer}
            billing_interval: {type: string}
            billing_interval_count: {type: integer}
        scheduled_change: {oneOf: [{$ref: "#/components/schemas/BillingPlanChange"}, {type: "null"}]}
        capacity: {$ref: "#/components/schemas/StoreCapacity"}
        version: {type: integer, minimum: 1}
        entitlements:
          type: object
          required: [features, limits]
          properties:
            features: {type: array, items: {type: string}}
            limits: {type: object, additionalProperties: {type: [integer, "null"]}}
    PlatformTenantRow:
      type: object
      required: [id, name, status, created_at, owner, access, subscription, stores, open_incidents, override_active]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {enum: [active, suspended, deleting]}
        created_at: {type: string, format: date-time}
        owner:
          type: object
          properties:
            name: {type: [string, "null"]}
            email: {type: [string, "null"], description: Masked unless the viewer is the platform owner}
            email_verified: {type: boolean}
        access:
          type: object
          properties:
            state: {type: string}
            reasons: {type: array, items: {type: string}}
            enforced: {type: boolean}
        subscription: {type: [object, "null"], description: "Only with billing.read"}
        stores: {$ref: "#/components/schemas/StoreCapacity"}
        open_incidents: {type: integer}
        override_active: {type: boolean}
    PlatformTenantActionInput:
      type: object
      properties:
        plan_version_id: {type: string, format: uuid}
        extra_stores: {type: integer, minimum: 0}
        ends_at: {type: string, format: date-time}
        override_id: {type: string, format: uuid}
        trial_ends_at: {type: string, format: date-time}
    BillingPlanChange:
      type: object
      additionalProperties: false
      required: [id, preview_token, kind, status, from, to, currency, currency_exponent, due_now_minor, next_amount_before_minor, next_amount_minor, effective_at, expires_at, retained_store_ids, error_code]
      properties:
        id: {type: string, format: uuid}
        preview_token: {type: [string, "null"], description: "Only while the preview can be confirmed (10 minutes)"}
        kind: {enum: [immediate, next_period], description: "immediate — the new recurring price is not lower: Paddle charges the prorated difference now; next_period — a cheaper plan from the next billing period, the paid plan stays until then"}
        status: {enum: [previewed, applying, applied, scheduled, failed, unknown, cancelled, expired]}
        from: {$ref: "#/components/schemas/BillingPlanChangeSide"}
        to: {$ref: "#/components/schemas/BillingPlanChangeSide"}
        currency: {type: string}
        currency_exponent: {type: integer}
        due_now_minor: {type: string, pattern: "^[0-9]+$", description: "Gross amount Paddle charges now for the rest of the period (0 for next_period), without discounts"}
        next_amount_before_minor: {type: string, pattern: "^[0-9]+$", description: Next period's price of the new plan before discounts}
        next_amount_minor: {type: string, pattern: "^[0-9]+$", description: "Next period's price after the discounts the subscription still holds that apply to the new plan"}
        effective_at: {type: [string, "null"], format: date-time}
        expires_at: {type: string, format: date-time}
        retained_store_ids: {type: [array, "null"], items: {type: string, format: uuid}}
        error_code: {type: [string, "null"]}
    BillingPlanChangeSide:
      type: object
      properties:
        plan_code: {type: [string, "null"]}
        plan_version_id: {type: [string, "null"], format: uuid}
        price_id: {type: string, format: uuid}
        amount_minor: {type: [string, "null"]}
        extra_store_quantity: {type: integer, minimum: 0}
    StoreCapacity:
      type: object
      additionalProperties: false
      required: [limit, stores, paused, choice_required]
      properties:
        limit: {type: [integer, "null"], description: "Stores the plan allows; null when not limited (also in pilot mode)"}
        stores: {type: integer}
        paused: {type: integer}
        choice_required: {type: boolean, description: "More stores run than the plan allows and the owner has not chosen: browser checks of the organisation are paused"}
    Entitlements:
      type: object
      additionalProperties: false
      required: [access_state, reason_codes, enforced, plan_code, features, limits, usage]
      properties:
        access_state: {type: string, enum: [pilot, active, override, trial, grace, paused_billing, paused_manual, no_service, onboarding]}
        reason_codes: {type: array, items: {type: string}}
        enforced: {type: boolean}
        plan_code: {type: [string, "null"]}
        features:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, included, reason]
            properties:
              code: {type: string, enum: [checkout_monitoring, payment_attempts_server, payment_attempts_script, money_reconciliation, order_outcomes, notifications_telegram, agency_workspace]}
              included: {type: boolean}
              reason: {type: string, description: "included, not_in_plan, pilot or the access state that pauses the service"}
        limits:
          type: object
          additionalProperties: false
          description: Null means no limit.
          properties:
            max_active_stores: {type: [integer, "null"]}
            max_extra_stores: {type: [integer, "null"]}
            min_check_interval_minutes: {type: [integer, "null"]}
            retention_days: {type: [integer, "null"]}
            monthly_event_budget: {type: [integer, "null"]}
            manual_runs_per_day: {type: [integer, "null"]}
        usage:
          type: object
          additionalProperties: false
          required: [manual_runs_per_day, monthly_event_budget]
          description: "Usage counted for count-bound limits in the current period (ADR 0032): calendar day / month in the tenant's timezone. Counted in pilot mode too; the limit applies only when enforced."
          properties:
            manual_runs_per_day: {$ref: "#/components/schemas/UsagePeriod"}
            monthly_event_budget: {$ref: "#/components/schemas/UsagePeriod"}
    UsagePeriod:
      type: object
      additionalProperties: false
      required: [used, period_start, period_end]
      properties:
        used: {type: integer, minimum: 0}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
    MoneyMinor:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Signed 64-bit integer encoded as decimal string; semantic validator enforces bigint bounds.
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string, format: uuid}
        errors: {type: array, items: {type: object}}
        retry_after_seconds: {type: integer, minimum: 0}
    Accepted:
      type: object
      additionalProperties: false
      required: [request_id, accepted]
      properties:
        request_id: {type: string, format: uuid}
        accepted: {const: true}
    BatchResult:
      type: object
      additionalProperties: false
      required: [request_id, results]
      properties:
        request_id: {type: string, format: uuid}
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [index, status]
            properties:
              index: {type: integer, minimum: 0, maximum: 99}
              event_id: {type: [string, 'null'], format: uuid}
              inbox_id: {type: [string, 'null'], format: uuid}
              status: {type: string, enum: [accepted, duplicate, invalid, conflict, temporarily_rejected, skipped], description: "skipped (code store_capacity_paused): the store is paused by the plan (ADR 0037 point 7); the record is not kept and must not be retried — the connector's audit window catches it up after the pause."}
              code: {type: string}
    User:
      type: object
      required: [id, name, salutation, first_name, last_name, company_name, email, locale, email_verified, mfa_enabled]
      properties:
        id: {type: string, format: uuid}
        name: {type: string, description: "Display name, \"first last\"."}
        salutation: {type: [string, "null"], enum: [mr, ms, diverse, null]}
        first_name: {type: [string, "null"]}
        last_name: {type: string}
        company_name: {type: [string, "null"]}
        email: {type: string, format: email}
        locale: {enum: [ru, en, de]}
        email_verified: {type: boolean}
        mfa_enabled: {type: boolean}
    Membership:
      type: object
      required: [tenant_id, role, permissions, created_at]
      properties:
        tenant_id: {type: string, format: uuid}
        role: {enum: [owner, admin, operator, viewer, custom]}
        permissions: {type: array, items: {$ref: "#/components/schemas/TenantPermission"}, description: "What the member may do (ADR 0079); the owner has every permission."}
        created_at: {type: string, format: date-time}
        tenant_status: {enum: [active, suspended, deleting, deleted], description: "deleting: the organization is being deleted (ADR 0069); only the deletion notice and, for the owner, cancelling remain."}
        deletion_purge_after: {type: [string, "null"], format: date-time, description: When the irreversible purge starts; null without an open deletion request.}
    OrganizationDeletionState:
      type: object
      required: [tenant_name, tenant_status, can_request, request]
      properties:
        tenant_name: {type: string, description: What the owner types to confirm.}
        tenant_status: {enum: [active, suspended, deleting, deleted]}
        can_request: {type: boolean, description: The viewer is the owner and no deletion is open.}
        request:
          oneOf:
            - type: "null"
            - type: object
              required: [id, status, requested_via, requested_at, purge_after, can_cancel]
              properties:
                id: {type: string, format: uuid}
                status: {enum: [requested, revoking, deleting_objects, purging, failed]}
                requested_via: {enum: [owner, platform]}
                requested_at: {type: string, format: date-time}
                purge_after: {type: string, format: date-time}
                can_cancel: {type: boolean, description: "Owner only, while status is requested (the 30 days)."}
    PasskeyOptions:
      type: object
      required: [options]
      properties:
        options: {type: object, description: WebAuthn PublicKeyCredentialCreationOptions or PublicKeyCredentialRequestOptions in browser JSON form}
    AccountPasskey:
      type: object
      required: [id, name, created_at, last_used_at]
      properties:
        id: {type: integer}
        name: {type: string}
        created_at: {type: [string, "null"], format: date-time}
        last_used_at: {type: [string, "null"], format: date-time}
    TrustedDevice:
      type: object
      required: [id, device, current, last_used_at, expires_at]
      properties:
        id: {type: string, format: uuid}
        device: {type: string, enum: [Chrome, Edge, Firefox, Safari, other]}
        current: {type: boolean}
        last_used_at: {type: [string, "null"], format: date-time}
        expires_at: {type: string, format: date-time}
    MfaRequired:
      type: object
      required: [mfa_required]
      properties:
        mfa_required: {const: true}
    MfaState:
      type: object
      required: [enabled, recovery_codes_remaining]
      properties:
        enabled: {type: boolean}
        recovery_codes_remaining: {type: integer}
    MfaStateWithCodes:
      allOf:
        - {$ref: "#/components/schemas/MfaState"}
        - type: object
          required: [recovery_codes]
          properties:
            recovery_codes:
              type: array
              items: {type: string}
    StepUp:
      type: object
      required: [current_password]
      properties:
        current_password: {type: string, maxLength: 128}
        code: {type: [string, "null"], maxLength: 32, description: Authenticator or recovery code; required when MFA is on}
    AuthSession:
      type: object
      required: [user, active_tenant_id, memberships]
      properties:
        user: {$ref: "#/components/schemas/User"}
        active_tenant_id: {type: [string, "null"], format: uuid}
        memberships:
          type: array
          items: {$ref: "#/components/schemas/Membership"}
    StoreCoverage:
      type: object
      required: [connector, money, payment_attempts, browser_checks]
      properties:
        connector:
          type: object
          required: [state]
          properties:
            state: {enum: [not_connected, warming_up, fresh, stale, partial, capacity_paused], description: "capacity_paused: the store is paused by the plan (ADR 0037 point 7) — nothing is received, synced or reconciled."}
            provider: {type: [string, "null"], description: "woocommerce (plugin) or woocommerce_api (REST API key)"}
            last_heartbeat_at: {type: [string, "null"], format: date-time}
            last_sync_at: {type: [string, "null"], format: date-time, description: "Last successful sync of a REST API connection (it has no heartbeat)."}
            plugin_version: {type: [string, "null"]}
        money:
          type: object
          required: [state, providers]
          properties:
            state:
              enum: [provider_not_connected, store_not_connected, store_data_stale, capacity_paused, reconciling]
              description: "Money is reconciled only with a connected independent provider and fresh store data; otherwise results are unknown, never \"fine\"."
            providers:
              type: array
              items:
                type: object
                required: [provider, status]
                properties:
                  provider: {type: string}
                  status: {type: string}
        payment_attempts:
          type: object
          required: [state]
          properties:
            state: {enum: [store_not_connected, store_data_stale, capacity_paused, no_attempts_seen, no_recent_attempts, observing]}
            last_window_end_at: {type: [string, "null"], format: date-time}
        browser_checks:
          type: object
          required: [state]
          properties:
            state:
              enum:
                - store_not_verified
                - capacity_paused
                - disabled
                - not_configured
                - scenario_disabled
                - scheduled
                - passing
                - failing
                - not_conclusive
            last_run_status: {type: [string, "null"]}
            last_run_error_code: {type: [string, "null"]}
            last_run_finished_at: {type: [string, "null"], format: date-time}
            next_due_at: {type: [string, "null"], format: date-time}
        checkout_script:
          type: object
          required: [state, last_report_at]
          description: Checkout observation script of the Shopware app (ADR 0057) or the WooCommerce plugin (ADR 0059).
          properties:
            state: {enum: [not_available, needs_app, needs_plugin, connection_without_script, app_not_active, store_not_active, capacity_paused, check_does_not_reach_payment, not_in_plan, not_seen_by_check, elements_not_found, waiting, no_recent_reports, observing], description: "elements_not_found: the last check found the script but not the checkout elements of the store setting (ADR 0075) — observation not confirmed, the checkout is not called broken."}
            last_report_at: {type: [string, "null"], format: date-time}
    Store:
      type: object
      required:
        - id
        - name
        - base_url
        - platform
        - timezone
        - locale
        - default_currency
        - status
        - verified_at
        - browser_enabled
        - telemetry_enabled
        - config_version
        - coverage
        - last_successful_check_at
        - active_incident_count
        - onboarding
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        base_url: {type: string, format: uri}
        platform: {type: string}
        timezone: {type: string}
        locale: {enum: [ru, en, de]}
        default_currency: {type: string, pattern: "^[A-Z]{3}$"}
        status: {enum: [onboarding, active, paused, degraded, deleted]}
        verified_at: {type: [string, "null"], format: date-time}
        capacity_paused_at: {type: [string, "null"], format: date-time, description: "Set while the plan allows fewer stores and the owner did not keep this one: the store is fully paused — no event ingestion, provider sync, reconciliation, freshness evaluation or browser checks; history and setup stay, money results are unknown (ADR 0037 point 7)"}
        last_capacity_pause:
          type: [object, "null"]
          description: "The last capacity pause, for 30 days after it ended: data of that period may deviate (deletions and results the connectors could not catch up)."
          properties:
            from: {type: string, format: date-time}
            until: {type: string, format: date-time}
        browser_enabled: {type: boolean}
        telemetry_enabled: {type: boolean}
        config_version: {type: integer, minimum: 1}
        coverage: {$ref: "#/components/schemas/StoreCoverage"}
        last_successful_check_at: {type: [string, "null"], format: date-time}
        active_incident_count: {type: integer, minimum: 0}
        onboarding:
          type: object
          required: [source_connected, access_verified, orders_received, first_scheduled_sync_at, scheduled_sync_applicable, last_sync_error, provider_connected, telegram_notifications_ready]
          properties:
            source_connected: {type: boolean}
            access_verified: {type: boolean}
            orders_received: {type: integer, minimum: 0, description: Number of orders stored for this tenant/store.}
            first_scheduled_sync_at: {type: [string, "null"], format: date-time, description: First completed scheduled order-source sync; null until observed.}
            scheduled_sync_applicable: {type: boolean, description: False for plugin/App push sources.}
            last_sync_error: {type: [string, "null"]}
            provider_connected: {type: boolean}
            telegram_notifications_ready: {type: boolean}
        checkout_layout:
          type: [object, "null"]
          description: "Shopware stores only (ADR 0075): the fields the customer set and the defaults that apply to the others; null for other platforms."
          required: [custom, defaults]
          properties:
            custom: {$ref: "#/components/schemas/CheckoutLayoutFields"}
            defaults: {$ref: "#/components/schemas/CheckoutLayoutFields"}
    CheckoutLayoutFields:
      type: object
      additionalProperties: false
      properties:
        confirm_path: {type: string, maxLength: 200}
        finish_path: {type: string, maxLength: 200}
        order_form: {type: string, maxLength: 200}
        submit_button: {type: string, maxLength: 200}
        payment_method: {type: string, maxLength: 200}
        error_notice: {type: string, maxLength: 200}
    StoreVerification:
      type: object
      required: [id, store_id, method, state]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        method:
          enum: [dns, plugin_challenge, api_key]
          description: api_key is recorded only by connecting a working WooCommerce Read key on the store's own origin (ADR 0024); it cannot be started.
        state: {enum: [pending, verified, failed, expired]}
        verified_origin: {type: [string, "null"]}
        expires_at: {type: [string, "null"], format: date-time}
        verified_at: {type: [string, "null"], format: date-time}
        reason_code: {type: [string, "null"]}
        attempts: {type: integer}
        last_checked_at: {type: [string, "null"], format: date-time}
        instructions:
          type: object
          description: "Only while pending: DNS TXT name/value or the URL the connector must serve, so the instructions survive a page reload."
    IntegrationCredential:
      type: object
      required: [id, kind, key_id_suffix, status]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        key_id_suffix: {type: string}
        key_version: {type: integer}
        status: {enum: [active, draining, revoked]}
        expires_at: {type: [string, "null"], format: date-time}
        rotated_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    Integration:
      type: object
      required: [id, store_id, provider, mode, source_authority, status, capabilities, health, credentials]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        provider: {type: string}
        external_account_id: {type: [string, "null"]}
        install_id: {type: [string, "null"], format: uuid}
        mode: {enum: [live, test]}
        source_authority: {enum: [store_reported, independent_provider]}
        status: {enum: [pending, active, degraded, revoked, disabled]}
        capabilities: {type: object}
        api_version: {type: [string, "null"]}
        connector_version: {type: [string, "null"]}
        last_heartbeat_at: {type: [string, "null"], format: date-time}
        last_successful_sync_at: {type: [string, "null"], format: date-time}
        webhook_url: {type: [string, "null"], format: uri, description: "Where to point the provider webhook (Stripe, PayPal) or WooCommerce's own order webhooks of a REST API connection (ADR 0077); null for other connectors."}
        app_update:
          type: [object, "null"]
          description: Shopware app only (ADR 0061); null for other connectors.
          properties:
            installed_version: {type: [string, "null"], description: From the shop's webhooks; null until the first one.}
            latest_version: {type: string}
            available: {type: boolean}
            test_download: {type: boolean, description: "True only where the release gate is off (local and test environments): the current app version can be downloaded again at any time to try it on a Shopware shop."}
        health:
          type: object
          description: "Freshness (state, reason, since), last heartbeat self-report, rotation flags. No secrets."
        credentials:
          type: array
          items: {$ref: "#/components/schemas/IntegrationCredential"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Finding:
      type: object
      required: [id, run_id, rule_code, status, currency, evaluated_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        order_id: {type: [string, "null"], format: uuid}
        payment_id: {type: [string, "null"], format: uuid}
        rule_code: {type: string}
        status: {enum: [ok, pending, mismatch, unsupported, unknown]}
        reason_code: {type: [string, "null"]}
        currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        mode: {type: [string, "null"], enum: [live, test, null]}
        currency_exponent: {type: [integer, "null"]}
        expected_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        actual_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        difference_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        gross_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        captured_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        refund_expected_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        refund_actual_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        money_amounts_hidden: {type: boolean, description: "When true, finding amounts are null and evidence is empty."}
        evidence: {type: object}
        evaluated_at: {type: string, format: date-time}
        order_display_number: {type: [string, "null"], description: "Store order number; present in finding lists and incident details."}
    Export:
      type: object
      required: [id, store_id, kind, format, filters, state, content_type, size_bytes, sha256, error_code, download_url, expires_at, created_at, completed_at]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        kind: {enum: [findings, incidents, transactions]}
        format: {enum: [csv]}
        filters: {type: object}
        state: {enum: [processing, ready, failed, deleted]}
        content_type: {type: [string, "null"]}
        size_bytes: {type: [integer, "null"]}
        sha256: {type: [string, "null"]}
        error_code: {type: [string, "null"]}
        download_url: {type: [string, "null"]}
        expires_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
    ReconciliationRunSummary:
      type: object
      required: [run_id, store_id, status, findings_count]
      properties:
        run_id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        order_id: {type: [string, "null"], format: uuid}
        status: {type: string}
        algorithm_version: {type: string}
        config_version: {type: integer}
        findings_count: {type: integer}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
    Order:
      type: object
      required: [id, store_id, external_id, status, currency, currency_exponent, total_minor, financial_support]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        integration_id: {type: string, format: uuid}
        external_id: {type: string}
        display_number: {type: [string, "null"]}
        status: {type: string}
        gateway: {type: [string, "null"]}
        mode: {enum: [live, test]}
        mode_reported:
          type: boolean
          description: "false when the store did not report the payment's test/live mode (REST API connection without the plugin, ADR 0024); mode is then the live default and, against a test-mode provider, money checks are unknown (payment_mode_needs_plugin)."
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        total_minor: {$ref: "#/components/schemas/MoneyMinor"}
        payment_expected: {type: boolean}
        paid_marked_at: {type: [string, "null"], format: date-time}
        payment_state: {type: [string, "null"], enum: [open, pending, authorized, paid, partially_paid, refunded, partially_refunded, failed, cancelled, chargeback, null], description: "The store's own payment status, normalized (ADR 0072); null when the connector does not report it. Never capture evidence."}
        transaction_ref: {type: [string, "null"]}
        financial_support: {enum: [supported, unsupported, unknown]}
        is_synthetic: {type: boolean}
        source_created_at: {type: [string, "null"], format: date-time}
        source_updated_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FinancialTransaction:
      type: object
      required: [id, payment_id, kind, status, currency, amount_minor]
      properties:
        id: {type: string, format: uuid}
        payment_id: {type: [string, "null"], format: uuid}
        external_operation_id: {type: string}
        kind: {enum: [capture, refund, fee, dispute_debit, dispute_credit, adjustment]}
        status: {enum: [pending, succeeded, failed, cancelled]}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        occurred_at: {type: [string, "null"], format: date-time}
    Refund:
      type: object
      required: [id, order_id, currency, amount_minor, status]
      properties:
        id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        external_id: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        external_required: {type: [boolean, "null"]}
        provider_ref: {type: [string, "null"]}
        status: {enum: [requested, recorded, cancelled, deleted]}
        occurred_at: {type: [string, "null"], format: date-time}
        updated_at: {type: [string, "null"], format: date-time}
    OrderRevision:
      type: object
      required: [source_revision]
      properties:
        source_revision: {type: integer}
        status: {type: [string, "null"]}
        total_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        observed_at: {type: [string, "null"], format: date-time}
    PaymentAllocation:
      type: object
      required: [id, order_id, payment_id, capture_transaction_id, currency, amount_minor, strategy]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid}
        capture_transaction_id: {type: string, format: uuid}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        strategy: {type: string}
        evidence: {type: object}
        created_by: {type: [string, "null"], format: uuid}
        revoked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    RefundAllocation:
      type: object
      required: [id, refund_id, refund_transaction_id, payment_allocation_id, currency, amount_minor]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        refund_id: {type: string, format: uuid}
        refund_transaction_id: {type: string, format: uuid}
        payment_allocation_id: {type: string, format: uuid}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        strategy: {type: string}
        evidence: {type: object}
        created_by: {type: [string, "null"], format: uuid}
        revoked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    Payment:
      type: object
      required: [id, store_id, mode, currency, status, source_authority]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        integration_id: {type: string, format: uuid}
        external_id: {type: string}
        intent_ref: {type: [string, "null"]}
        charge_ref: {type: [string, "null"]}
        mode: {enum: [live, test]}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        status: {enum: [pending, authorized, captured, failed, cancelled, unknown]}
        source_authority: {enum: [store_reported, independent_provider]}
        source_updated_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UnmatchedPayment:
      type: object
      required: [capture_transaction_id, currency, amount_minor, reason, candidates]
      properties:
        payment_id: {type: [string, "null"], format: uuid}
        capture_transaction_id: {type: string, format: uuid}
        external_operation_id: {type: string, description: Provider operation ID (e.g. the Stripe charge) to look the capture up.}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        mode: {type: [string, "null"]}
        occurred_at: {type: [string, "null"], format: date-time}
        reason: {enum: [no_candidate_found, review_required, other_store_transaction, other_site, other_invoice_prefix]}
        candidates:
          type: array
          description: "Suggestions only, never an allocation."
          items:
            type: object
            required: [order_id, confidence]
            properties:
              order_id: {type: string, format: uuid}
              display_number: {type: [string, "null"]}
              confidence: {enum: [exact_candidate, manual_review]}
              provider_ref: {type: [string, "null"]}
              amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
              currency: {type: string, pattern: "^[A-Z]{3}$"}
              currency_exponent: {type: integer}
              mode: {type: [string, "null"]}
    AttentionSection:
      type: object
      required: [count, level, parts]
      properties:
        count: {type: integer, minimum: 1}
        level: {enum: [crit, warn, note]}
        parts:
          type: array
          items:
            type: object
            required: [code, n, level]
            properties:
              code: {enum: [channels_failing, channels_unverified, subscription_past_due, support_requests_pending, owner_mfa_off]}
              n: {type: integer, minimum: 1}
              level: {enum: [crit, warn, note]}
    MoneyVisibility:
      type: object
      required: [can_view_money_amounts]
      properties:
        can_view_money_amounts: {type: boolean}
    TenantPermission:
      enum: [stores.read, stores.manage, integrations.manage, checks.run, reconciliation.read, reconciliation.run, allocations.manage, incidents.read, incidents.manage, incidents.snooze, notifications.manage, team.manage, money.view, billing.manage, stores.delete, ownership.transfer, members.mfa_reset, support.access, organization.delete]
      description: "Customer member permissions (ADR 0079). stores.read is every member's base; billing.manage, stores.delete, ownership.transfer, members.mfa_reset, support.access and organization.delete belong only to the owner."
    PermissionChange:
      type: object
      description: A preset role or an exact permission list (one of them).
      properties:
        role: {enum: [admin, operator, viewer]}
        permissions: {type: array, maxItems: 19, items: {$ref: "#/components/schemas/TenantPermission"}}
    TeamMember:
      type: object
      required: [user_id, tenant_id, role, is_you, mfa_enabled]
      properties:
        user_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        name: {type: [string, "null"]}
        email: {type: [string, "null"]}
        email_verified: {type: boolean}
        mfa_enabled: {type: boolean}
        role: {enum: [owner, admin, operator, viewer, custom], description: "custom: the list matches no preset."}
        permissions: {type: array, items: {$ref: "#/components/schemas/TenantPermission"}}
        can_edit: {type: boolean, description: The viewer may change this member's permissions or remove them.}
        is_you: {type: boolean}
        created_at: {type: [string, "null"], format: date-time}
    Invitation:
      type: object
      required: [id, email, role, state, expires_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        role: {enum: [admin, operator, viewer, custom]}
        permissions: {type: array, items: {$ref: "#/components/schemas/TenantPermission"}}
        state: {enum: [pending, accepted, revoked, expired]}
        invited_by: {type: [string, "null"]}
        expires_at: {type: string, format: date-time}
        created_at: {type: [string, "null"], format: date-time}
    ProviderIntegration:
      allOf:
        - {$ref: "#/components/schemas/Integration"}
        - type: object
          properties:
            webhook_url: {type: string, format: uri, description: Endpoint to register in the Stripe Dashboard.}
    Incident:
      type: object
      required:
        - id
        - store_id
        - family
        - component
        - state
        - severity
        - title_code
        - revision
        - first_seen_at
        - last_seen_at
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        family: {enum: [money, checkout, checkout_payment, integration]}
        component: {type: string}
        state: {enum: [open, acknowledged, resolved]}
        severity: {enum: [info, warning, critical]}
        title_code: {type: string, description: Stable code; the UI translates it (ru/en/de).}
        currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        mode: {type: [string, "null"], enum: [live, test, null], description: "Financial mode; null when unverified or not applicable."}
        currency_exponent: {type: [integer, "null"], minimum: 0, description: "Exponent of verified_discrepancy_minor, from the linked reconciliation finding; null when unknown."}
        order_id: {type: [string, "null"], format: uuid, description: "Store order of a money incident, from the latest linked reconciliation finding."}
        order_display_number: {type: [string, "null"], description: "The store's own order number of that order."}
        verified_discrepancy_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        money_amounts_hidden: {type: boolean}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        last_good_at: {type: [string, "null"], format: date-time}
        first_bad_at: {type: [string, "null"], format: date-time}
        acknowledged_by: {type: [string, "null"], format: uuid}
        acknowledged_at: {type: [string, "null"], format: date-time}
        resolved_at: {type: [string, "null"], format: date-time}
        resolution_reason: {type: [string, "null"]}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Signal:
      type: object
      required: [id, signal_type, family, severity, confidence, detected_at]
      properties:
        id: {type: string, format: uuid}
        signal_type: {enum: [reconciliation_finding, payment_attempts, connector_freshness, browser_check]}
        family: {type: string}
        component: {type: string}
        severity: {enum: [info, warning, critical]}
        confidence: {enum: [observed, corroborated, inferred, unknown]}
        rule_version: {type: string}
        config_version: {type: integer}
        currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        finding_id: {type: [string, "null"], format: uuid}
        evidence: {type: object, description: Sanitized facts; no customer data.}
        detected_at: {type: string, format: date-time}
    IncidentActivity:
      type: object
      required: [id, incident_id, kind, created_at]
      properties:
        id: {type: string, format: uuid}
        incident_id: {type: string, format: uuid}
        kind:
          enum: [created, signal_linked, acknowledged, comment, resolved, reopened, severity_changed, suppressed]
        actor_id: {type: [string, "null"], format: uuid}
        incident_revision: {type: integer}
        data: {type: object}
        created_at: {type: string, format: date-time}
    IncidentDetail:
      allOf:
        - {$ref: "#/components/schemas/Incident"}
        - type: object
          required: [signals, findings, activity, active_suppression]
          properties:
            signals:
              type: array
              items: {$ref: "#/components/schemas/Signal"}
            findings:
              type: array
              description: Reconciliation findings behind the linked signals, oldest first.
              items: {$ref: "#/components/schemas/Finding"}
            activity:
              type: array
              items: {$ref: "#/components/schemas/IncidentActivity"}
            active_suppression:
              description: Suppression in force now (notifications muted), or null.
              oneOf:
                - {$ref: "#/components/schemas/Suppression"}
                - {type: "null"}
            explanation:
              type: object
              description: "The incident explained for the store owner from the evidence already collected (IncidentExplainer): codes and values only, the texts are cabinet templates (ru/en/de). scenario is capture_unconfirmed, capture_not_recorded, refund_unconfirmed, browser_check_stopped, source_unavailable or null (then only status/outcome/technical are meaningful and the cabinet shows the general advice). variant, params (order, provider, reference, capture, step, error, reason, check_run_id; amounts as {minor, currency, exponent}, left out when amounts are hidden or unknown), evidence [{item, value, params}], causes and steps (codes from IncidentExplainer::TEXT_CODES, only those that fit the case), warning, auto_close, observation {state fresh|partial|unavailable, reason, checked_at} (how current the data is), status detected|unverifiable|resolved_confirmed|closed_by_user (what is known about the problem; closing by hand is not a confirmation), outcome {code confirmed_fixed|closed_by_user|still_present|not_rechecked, at, reason} and technical ids (rule, reason, PaymentIntent, charge, capture operations, check run)."
    Suppression:
      type: object
      required: [id, incident_id, reason, starts_at, ends_at]
      properties:
        id: {type: string, format: uuid}
        incident_id: {type: string, format: uuid}
        reason: {type: string}
        created_by: {type: [string, "null"], format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    NotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        min_severity: {enum: [info, warning, critical]}
        locale: {enum: [ru, en, de]}
        timezone: {type: string}
        quiet_hours:
          type: [object, "null"]
          required: [start, end]
          properties:
            start: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$"}
            end: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$"}
        critical_bypasses_quiet_hours: {type: boolean}
        notify_recovery: {type: boolean}
        reminder_hours:
          type: [integer, "null"]
          minimum: 24
          maximum: 720
        daily_digest_at:
          type: [string, "null"]
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          description: Local time (channel timezone) of the daily digest (ADR 0067); null turns it off. Quiet hours defer it.
        store_ids:
          type: [array, "null"]
          maxItems: 100
          items: {type: string, format: uuid}
    NotificationChannel:
      type: object
      required: [id, kind, label, destination_masked, enabled, preferences, effective_preferences, health]
      properties:
        id: {type: string, format: uuid}
        kind: {enum: [email, telegram]}
        label: {type: string}
        destination_masked: {type: string}
        enabled: {type: boolean}
        verified_at: {type: [string, "null"], format: date-time}
        preferences: {$ref: "#/components/schemas/NotificationPreferences"}
        effective_preferences: {$ref: "#/components/schemas/NotificationPreferences"}
        health: {type: object}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NotificationDelivery:
      type: object
      required: [id, channel_id, notification_kind, status, attempts]
      properties:
        id: {type: string, format: uuid}
        incident_id: {type: [string, "null"], format: uuid}
        channel_id: {type: string, format: uuid}
        notification_kind: {enum: [incident_opened, incident_reopened, incident_recovered, incident_reminder, daily_digest, test]}
        incident_revision: {type: [integer, "null"]}
        template_version: {type: string}
        status: {enum: [queued, sending, sent, uncertain, failed, dead_letter, suppressed]}
        delivery_uncertain: {type: boolean}
        attempts: {type: integer}
        next_attempt_at: {type: [string, "null"], format: date-time}
        sent_at: {type: [string, "null"], format: date-time}
        error_code: {type: [string, "null"]}
        content: {type: object, description: "Sanitized rendered message (subject, body, locale); no customer data."}
        created_at: {type: string, format: date-time}
        content: {type: object, description: "Sanitized template input, no PII."}
        created_at: {type: string, format: date-time}
    CheckScenario:
      type: object
      required:
        - id
        - store_id
        - name
        - mode
        - version
        - enabled
        - adapter_version
        - interval_seconds
        - supported_steps
        - untested_components
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        name: {type: string}
        mode: {const: payment_form}
        version: {type: integer, minimum: 1}
        enabled: {type: boolean}
        adapter_version: {type: string}
        product_external_id: {type: [string, "null"]}
        product_url: {type: [string, "null"], format: uri}
        cart_url: {type: [string, "null"], format: uri}
        checkout_url: {type: [string, "null"], format: uri}
        extra_allowed_origins:
          type: array
          items: {type: string, format: uri}
        synthetic_location:
          type: [object, "null"]
          properties:
            country: {type: string, pattern: "^[A-Z]{2}$"}
            postcode: {type: [string, "null"]}
        platform: {type: string, description: Store platform; picks the checkout adapter.}
        checkout_access:
          type: [string, "null"]
          enum: [stop_before_sign_in, test_customer, guest, null]
          description: "How the check reaches payment methods on platforms that show them only to a signed-in or registered customer (Shopware, ADR 0055); null where not used (WooCommerce)."
        sign_in_configured: {type: boolean, description: A test customer account is stored (never returned).}
        interval_seconds: {type: integer, minimum: 300, maximum: 86400}
        next_due_at: {type: [string, "null"], format: date-time}
        supported_steps:
          type: array
          items: {type: string}
        untested_components:
          type: array
          items: {type: string}
    CheckScenarioInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        product_url: {type: string, format: uri, description: HTTPS on the store origin.}
        cart_url: {type: [string, "null"], format: uri}
        checkout_url: {type: [string, "null"], format: uri}
        product_external_id: {type: [string, "null"], maxLength: 255}
        interval_seconds: {type: integer, minimum: 300, maximum: 86400}
        enabled: {type: boolean, description: Requires a verified store.}
        extra_allowed_origins:
          type: array
          maxItems: 10
          items: {type: string, format: uri}
          description: Public HTTPS gateway/CDN origins the check may load.
        synthetic_location:
          type: [object, "null"]
          additionalProperties: false
          required: [country]
          properties:
            country: {type: string, pattern: "^[A-Za-z]{2}$"}
            postcode: {type: [string, "null"], maxLength: 16}
        checkout_access:
          type: [string, "null"]
          enum: [stop_before_sign_in, test_customer, guest, null]
          description: Shopware only. Switching away from test_customer deletes the stored account.
        sign_in:
          type: [object, "null"]
          additionalProperties: false
          required: [email, password]
          description: Write-only test customer account for checkout_access test_customer; stored encrypted, sent to the worker only for one attempt.
          properties:
            email: {type: string, format: email, maxLength: 255}
            password: {type: string, minLength: 1, maxLength: 255}
    CheckRun:
      type: object
      required: [id, store_id, scenario_id, scenario_version, trigger, status, scheduled_at]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        scenario_id: {type: string, format: uuid}
        scenario_version: {type: integer}
        trigger: {enum: [scheduled, manual, incident, support], description: "support: rerun by platform staff for the customer (ADR 0048), not counted against the customer's manual runs"}
        status: {enum: [queued, running, passed, failed, inconclusive, blocked, unsupported, cancelled]}
        error_code: {type: [string, "null"]}
        scheduled_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
    CheckArtifact:
      type: object
      required: [id, kind, content_type, size_bytes, expires_at]
      properties:
        id: {type: string, format: uuid}
        kind: {enum: [screenshot]}
        content_type: {enum: [image/jpeg, image/png]}
        size_bytes: {type: integer}
        redaction_version: {type: string}
        expires_at: {type: string, format: date-time}
    CheckRunDetail:
      allOf:
        - {$ref: "#/components/schemas/CheckRun"}
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: array
              items:
                type: object
                required: [id, attempt_number, status, steps, artifacts]
                properties:
                  id: {type: string, format: uuid}
                  attempt_number: {type: integer}
                  status: {enum: [running, passed, failed, inconclusive, blocked, unsupported, cancelled, expired]}
                  error_code: {type: [string, "null"]}
                  location: {type: string}
                  browser_version: {type: string}
                  started_at: {type: string, format: date-time}
                  finished_at: {type: [string, "null"], format: date-time}
                  diagnostics: {type: [object, "null"], description: redaction_version and relevant_errors (sanitized metadata).}
                  artifacts:
                    type: array
                    items: {$ref: "#/components/schemas/CheckArtifact"}
                  steps:
                    type: array
                    items:
                      type: object
                      required: [index, code, status]
                      properties:
                        index: {type: integer}
                        code: {type: string}
                        status: {enum: [passed, failed, skipped, inconclusive, blocked]}
                        error_code: {type: [string, "null"]}
                        started_at: {type: string, format: date-time}
                        finished_at: {type: string, format: date-time}
                        assertions:
                          type: array
                          items: {type: object}
                        network_summary:
                          type: array
                          items: {type: object}
    Heartbeat:
      type: object
      additionalProperties: false
      properties:
        backlog_count: {type: integer, minimum: 0}
        oldest_pending_at: {type: [string, "null"], format: date-time}
        plugin_version: {type: string, maxLength: 64}
    BrowserLease:
      type: object
      additionalProperties: false
      required: [attempt_id, run_id, store_id, fencing_token, lease_token, lease_until, absolute_deadline_at, scenario, network_policy]
      properties:
        attempt_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        fencing_token: {type: integer, minimum: 1}
        lease_token: {type: string, minLength: 32}
        lease_until: {type: string, format: date-time}
        absolute_deadline_at: {type: string, format: date-time}
        scenario:
          type: object
          required: [version, adapter_version, mode, store_origin, product_url, cart_url, checkout_url, steps]
          properties:
            version: {type: integer, minimum: 1}
            adapter_version: {type: string}
            mode: {const: payment_form}
            store_origin: {type: string, format: uri}
            product_url: {type: string, format: uri}
            cart_url: {type: string, format: uri}
            checkout_url: {type: string, format: uri}
            synthetic_token: {type: string, description: Short-lived store and run bound signed token, never logged.}
            platform: {type: string}
            checkout_access: {type: [string, 'null'], enum: [stop_before_sign_in, test_customer, guest, null]}
            expect_checkout_script: {type: boolean, description: The confirm page should carry the app's observation script (ADR 0057).}
            checkout_layout:
              type: [object, "null"]
              description: "Shopware: the checkout paths and selectors the customer set (ADR 0075); a missing field means the adapter's default. Null for other platforms."
              additionalProperties: {type: string}
            sign_in:
              type: [object, 'null']
              description: Test customer account for checkout_access test_customer (ADR 0055); only in the lease, never in the stored run snapshot, never logged.
              properties:
                email: {type: string}
                password: {type: string}
            synthetic_location:
              type: [object, 'null']
              properties:
                country: {type: string, pattern: '^[A-Z]{2}$'}
                postcode: {type: [string, 'null'], maxLength: 16}
            steps:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: object
                required: [code, action]
                properties:
                  code: {type: string}
                  action: {enum: [goto, click_safe, fill_synthetic, select, assert_visible, assert_cart, wait_response, sign_in], description: "sign_in: signs in with the lease's test customer account (ADR 0055)."}
                  target: {enum: [product_url, cart_url, checkout_url], description: Scenario URL the step navigates to; selectors live in the versioned worker adapter.}
                  selector: {type: string, maxLength: 1000}
                  timeout_ms: {type: integer, minimum: 1000, maximum: 30000}
        network_policy:
          type: object
          required: [version, allowed_origins, blocked_operations]
          properties:
            version: {type: string}
            allowed_origins: {type: array, items: {type: string, format: uri}}
            blocked_operations: {type: array, items: {type: string}}
            quiet_paths: {type: array, items: {type: string, pattern: "^/"}, description: "Paths on the store's origin the check never requests and does not report (the Shopware app's observation endpoint, ADR 0062), so the check is not counted as a shopper."}
    BrowserResult:
      type: object
      additionalProperties: false
      required: [fencing_token, status, finished_at, steps, diagnostics]
      properties:
        fencing_token: {type: integer, minimum: 1}
        status: {type: string, enum: [passed, failed, inconclusive, blocked, unsupported, cancelled]}
        finished_at: {type: string, format: date-time}
        error_code: {type: [string, 'null'], maxLength: 128}
        steps:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [index, code, status, started_at, finished_at, assertions]
            properties:
              index: {type: integer, minimum: 0}
              code: {type: string, maxLength: 128}
              status: {enum: [passed, failed, skipped, inconclusive, blocked]}
              started_at: {type: string, format: date-time}
              finished_at: {type: string, format: date-time}
              assertions:
                type: array
                maxItems: 20
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    code: {type: string}
                    passed: {type: boolean}
                    detail_code: {type: string}
              network_summary:
                type: array
                maxItems: 50
                items:
                  type: object
                  additionalProperties: false
                  description: Path without query string or fragment; no headers or bodies.
                  properties:
                    method: {type: string}
                    origin: {type: string}
                    path: {type: string, pattern: '^[^?#@]*$'}
                    status: {type: [integer, 'null']}
                    duration_ms: {type: integer}
                    party: {enum: [first, gateway, third]}
                    failure: {type: string}
              error_code: {type: [string, 'null']}
        diagnostics:
          type: object
          additionalProperties: false
          description: Sanitized metadata only, no response bodies, secrets, cookies or full headers.
          required: [redaction_version, relevant_errors]
          properties:
            redaction_version: {type: string}
            public_error_count: {type: integer, minimum: 0, description: Exact number of reportable first-party browser messages in a public check, including entries beyond the 100-group detail cap.}
            public_errors_truncated: {type: boolean}
            relevant_errors:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                properties:
                  type: {type: string}
                  party: {enum: [first, gateway, third]}
                  origin: {type: string}
                  path: {type: string, pattern: '^[^?#@]*$'}
                  status: {type: [integer, 'null']}
                  step_code: {type: string}
                  message_code: {type: string}
                  cause_code: {enum: [deprecated_api, resource_load, tracking_or_consent, script_exception, network_failure, server_response, resource_http_error, mime_type_mismatch, content_security_policy, unclassified_script]}
                  count: {type: integer}
        artifact_ids:
          type: array
          maxItems: 10
          items: {type: string, format: uuid}
