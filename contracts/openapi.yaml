  /api/v1/overview:
    get:
      tags: [Incidents]
      operationId: getOverview
      description: "Tenant summary for the dashboard (ADR 0018). Discrepancies are verified amounts of active money incidents, summed per currency and component only; incidents without a verified amount are counted separately. Not a loss figure. Without money.view total_minor is null. Without incidents.read `incidents` is null, without reconciliation.read `discrepancies` and `unknown_amount_incidents` are null (ADR 0079) — hidden, not zero."
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                type: object
                required: [incidents, discrepancies, unknown_amount_incidents, money_amounts_hidden, recent_checks]
                properties:
                  incidents:
                    type: [object, "null"]
                    required: [active, by_severity, latest]
                    properties:
                      active: {type: integer}
                      by_severity:
                        type: object
                        required: [critical, warning, info]
                        properties:
                          critical: {type: integer}
                          warning: {type: integer}
                          info: {type: integer}
                      latest:
                        type: array
                        maxItems: 5
                        items: {$ref: "#/components/schemas/Incident"}
                  discrepancies:
                    type: [array, "null"]
                    items:
                      type: object
                      required: [mode, currency, component, total_minor, incident_count]
                      properties:
                        mode: {type: [string, "null"], enum: [live, test, null], description: "Provider mode; null means unverified. Amounts are never combined across modes."}
                        currency: {type: string, pattern: "^[A-Z]{3}$"}
                        currency_exponent: {type: [integer, "null"]}
                        component: {type: string}
                        total_minor:
                          oneOf:
                            - {$ref: "#/components/schemas/MoneyMinor"}
                            - {type: "null"}
                        incident_count: {type: integer}
                  unknown_amount_incidents: {type: [integer, "null"]}
                  capacity_paused_stores: {type: integer, description: "Stores paused by the plan (ADR 0037 point 7): nothing is received or reconciled for them, so their money results are unknown — not zero and not healthy."}
                  money_amounts_hidden: {type: boolean}
                  recent_checks:
                    type: array
                    maxItems: 5
                    items: {$ref: "#/components/schemas/CheckRun"}
        "401": {$ref: "#/components/responses/Problem"}
