      tags: [Platform]
      operationId: platformServiceHealth
      description: "Capability service.read (owner, admin). Read-only service summary (ADR 0051, OWNER-PANEL §7): database/redis/cache/keyring, queues (event inbox, domain outbox, billing events with last received time, reconciliation backlog, notification deliveries, jobs) with waiting count, age of the oldest waiting entry and problem count (dead letters/quarantine, failed notifications and jobs in the last 24 h), browser checks waiting/running with workers seen in 5 minutes, connectors without a successful sync for 24 h, thresholds, release and runtime versions. Each part has state ok/warn/crit (older than 15 min warn, 60 min crit). Aggregates only, no customer data; no-store. `queues.jobs` reads the queue the workers take jobs from (QUEUE_CONNECTION, Redis in production; queues sync and default): pending (waiting), delayed, reserved (running), age of the oldest pending job, failed jobs of the last day (problems), workers alive (queue_worker_heartbeats: waited within 120 s or inside a job started within 960 s) and the last finished job; crit when the oldest pending job is older than the critical age, when pending jobs wait over 5 minutes with no worker alive, or when the queue does not answer (error queue_unavailable)."
      security:
        - {StaffSession: []}
      responses:
        "200":
          description: Service summary
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/health/dead-outbox:
    get:
      tags: [Platform]
      operationId: platformDeadOutbox
      description: "Capability service.manage (implies service.read). Up to 50 oldest domain_outbox dead-letter records, ordered by created_at then id. Only id, topic, error_code, attempts and created_at; no tenant identifiers or payloads. No-store. ADR 0051."
      security:
        - {StaffSession: []}
      responses:
        "200":
          description: Dead-letter entries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, topic, error_code, attempts, created_at]
                      properties:
                        id: {type: string, format: uuid}
                        topic: {type: string}
                        error_code: {type: string, nullable: true}
                        attempts: {type: integer}
                        created_at: {type: string, format: date-time}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/health/dead-outbox/{message}/retry:
    post:
      tags: [Platform]
      operationId: platformRetryDeadOutbox
      description: "Capability service.manage. A valid authenticator code and reason requeue exactly one domain_outbox record only if it is still dead_letter; reset attempts to zero, clear lease/error and make it due now. Existing dispatcher processes it asynchronously. Success and denied attempts are audited with the target record and tenant. Repeating the request returns 409 outbox_not_dead. No-store. ADR 0051."
      security:
        - {StaffSession: []}
      parameters:
        - {name: message, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmation_code]
              properties:
                reason: {type: string, minLength: 3, maxLength: 500}
                confirmation_code: {type: string, maxLength: 32}
      responses:
        "200":
          description: Requeued
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string, format: uuid}
                  status: {type: string, enum: [pending]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/staff:
    get:
      tags: [Platform]
      operationId: platformListStaff
      description: "Capability staff.manage (owner). Platform staff (name, email, role, effective capabilities, state, authenticator connected, created, disabled, last sign-in), pending staff invitations with their capabilities (ADR 0052), and for the permission editor (ADR 0064): capability_catalog (every capability in panel order with owner_only — staff.manage and refunds.approve are never given to a member), presets (the former fixed roles platform_admin, platform_support, platform_billing as capability lists) and implies (a capability that brings another one along)."
      security:
        - {StaffSession: []}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/staff/invitations:
    post:
      tags: [Platform]
      operationId: platformInviteStaff
      description: "Capability staff.manage. Invites a staff member by email: role platform_owner (everything) or platform_member with capabilities (at least one, only assignable ones, implied ones are added; else 422 capabilities_invalid; ignored for an owner); the link is valid 72 h, an earlier pending invitation of the address is revoked, an existing staff account answers 409 already_staff. Needs a reason and the authenticator code (403 step_up_failed). Audited as staff.invited with the invited address (ADR 0052 owner decision)."
      security:
        - {StaffSession: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role, reason, confirmation_code]
              properties:
                email: {type: string, format: email, maxLength: 254}
                role: {enum: [platform_owner, platform_member]}
                capabilities: {type: [array, "null"], items: {type: string}, maxItems: 50}
                reason: {type: string, minLength: 3, maxLength: 500}
                confirmation_code: {type: string, maxLength: 32}
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/staff/invitations/{invitation}/revoke:
    post:
      tags: [Platform]
      operationId: platformRevokeStaffInvitation
      description: "Capability staff.manage. Revokes a pending staff invitation with a reason; audited."
      security:
        - {StaffSession: []}
      parameters:
        - {name: invitation, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        "204": {description: Done}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/staff/{staff}:
    patch:
      tags: [Platform]
      operationId: platformUpdateStaff
      description: "Capability staff.manage. Changes the role (platform_owner / platform_member), the capabilities of a member (422 capabilities_invalid as for an invitation; a member becoming an owner loses the list, an owner becoming a member needs one) and/or disables or re-enables a staff member with a reason and the authenticator code; not oneself (409 self_change) and never the last active owner (409 last_owner). Ends that member's sessions. Audited with before/after. Returns the staff catalog."
      security:
        - {StaffSession: []}
      parameters:
        - {name: staff, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmation_code]
              properties:
                role: {enum: [platform_owner, platform_member]}
                capabilities: {type: [array, "null"], items: {type: string}, maxItems: 50}
                state: {enum: [active, disabled]}
                reason: {type: string, minLength: 3, maxLength: 500}
                confirmation_code: {type: string, maxLength: 32}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/staff/{staff}/sessions/revoke:
    post:
      tags: [Platform]
      operationId: platformRevokeStaffSessions
      description: "Capability staff.manage. Signs a staff member out of every session (not oneself) with a reason; audited."
      security:
        - {StaffSession: []}
      parameters:
        - {name: staff, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        "204": {description: Done}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/staff/{staff}/mfa/reset:
    post:
      tags: [Platform]
      operationId: platformResetStaffMfa
      description: "Capability staff.manage (platform owner, ADR 0052). Resets the authenticator of a staff member who is not a platform owner (409 owner_mfa_server_only — that is only platform:reset-mfa on the server) and not oneself (409 self_change), with a reason and the owner's authenticator code (403 step_up_failed). The old authenticator stops working, the member's sessions end, and a link (72 h, purpose mfa_reset on the staff-invitation pages) to connect a new one with their password is e-mailed. Audited (staff.mfa_reset; joining back: staff.mfa_reenrolled). Returns the staff catalog."
      security:
        - {StaffSession: []}
      parameters:
        - {name: staff, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmation_code]
              properties:
                reason: {type: string, minLength: 3, maxLength: 500}
                confirmation_code: {type: string, maxLength: 32}
      responses:
        "200":
          description: Staff catalog
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/staff-invitations/lookup:
    get:
      tags: [Platform]
      operationId: platformLookupStaffInvitation
      description: "Public. What a staff invitation offers (email, role, expiry) and whether an account with that email exists; 422 invitation_invalid for unknown, expired, revoked or used links."
      security: []
      parameters:
        - {name: token, in: query, required: true, schema: {type: string, maxLength: 128}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/staff-invitations/start:
    post:
      tags: [Platform]
      operationId: platformStartStaffInvitation
      description: "Public. Starts accepting: a new account sets a name and a password (min 12), an existing account proves its password (422 password_wrong). Returns the authenticator setup (secret, otpauth URI, QR SVG) or mfa_enabled when the account already has one. The account becomes staff only after confirm."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: {type: string, maxLength: 128}
                name: {type: [string, "null"], maxLength: 100}
                password: {type: string, minLength: 12, maxLength: 128}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/staff-invitations/confirm:
    post:
      tags: [Platform]
      operationId: platformConfirmStaffInvitation
      description: "Public, same browser session as start. Confirms the authenticator code (422 mfa_code_invalid, 409 invitation_not_started), creates the staff member with the invited role, marks the invitation used and returns recovery codes shown once (empty when the authenticator existed). Audited as staff.joined."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, code]
              properties:
                token: {type: string, maxLength: 128}
                code: {type: string, maxLength: 32}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {type: object}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/audit:
    get:
      tags: [Platform]
      operationId: platformListAudit
      description: "Capability audit.read (owner, admin). Platform audit (ADR 0053), newest first, 50 per page with next_cursor: time, actor, action, result and a localized presentation (title, human-readable description with capability-scoped reason, named object link, detail lines). Names and links are resolved at read time under the viewer's capabilities; deleted objects show Deleted. Raw sanitized changes, reasons and request IDs are not returned as separate fields. Also includes action and staff filter options. Filters by actor, exact action, target, organisation, result and UTC dates (both included)."
      security:
        - {StaffSession: []}
      parameters:
        - {name: actor, in: query, required: false, schema: {type: string, maxLength: 64}, description: "staff id or system"}
        - {name: action, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: target_type, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: target_id, in: query, required: false, schema: {type: string, maxLength: 128}}
        - {name: tenant, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: result, in: query, required: false, schema: {enum: [requested, succeeded, failed, denied, unknown]}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
        - {name: cursor, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Audit page
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/audit/export:
    get:
      tags: [Platform]
      operationId: platformExportAudit
      description: "Capability audit.read. CSV of the filtered audit (at most 10 000 newest rows) with the same localized human-readable description and capability-scoped names as the page; no raw JSON, target IDs, hashes or request IDs. Cells starting with = + - @ are prefixed with a quote; no-store. The export itself is audited as audit.exported with the filters."
      security:
        - {StaffSession: []}
      parameters:
        - {name: actor, in: query, required: false, schema: {type: string, maxLength: 64}, description: "staff id or system"}
        - {name: action, in: query, required: false, schema: {type: string, maxLength: 100}}
        - {name: target_type, in: query, required: false, schema: {type: string, maxLength: 64}}
        - {name: target_id, in: query, required: false, schema: {type: string, maxLength: 128}}
        - {name: tenant, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: result, in: query, required: false, schema: {enum: [requested, succeeded, failed, denied, unknown]}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/settings:
    get:
      tags: [Platform]
      operationId: platformSettings
      description: "Capability settings.manage (owner). Read-only configuration (ADR 0054): environment, release, billing enforcement, Paddle environment/account with configured flags and short sha256 fingerprints of the key, client token and webhook secret (never the values), mail, Telegram, session limits, retention, site notification recipients count; and the maintenance window: current, last 20 versions with who/when/why, limits. no-store."
      security:
        - {StaffSession: []}
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/settings/maintenance:
    post:
      tags: [Platform]
      operationId: platformScheduleMaintenance
      description: "Capability settings.manage. Publishes a new version of the maintenance window (replaces a current one): start and end (end after start and in the future, at most 24 h long, start at most 90 days ahead: 422 maintenance_window_invalid), a message in ru, en and de (3–300 characters: 422 maintenance_message_invalid), reason and authenticator code. Customers see the message in their account until the end. Audited."
      security:
        - {StaffSession: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, ends_at, messages, reason, confirmation_code]
              properties:
                starts_at: {type: string, format: date-time}
                ends_at: {type: string, format: date-time}
                messages:
                  type: object
                  required: [ru, en, de]
                  properties:
                    ru: {type: string, minLength: 3, maxLength: 300}
                    en: {type: string, minLength: 3, maxLength: 300}
                    de: {type: string, minLength: 3, maxLength: 300}
                reason: {type: string, minLength: 3, maxLength: 500}
                confirmation_code: {type: string, maxLength: 32}
      responses:
        "201":
          description: Settings
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/settings/maintenance/cancel:
    post:
      tags: [Platform]
      operationId: platformCancelMaintenance
      description: "Capability settings.manage. Cancels the current or upcoming maintenance window with a reason and the authenticator code (409 maintenance_not_scheduled). Audited."
      security:
        - {StaffSession: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmation_code]
              properties:
                reason: {type: string, minLength: 3, maxLength: 500}
                confirmation_code: {type: string, maxLength: 32}
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/pages:
    get:
      tags: [Platform]
      operationId: platformListPages
      description: "Capability content.manage. Pages of the public site (ADR 0039), not archived, by path: kind (home, pricing, contact are system pages; page), parent, slug fixed at creation, menu (none, header, footer), sort, editable (false for pricing and contact, whose text is changed only in code) and per language whether a draft exists and when the current version was published."
