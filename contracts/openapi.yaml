        "403": {$ref: "#/components/responses/Problem"}
    post:
      tags: [Team]
      operationId: requestOrganizationDeletion
      security:
        - {UserSession: []}
      description: "Owner only. Step-up and the exact organization name. Stops the service at once, cancels a paid Paddle subscription immediately (503 subscription_cancel_failed changes nothing), purges after 30 days (ADR 0069). organization_name_mismatch (422), deletion_already_requested (409)."
