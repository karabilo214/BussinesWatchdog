      description: "Capability content.manage. Renders unsaved content with the site layout (noindex) after the same sanitizing as saving; nothing is stored; an empty home body shows the built-in text. Returns the sanitized body and a complete HTML document for a sandboxed frame. Pricing and contact: 409 edited_in_code."
