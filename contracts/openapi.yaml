        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                base_url: {type: string, format: uri, description: Changing it clears verification and browser checks.}
                timezone: {type: string}
                locale: {enum: [ru, en, de]}
                default_currency: {type: string, pattern: "^[A-Z]{3}$"}
                status: {enum: [paused, active]}
                browser_enabled: {type: boolean}
                telemetry_enabled: {type: boolean}
                platform: {enum: [woocommerce, shopware]}
                platform_change_confirmed: {type: boolean, description: Required when changing platform; confirms irreversible deletion of previous store data.}
      responses:
        "200":
          description: Updated
