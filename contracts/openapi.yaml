  /api/v1/ingest/heartbeat:
    post:
      tags: [Ingestion]
      operationId: ingestHeartbeat
      description: Every 5 minutes. Three missing heartbeats mark the connector stale; an old oldest_pending_at marks it partial (ADR 0009).
      parameters:
        - {$ref: "#/components/parameters/SignatureTimestamp"}
        - {$ref: "#/components/parameters/SignatureNonce"}
        - {$ref: "#/components/parameters/Signature"}
        - {$ref: "#/components/parameters/SignatureVersion"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Heartbeat"}
      responses:
        "200":
          description: Self-report stored; a heartbeat does not prove complete order coverage
          content:
            application/json:
              schema:
                type: object
                required: [status, integration_id, credential_rotation_requested, store_verification]
                properties:
                  status: {const: ok}
                  integration_id: {type: string, format: uuid}
                  credential_rotation_requested: {type: boolean}
                  store_verification:
                    type: [object, "null"]
                    description: Pending plugin challenge the connector must serve publicly.
                    properties:
                      id: {type: string, format: uuid}
                      challenge: {type: string}
                      url: {type: string, format: uri}
                  checkout_observation:
                    type: object
                    description: Whether the plugin should put the checkout observation script on the store and count checkout pages (ADR 0059).
                    properties:
                      observe: {type: boolean}
                  store_paused: {type: boolean, description: "The store is paused by the plan (ADR 0037 point 7): events are answered skipped and not kept."}
                  backfill_requested_at:
                    type: [string, "null"]
                    format: date-time
                    description: Set after a capacity pause ended. A connector that has not yet handled this exact value sends the current snapshot of every order changed since backfill_since once, even when it sent that snapshot during the pause, so the paused period is caught up.
                  backfill_since: {type: [string, "null"], format: date-time, description: "When the last capacity pause began."}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
      security:
        - {IntegrationKeyId: []}
  /api/v1/ingest/credentials/rotate:
    post:
      tags: [Ingestion]
      operationId: rotateConnectorCredential
      description: Called by the connector after the heartbeat reports credential_rotation_requested.
      parameters:
        - {$ref: "#/components/parameters/SignatureTimestamp"}
        - {$ref: "#/components/parameters/SignatureNonce"}
        - {$ref: "#/components/parameters/Signature"}
        - {$ref: "#/components/parameters/SignatureVersion"}
      responses:
        "201":
          description: New credential issued once; the previous key drains
          content:
