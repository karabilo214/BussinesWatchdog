      operationId: platformApplyTenantAction
      description: "Capability tenants.manage. Applies the previewed action with a reason and a fresh authenticator code (403 step_up_failed); every attempt is in the platform audit with access before/after. Suspension does not cancel billing; resume does not mark anything paid — access is recalculated by the usual policy. Returns the organisation card."
      security:
        - {StaffSession: []}
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: action, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/PlatformTenantActionInput"}
                - type: object
                  required: [reason, confirmation_code]
                  properties:
                    reason: {type: string, minLength: 3, maxLength: 500}
                    confirmation_code: {type: string}
      responses:
        "200":
          description: Organisation card after the action
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
