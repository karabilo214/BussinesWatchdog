      tags: [Platform]
      operationId: platformUpdateContactRequest
      description: "Capability contacts.manage. Changes the status (new, in_progress, closed) and the internal note; audited without the note text. Closed messages are deleted after the retention period (site:contact-purge)."
      security:
        - {StaffSession: []}
