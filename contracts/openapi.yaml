  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      description: Generic failure that does not reveal whether the e-mail exists; 5 per minute per e-mail+IP. With MFA on, a correct password answers {mfa_required true} until POST /auth/mfa/challenge, unless this browser has a valid 30-day trusted-device cookie for this exact user. Sensitive step-up actions still require MFA (ADR 0021).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                remember: {type: boolean}
      responses:
        "200":
          description: Session started, or the second factor is required
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/AuthSession"}
                  - {$ref: "#/components/schemas/MfaRequired"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/challenge:
    post:
      tags: [Auth]
      operationId: completeMfaChallenge
      description: Second sign-in step for the sign-in waiting in this session (5 minutes, 5 attempts) with an authenticator code or an unused recovery code; each code works once. Optional remember_device issues a 30-day trusted-device cookie after success. mfa_challenge_expired (401) sends the user back to the password; 10 per minute per IP.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, maxLength: 32}
                remember_device: {type: boolean, description: "Explicit 30-day device trust opt-in; password remains required at later sign-ins."}
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa:
    get:
      tags: [Auth]
      operationId: showMfa
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Second-factor state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaState"}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      operationId: beginMfaSetup
      security:
        - {UserSession: []}
      description: Requires the current password; issues a new secret that changes nothing until confirmed. mfa_already_enabled (409) when MFA is on. 10 per minute per user.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: {type: string, maxLength: 128}
      responses:
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri, qr_svg]
                properties:
                  secret: {type: string, description: Base32}
                  otpauth_uri: {type: string}
                  qr_svg: {type: string, description: SVG image of otpauth_uri}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/confirm:
    post:
      tags: [Auth]
      operationId: confirmMfa
      security:
        - {UserSession: []}
      description: A code from the app turns MFA on and returns 10 recovery codes once; every other session of the user ends.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, maxLength: 32}
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaStateWithCodes"}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/disable:
    post:
      tags: [Auth]
      operationId: disableMfa
      security:
        - {UserSession: []}
      description: Requires the current password and an authenticator or recovery code.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StepUp"}
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaState"}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/recovery-codes:
    post:
      tags: [Auth]
      operationId: regenerateMfaRecoveryCodes
      security:
        - {UserSession: []}
      description: Requires the current password and a code; replaces all recovery codes and returns the new ones once.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StepUp"}
      responses:
        "200":
          description: New codes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaStateWithCodes"}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/passkeys/login/options:
    get:
      tags: [Auth]
      operationId: getPasskeyLoginOptions
      description: Anonymous WebAuthn challenge; 5-minute server lifetime and IP throttling. Requires a stateful session.
      responses:
        "200":
          description: Discoverable-credential request options
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyOptions"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/passkeys/login:
    post:
      tags: [Auth]
      operationId: loginWithPasskey
      description: Verifies a fresh, one-use WebAuthn assertion with user verification and returns a customer session. Disabled users and users without a team are refused. Does not bypass platform staff MFA.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: {type: object, description: Browser WebAuthn assertion JSON}
                remember: {type: boolean}
      responses:
        "200":
          description: Authenticated customer session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/passkeys:
    get:
      tags: [Auth]
      operationId: listAccountPasskeys
      security:
        - {UserSession: []}
      description: Current user's passkey names and times only; credential material is never returned.
      responses:
        "200":
          description: User passkeys
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/AccountPasskey"}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/passkeys/authorize:
    post:
      tags: [Auth]
      operationId: authorizePasskeyRegistration
      security:
        - {UserSession: []}
      description: Current password and MFA/recovery code when enabled authorize registration for five minutes.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StepUp"}
      responses:
        "200": {description: Registration authorized in this session}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/passkeys/register/options:
    get:
      tags: [Auth]
      operationId: getPasskeyRegistrationOptions
      security:
        - {UserSession: []}
      description: Fresh, one-use WebAuthn challenge requiring discoverable credential and user verification.
      responses:
        "200":
          description: Registration options
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyOptions"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/passkeys/register:
    post:
      tags: [Auth]
      operationId: registerAccountPasskey
      security:
        - {UserSession: []}
      description: Verifies origin, RP ID, challenge, user verification and credential uniqueness; consumes registration authorization and audits across the user's teams.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, credential]
              properties:
                name: {type: string, maxLength: 255}
                credential: {type: object, description: Browser WebAuthn attestation JSON}
      responses:
        "201":
          description: Registered passkey
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountPasskey"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/passkeys/{passkey}:
    delete:
      tags: [Auth]
      operationId: deleteAccountPasskey
      security:
        - {UserSession: []}
      description: Deletes only the current user's passkey after password and MFA/recovery code when enabled; audits across teams.
      parameters:
        - {name: passkey, in: path, required: true, schema: {type: integer}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StepUp"}
      responses:
        "204": {description: Passkey deleted}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/trusted-devices:
    get:
      tags: [Auth]
      operationId: listTrustedDevices
      security:
        - {UserSession: []}
      description: Active trusted devices for this customer user; token hashes and cookies are never returned.
      responses:
        "200":
          description: Trusted device summaries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/TrustedDevice"}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/trusted-devices/{device}:
    delete:
      tags: [Auth]
      operationId: revokeTrustedDevice
      security:
        - {UserSession: []}
      description: Revoke only the signed-in user's trusted device, without an MFA challenge. Current-device cookie is cleared when applicable. Audited in every team.
      parameters:
        - {name: device, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "204": {description: Device trust revoked}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      operationId: listAccountSessions
      security:
        - {UserSession: []}
      description: Active customer sessions for the signed-in user only. Session IDs and payloads are never returned.
      responses:
        "200":
          description: Sessions ordered by recent activity
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [current, device, ip_address, last_active_at]
                      properties:
                        current: {type: boolean}
                        device: {type: string, enum: [Chrome, Edge, Firefox, Safari, other, unknown]}
                        ip_address: {type: [string, "null"]}
                        last_active_at: {type: string, format: date-time}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/sessions/revoke-all:
    post:
      tags: [Auth]
      operationId: revokeAllAccountSessions
      security:
        - {UserSession: []}
      description: Ends all customer sessions, including the current one, and revokes all trusted devices. Requires current password and an MFA or recovery code when MFA is enabled. Audited in every team.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StepUp"}
      responses:
        "204": {description: All sessions revoked}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security:
        - {UserSession: []}
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: me
      security:
        - {UserSession: []}
      responses:
        "200":
          description: "Current user, active tenant and memberships"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "401": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [Auth]
      operationId: updateProfile
      security:
        - {UserSession: []}
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "Only the fields sent are changed; an empty optional field is stored as null. An older client's single `name` (without first_name/last_name) is taken as the last name."
              properties:
                salutation: {type: [string, "null"], enum: [mr, ms, diverse, null]}
                first_name: {type: [string, "null"], maxLength: 100}
                last_name: {type: string, minLength: 1, maxLength: 100}
                company_name: {type: [string, "null"], maxLength: 150}
                name: {type: string, maxLength: 100, deprecated: true}
                locale: {enum: [ru, en, de]}
      responses:
        "200":
          description: Updated session view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      description: Same answer for known and unknown addresses; a one-time link (60 min) is mailed to known active users. 3/hour per address, 20/hour per IP.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, maxLength: 255}
      responses:
        "202":
          description: Requested
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {const: requested}}}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/password-reset/complete:
    post:
      tags: [Auth]
      operationId: completePasswordReset
      description: Consumes the token, ends every session of the user and confirms the address. Unknown, wrong or expired tokens all answer password_reset_invalid.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: {type: string, maxLength: 255}
                token: {type: string, maxLength: 128}
                password: {type: string, minLength: 12, maxLength: 128}
                password_confirmation: {type: string}
      responses:
        "204": {description: Password changed}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/email-verification/{user_id}/{hash}:
    get:
      tags: [Auth]
      operationId: verifyEmail
      description: Signed expiring link (24 h) from the email; works without a session and redirects to /app/overview?email_verified=1|0.
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: hash, in: path, required: true, schema: {type: string}}
        - {name: expires, in: query, required: true, schema: {type: integer}}
        - {name: signature, in: query, required: true, schema: {type: string}}
      responses:
        "302": {description: Redirect to the dashboard with the result}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/email-verification/resend:
    post:
      tags: [Auth]
      operationId: resendEmailVerification
      security:
        - {UserSession: []}
      description: Once a minute; 409 email_already_verified.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "202":
          description: Sent
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {const: sent}}}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      security:
        - {UserSession: []}
      description: Requires the current password; ends every other session of the user.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: {type: string, maxLength: 128}
                password: {type: string, minLength: 12, maxLength: 128}
                password_confirmation: {type: string}
      responses:
        "204": {description: Changed}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/ownership-transfer:
    post:
      tags: [Team]
      operationId: transferOwnership
      security:
        - {UserSession: []}
      description: Owner only. The target is an existing member with a confirmed address; it becomes owner and the current owner becomes admin in one transaction (ADR 0021). Requires the current password and, with MFA on, a code. cannot_transfer_to_self, target_email_unverified (422), member_not_found (404).
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/StepUp"}
                - type: object
                  required: [target_user_id]
                  properties:
                    target_user_id: {type: string, format: uuid}
      responses:
        "204": {description: Transferred}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/invitations/lookup:
    get:
      tags: [Team]
      operationId: lookupInvitation
      description: Public; what a pending invitation offers. Unknown, expired, revoked or accepted tokens answer invitation_invalid.
      parameters:
        - {name: token, in: query, required: true, schema: {type: string, maxLength: 128}}
      responses:
        "200":
          description: Pending invitation
          content:
            application/json:
              schema:
                type: object
                required: [tenant_name, email, role, permissions, expires_at, account_exists]
                properties:
                  tenant_name: {type: string}
                  email: {type: string}
                  role: {enum: [admin, operator, viewer, custom]}
                  permissions: {type: array, items: {$ref: "#/components/schemas/TenantPermission"}}
                  expires_at: {type: string, format: date-time}
                  account_exists: {type: boolean}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/invitations/accept:
    post:
      tags: [Team]
      operationId: acceptInvitation
      security:
        - {UserSession: []}
      description: The signed-in user's address must be the invited one; accepting confirms that address and makes the team active.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [token], properties: {token: {type: string, maxLength: 128}}}
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamMember"}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/memberships:
    get:
      tags: [Team]
      operationId: listMembers
      security:
        - {UserSession: []}
      responses:
        "200":
          description: "Members of the active team, what the viewer may give (ADR 0079) and the permission catalog for the picker."
          content:
            application/json:
              schema:
                type: object
                required: [data, assignable_roles, assignable_permissions, permission_catalog]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/TeamMember"}
                  assignable_roles:
                    type: array
                    description: Presets the viewer may apply in full.
                    items: {enum: [admin, operator, viewer]}
                  assignable_permissions:
                    type: array
                    description: "The owner: every assignable permission; a member with team.manage: only their own; others: none."
                    items: {$ref: "#/components/schemas/TenantPermission"}
                  permission_catalog:
                    type: object
                    required: [sections, owner_only, base, implies, presets]
                    properties:
                      sections: {type: object, additionalProperties: {type: array, items: {$ref: "#/components/schemas/TenantPermission"}}, description: "Cabinet section → its permissions, in display order."}
                      owner_only: {type: array, items: {$ref: "#/components/schemas/TenantPermission"}, description: Shown but never given.}
                      base: {type: array, items: {$ref: "#/components/schemas/TenantPermission"}, description: Every member has these.}
                      implies: {type: object, additionalProperties: {type: array, items: {$ref: "#/components/schemas/TenantPermission"}}}
                      presets: {type: object, additionalProperties: {type: array, items: {$ref: "#/components/schemas/TenantPermission"}}, description: "admin/operator/viewer without money.view; seeing amounts is chosen separately."}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/attention:
    get:
      tags: [Tenancy]
      operationId: getAttention
      description: "Menu counters of the customer cabinet that the overview does not carry (Step 264). Only counts and codes, only for what the member may open (ADR 0079); a section without anything to do is null. The level is the most urgent part: crit, then warn, then note."
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Counters
          content:
            application/json:
              schema:
                type: object
                required: [notifications, settings]
                properties:
                  notifications:
                    description: "With notifications.manage: enabled channels whose deliveries fail (crit) and unconfirmed channels (warn)."
                    oneOf:
                      - {type: "null"}
                      - {$ref: "#/components/schemas/AttentionSection"}
                  settings:
                    description: "Owner only: subscription past due (crit), pending support access requests (warn), the owner's own MFA off (warn)."
                    oneOf:
                      - {type: "null"}
                      - {$ref: "#/components/schemas/AttentionSection"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/money-visibility:
    get:
      tags: [Team]
      operationId: getMoneyVisibility
