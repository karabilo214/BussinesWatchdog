        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [Stores]
      operationId: updateStore
      security:
        - {UserSession: []}
      description: Owner/admin; If-Match carries config_version. Activation and browser checks require a verified domain (422 store_not_verified). Platform correction requires explicit confirmation, disconnecting all active integrations, and purges old store-scoped data with an audit entry.
