        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}/sync:
    post:
      tags: [Integrations]
      operationId: syncProviderIntegration
      security:
        - {UserSession: []}
      description: Runs a bounded delta (default) or audit poll now for a Stripe or PayPal integration; twice a minute at most. 502 when the provider request failed (details in integration.health.last_error). A PayPal audit already done in the last 23 hours answers status skipped.
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {kind: {enum: [delta, audit]}}}
      responses:
        "200":
          description: Synchronised
          content:
            application/json:
              schema:
                type: object
                required: [status, emitted, unchanged, complete, integration]
                properties:
                  status: {enum: [ok, failed, skipped]}
                  emitted: {type: integer}
                  unchanged: {type: integer}
                  complete: {type: boolean}
                  error: {type: string}
                  integration: {$ref: "#/components/schemas/ProviderIntegration"}
        "502": {description: Provider request failed}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/webhooks/stripe/{integration_id}:
    post:
      tags: [Integrations]
      operationId: receiveStripeWebhook
      description: "Called by Stripe. The Stripe-Signature header is verified by the official library over the raw body (tolerance 300 s). Only payment_intent, charge and refund objects are used; they go through the same change-detecting path as polling, so repeats are harmless."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Stripe-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema: {type: object, required: [received], properties: {received: {const: true}, emitted: {type: integer}, ignored: {type: string}}}
        "400": {description: Signature invalid}
        "404": {description: Unknown integration}
        "409": {description: No webhook secret configured}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations/paypal:
    post:
      tags: [Integrations]
      operationId: connectPayPal
      security:
        - {UserSession: []}
      description: "Owner/admin (ADR 0022). PayPal REST app credentials always allow refunds and captures, so write_access_acknowledged must be true (paypal_write_access_not_acknowledged otherwise; nothing is sent to PayPal before). The app must have Transaction Search (paypal_transaction_search_missing). The adapter only calls the OAuth token, verify-webhook-signature and an allowlist of GET endpoints. health.write_scopes lists what the credentials could do. Secrets are stored encrypted and never returned. Connecting re-queues the store's reconciliation window."
      parameters:
        - {name: store_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment, client_id, client_secret, write_access_acknowledged]
              properties:
                environment: {enum: [sandbox, live]}
                client_id: {type: string, maxLength: 255}
                client_secret: {type: string, maxLength: 255, writeOnly: true}
                webhook_id: {type: [string, "null"], maxLength: 64}
                write_access_acknowledged: {type: boolean}
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderIntegration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations/woocommerce-api:
    post:
      tags: [Integrations]
      operationId: connectWooCommerceApi
      security:
        - {UserSession: []}
      description: "Owner/admin (ADR 0024). Connects the store's orders through a WooCommerce REST API key with Read permission, on the store's own https base URL (/wp-json/wc/v3, pretty permalinks). The key must read orders (woocommerce_key_rejected, woocommerce_key_not_recognized, woocommerce_api_unavailable otherwise) and must not be able to write (woocommerce_key_not_read_only; checked with a request that cannot change anything). A store has one order source: 409 order_source_already_connected when the plugin is paired, provider_already_connected when a key is already connected. Only GET order endpoints are polled. The key is stored encrypted and never returned. Connecting re-queues the store's reconciliation window."
      parameters:
        - {name: store_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumer_key, consumer_secret]
              properties:
                consumer_key: {type: string, maxLength: 255, pattern: "^ck_[a-f0-9]{40}$"}
                consumer_secret: {type: string, maxLength: 255, writeOnly: true, pattern: "^cs_[a-f0-9]{40}$"}
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderIntegration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations/shopware:
    post:
      tags: [Integrations]
      operationId: connectShopware
      security:
        - {UserSession: []}
      description: "Owner/admin (ADR 0025/0026). Connects a Shopware 6.6/6.7 store's orders through an Integration key (access key + secret) on the store's own https origin. Shopware lets even a read-only role change order, payment and delivery states, so state_change_risk_acknowledged must be true (shopware_state_change_risk_not_acknowledged otherwise; nothing is sent before). The key must get a token (shopware_key_rejected) and search orders (shopware_order_read_missing). Only the OAuth token and order searches are sent, always without customer data. A working key confirms the store (verification method api_key). One order source per store (409 order_source_already_connected / provider_already_connected). Refunds are reported as a payment state (refund_state). The key is stored encrypted and never returned."
      parameters:
        - {name: store_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_key, secret_access_key, state_change_risk_acknowledged]
              properties:
                access_key: {type: string, maxLength: 255, pattern: "^SWIA[A-Za-z0-9]{10,60}$"}
                secret_access_key: {type: string, maxLength: 255, writeOnly: true}
                state_change_risk_acknowledged: {type: boolean}
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderIntegration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations/shopware-app:
    post:
      tags: [Integrations]
      operationId: downloadShopwareApp
      security:
        - {UserSession: []}
      description: "Owner/admin (ADR 0027). Creates the store's pending Shopware app integration and returns the app archive (BusinessWatchdog.zip) to upload in Shopware (Extensions → My extensions → Upload). The manifest has read permissions on store entities and write permissions only on the app's own checkout observation entities. A new archive replaces a still pending one. Production returns 409 shopware_app_release_not_approved before creating an integration unless the exact app source fingerprint and the store UUID are approved. 409 order_source_already_connected / provider_already_connected while another order source is connected. X-Integration-Id names the pending integration."
      parameters:
        - {name: store_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state_change_risk_acknowledged]
              properties:
                state_change_risk_acknowledged: {type: boolean, description: "Must be true: Shopware lets the app's read-only role change order, payment and delivery states (ADR 0025)."}
      responses:
        "200":
          description: App archive
          content:
            application/zip:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations/shopware-app/update:
    post:
      tags: [Integrations]
      operationId: downloadShopwareAppUpdate
      security:
        - {UserSession: []}
      description: "Owner/admin (ADR 0061). The current app version built for the store's connected app integration (same integration, registration URL and manifest secret), to upload in Shopware as an update of the installed app. Production returns 409 shopware_app_release_not_approved unless the exact app source fingerprint and the store UUID are approved. 404 shopware_app_not_connected without an app integration. X-App-Version names the version."
      parameters:
        - {name: store_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200":
          description: App archive
          content:
            application/zip:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/downloads/shopware-app:
    get:
      tags: [Integrations]
      operationId: downloadUniversalShopwareApp
      description: "The one Shopware app archive for every store (ADR 0076), current version; 409 shopware_app_release_not_approved while the version is not approved in production (ADR 0074)."
      security:
        - {UserSession: []}
      responses:
        "200":
          description: ZIP (header X-App-Version)
          content:
            application/zip:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/shopware/app/register:
    get:
      tags: [Integrations]
      operationId: registerUniversalShopwareApp
      security: []
      description: "Shopware's registration of the universal app (ADR 0076): query shop-id, shop-url, timestamp signed with the app secret (header shopware-app-signature). Creates or renews the shop's installation, which belongs to no customer until bound by a pairing code. 409 shopware_app_shop_moved when a bound installation registers from another host."
      responses:
        "200":
          description: Registration accepted
          content:
            application/json:
              schema:
                type: object
                required: [proof, secret, confirmation_url]
                properties:
                  proof: {type: string}
                  secret: {type: string}
                  confirmation_url: {type: string, format: uri}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/shopware/app/confirm:
    post:
      tags: [Integrations]
      operationId: confirmUniversalShopwareApp
      security: []
      description: "The app's API key for a registered installation, signed with the shop secret (header shopware-shop-signature). A bound installation renews its integration's keys."
      responses:
        "200": {description: Confirmed}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/shopware/app/webhook:
    post:
      tags: [Integrations]
      operationId: universalShopwareAppWebhook
      security: []
      description: "Signed webhooks of universal installations (shop id from source.shopId). A bound installation's events go to its integration; an unbound one only records its version or is deleted on app.deleted (result not_bound / deleted)."
      responses:
        "200": {description: Received}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/shopware/app/connect:
    get:
      tags: [Integrations]
      operationId: shopwareAppModule
      security: []
      description: "The app's main module, opened by the Shopware Administration in an iframe with a query signed with the shop secret (shopware-shop-signature, ≤ 1 hour old). HTML page (de/en) with the pairing code form; framed only by the shop's origin. 401 page when the signature is missing or invalid."
      responses:
        "200": {description: HTML page, content: {text/html: {schema: {type: string}}}}
        "401": {description: HTML page explaining the page must be opened from Shopware, content: {text/html: {schema: {type: string}}}}
    post:
      tags: [Integrations]
      operationId: bindShopwareAppInstallation
      security: []
      description: "Form of the module: signed_query (the module's signed query) and code (the store's pairing code from POST /stores/{id}/pairing-codes). Binds the installation when the code is valid, the store is a Shopware store, the shop URL host equals the store host (without www.) and the app's key reads the shop's orders; the code is consumed. No session or CSRF token; answers the HTML page with the result."
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [signed_query, code]
              properties:
                signed_query: {type: string}
                code: {type: string, maxLength: 100}
      responses:
        "200": {description: HTML page with the result, content: {text/html: {schema: {type: string}}}}
        "401": {description: HTML page explaining the page must be opened from Shopware, content: {text/html: {schema: {type: string}}}}
  /api/v1/integrations/{integration_id}/woocommerce-webhook:
    post:
      tags: [Integrations]
      operationId: setUpWooCommerceWebhook
      security:
        - {UserSession: []}
      description: "WooCommerce REST API connection only (ADR 0077): creates a new webhook secret (an older one stops working) and returns what the merchant enters in WooCommerce → Settings → Advanced → Webhooks. The secret is returned only here."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200":
          description: Webhook setup
          content:
            application/json:
              schema:
                type: object
                required: [delivery_url, secret, topics]
                properties:
                  delivery_url: {type: string, format: uri}
                  secret: {type: string}
                  topics: {type: array, items: {enum: [order.created, order.updated, order.deleted, order.restored]}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/webhooks/woocommerce/{integration_id}:
    post:
      tags: [Integrations]
      operationId: receiveWooCommerceWebhook
      security: []
      description: "WooCommerce's own webhook for a REST API connection (ADR 0077). Signature X-WC-Webhook-Signature = base64 HMAC-SHA256 of the raw body with the secret; X-WC-Webhook-Source must be the store's host. An order topic only queues the connection's delta sync (the body is not used). WooCommerce's unsigned ping (webhook_id=N) is answered 200. 409 webhook_not_configured, 401 signature_invalid, 422 source_mismatch."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Received (result sync_requested, ping, topic_not_used or ignored)}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/shopware/app/{integration_id}/register:
    get:
      tags: [Integrations]
      operationId: registerShopwareApp
      security: []
      description: "Called by Shopware when the app is installed: query shop-id, shop-url, timestamp signed with the manifest secret (header shopware-app-signature). Answers proof, a new shop secret and the confirmation URL; errors as {error} for Shopware."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Registration accepted
          content:
            application/json:
              schema:
                type: object
                required: [proof, secret, confirmation_url]
                properties:
                  proof: {type: string}
                  secret: {type: string}
                  confirmation_url: {type: string, format: uri}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/shopware/app/{integration_id}/confirm:
    post:
      tags: [Integrations]
      operationId: confirmShopwareApp
      security: []
      description: "Called by Shopware after registration with the app's API key, signed with the shop secret (header shopware-shop-signature). The key is checked against the shop's Admin API; the integration becomes the store's order source and, when the shop URL host is the store's host, confirms the store."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Confirmed}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/shopware/app/{integration_id}/webhook:
    post:
      tags: [Integrations]
      operationId: receiveShopwareAppWebhook
      security: []
      description: "Signed Shopware app webhooks (shopware-shop-signature): order.written and order_transaction.written read the named orders right away; app.deactivated/app.activated/app.deleted move the integration (deleted → revoked). The body is only a hint."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Received}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}/webhook-id:
    put:
      tags: [Integrations]
      operationId: setPayPalWebhookId
      security:
        - {UserSession: []}
      description: Stores the id of the webhook created in the PayPal app (needed to verify deliveries); replaces the previous one.
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook_id]
              properties:
                webhook_id: {type: string, maxLength: 64}
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderIntegration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/webhooks/paypal/{integration_id}:
    post:
      tags: [Integrations]
      operationId: receivePayPalWebhook
      description: "Called by PayPal. The PAYPAL-* transmission headers and the raw body are checked by PayPal's verify-webhook-signature with the stored webhook id (transmission time within 600 s). The body is only a hint: the affected PayPal order is read through the API and goes through the same change-detecting path as polling; nothing from the body is stored."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: PAYPAL-TRANSMISSION-ID, in: header, required: true, schema: {type: string}}
        - {name: PAYPAL-TRANSMISSION-TIME, in: header, required: true, schema: {type: string}}
        - {name: PAYPAL-TRANSMISSION-SIG, in: header, required: true, schema: {type: string}}
        - {name: PAYPAL-CERT-URL, in: header, required: true, schema: {type: string}}
        - {name: PAYPAL-AUTH-ALGO, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema: {type: object, required: [received], properties: {received: {const: true}, emitted: {type: integer}, ignored: {type: string}}}
        "400": {description: Signature invalid}
        "404": {description: Unknown integration}
        "409": {description: No webhook id configured}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {description: PayPal unavailable for verification or reading}
  /api/v1/pairing/exchange:
    post:
      tags: [Pairing]
      operationId: exchangePairingCode
      description: Called by the store connector; base_url must equal the store base URL. Rate-limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pairing_code, install_id, connector_code, plugin_version, base_url]
              properties:
                pairing_code: {type: string, minLength: 16, maxLength: 128}
                install_id: {type: string, format: uuid}
                connector_code: {type: string, pattern: "^[a-z][a-z0-9_]{1,63}$"}
                plugin_version: {type: string, maxLength: 100}
                base_url: {type: string, format: uri}
      responses:
        "201":
          description: Credential issued once (at-most-once exchange)
          content:
            application/json:
              schema:
                type: object
                required: [integration_id, key_id, secret, secret_encoding, signature_version]
                properties:
                  integration_id: {type: string, format: uuid}
                  key_id: {type: string}
                  secret: {type: string}
                  secret_encoding: {const: base64}
                  signature_version: {const: "1"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/checkout:
    post:
      tags: [Billing]
      operationId: createBillingCheckout
      description: "Tenant owner only. Starts a purchase of a base price (and optionally extra stores of the same plan version, interval and currency) through the billing provider (Paddle, ADR 0030). The amount comes from our stored price, never from the request. A local session is written first; the provider transaction is created outside the database transaction, a lost answer leaves the session `unknown` (resolved later from provider events). Repeating the same Idempotency-Key returns the same session; a different body with the same key is 409. Opening the provider checkout never grants access: paid access comes only from the provider's verified subscription state."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [price_id]
              properties:
                price_id: {type: string, format: uuid, description: A base price}
                extra_stores: {type: integer, minimum: 0, maximum: 1000, default: 0}
                discount_code: {type: [string, "null"], maxLength: 32, description: "Optional promo code; it is applied after the best public offer and the organisation's own discount (ADR 0036)"}
                faster_checks: {type: boolean, default: false, description: "Add the package's faster-checks add-on (ADR 0041); 422 faster_checks_unavailable when the package has none"}
                policy_version_ids: {type: array, maxItems: 10, items: {type: string, format: uuid}, description: "Ids of the published legal page versions the person accepted (ADR 0042); required when the owner marked terms pages, otherwise 422 policy_acceptance_required with details.documents"}
      responses:
        "202":
          description: Checkout session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingCheckout"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/trial:
    post:
      tags: [Billing]
      operationId: startBillingTrial
      description: "Tenant owner with a verified email only. Our own trial without a payment method (ADR 0030): once per tenant (consumed under the tenant lock, kept even if the subscription row is later replaced) and once per store domain (ADR 0031: `www.` and the bare host are one domain; the tenant's verified stores claim their domains, 409 `trial_store_already_used` when another organisation already had a trial for one of them), for the trial days of the plan version. Needs consent to the current service terms and subscription terms when the owner marked such pages (ADR 0042)."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_version_id]
              properties:
                policy_version_ids: {type: array, maxItems: 10, items: {type: string, format: uuid}, description: "Ids of the published legal page versions the person accepted (ADR 0042); required when the owner marked terms pages, otherwise 422 policy_acceptance_required with details.documents"}
                plan_version_id: {type: string, format: uuid}
      responses:
        "201":
          description: Trial started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingSubscription"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/checkouts/{checkout_id}:
    get:
      tags: [Billing]
      operationId: getBillingCheckout
      description: Tenant owner only. The browser returning from the provider never grants paid access; poll this until `confirmed`.
      security:
        - {UserSession: []}
      parameters:
        - {name: checkout_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingCheckout"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/discounts/check:
    get:
      tags: [Billing]
      operationId: checkBillingDiscount
      description: "Tenant owner only, 10 per minute. Whether a promo code can be used with a published base price for this organisation (ADR 0036): 422 `discount_code_invalid` (unknown, not started or archived), `discount_expired`, `discount_not_applicable` (other plan or other currency), 409 `discount_used_up`. Only an indication: the checkout checks again and applies the code after the offer and the personal discount."
      security:
        - {UserSession: []}
      parameters:
        - {name: code, in: query, required: true, schema: {type: string, maxLength: 32}}
        - {name: price_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The discount the code gives
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingDiscount"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/plans:
    get:
      tags: [Billing]
      operationId: listBillingPlans
      description: "Any member. The latest published version of each plan (managed in the owner panel, ADR 0035) with its published prices for the current mode; any billing period `every interval_count interval`. Plans with a base price come first, cheapest first. Amounts are minor units as strings; `tax_behavior` tells whether taxes are included (ADR 0030: gross for consumers). `trial_available` is false once the organisation had a trial or any subscription; the store domain check (ADR 0031) happens when the trial starts."
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Sellable plans
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, mode, checkout_available, trial_available]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/BillingPlan"}
                  mode: {enum: [test, live]}
                  checkout_available: {type: boolean}
                  trial_available: {type: boolean}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/subscription:
    get:
      tags: [Billing]
      operationId: getBillingSubscription
      description: Tenant owner only. Billing status (from the provider) and access state (from the entitlement calculator) are reported separately.
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Current subscription projection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingSubscription"}
        "204": {description: No trial or paid subscription yet; the client shows onboarding}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/invoices:
    get:
      tags: [Billing]
      operationId: listBillingInvoices
      description: "Tenant owner only (ADR 0043). Transactions of the organisation's own subscription in the current billing mode, newest first, 50 per page; drafts and not yet billed transactions are left out. Amounts are minor-unit strings in the transaction currency; `total_minor` is what was charged (after discounts and credits, with tax); `refunded_minor` is what was refunded of it (ADR 0044)."
      security:
        - {UserSession: []}
      parameters:
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {type: object}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/invoices/{invoice}/download:
    get:
      tags: [Billing]
      operationId: downloadBillingInvoice
      description: "Tenant owner only. A short-lived link to the invoice PDF at the billing provider; 409 invoice_not_available for a transaction that was not billed, 404 for another organisation's invoice."
      security:
        - {UserSession: []}
      parameters:
        - {name: invoice, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Link
          content:
            application/json:
              schema: {type: object, required: [url], properties: {url: {type: string, format: uri}}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/payment-method:
    post:
      tags: [Billing]
      operationId: changeBillingPaymentMethod
      description: "Tenant owner only. Returns the provider's payment-method update transaction to open with Paddle.js like a checkout; nothing is charged. 409 no_active_subscription."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        "200":
          description: Provider checkout
          content:
            application/json:
              schema: {type: object, required: [provider_checkout], properties: {provider_checkout: {type: object}}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/plan-change-preview:
    post:
      tags: [Billing]
      operationId: previewBillingPlanChange
      description: "Tenant owner only (ADR 0037). Previews a change of the live subscription to another base price of the same currency and interval (and a number of extra stores). A recurring price that is not lower takes effect at once with Paddle's prorated charge for the rest of the period; a lower one takes effect at the next period. While a cheaper plan is scheduled only another cheaper plan can be previewed (409 scheduled_change_pending). When the new plan allows fewer stores than the organisation has, `retained_store_ids` (at most the new limit) is required: 422 retained_stores_required with details {limit, stores}. The returned token is valid for 10 minutes."
      security:
        - {UserSession: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [price_id]
              properties:
                price_id: {type: string, format: uuid}
                extra_stores: {type: integer, minimum: 0, maximum: 1000, default: 0}
                retained_store_ids: {type: [array, "null"], items: {type: string, format: uuid}}
                faster_checks: {type: boolean, default: false, description: "With the package's faster-checks add-on (ADR 0041)"}
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingPlanChange"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/plan-change:
    post:
      tags: [Billing]
      operationId: confirmBillingPlanChange
      description: "Tenant owner only. Confirms a preview by its token. 409 preview_expired / preview_stale (the subscription changed since the preview) / preview_used. An immediate change is sent to Paddle with on_payment_failure=prevent_change: if the charge fails, 402 payment_failed and the subscription stays as it was. A lost Paddle answer leaves the change `unknown` (502 provider_outcome_unknown) until the subscription is read again — never retried automatically. Access follows only the subscription read back from Paddle. The same Idempotency-Key returns the same change."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preview_token]
              properties:
                policy_version_ids: {type: array, maxItems: 10, items: {type: string, format: uuid}, description: "Ids of the published legal page versions the person accepted (ADR 0042); required when the owner marked terms pages, otherwise 422 policy_acceptance_required with details.documents"}
                preview_token: {type: string}
      responses:
        "202":
          description: Applied (immediate) or scheduled (next period)
          content:
            application/json:
              schema:
                type: object
                required: [change, subscription]
                properties:
                  change: {$ref: "#/components/schemas/BillingPlanChange"}
                  subscription: {oneOf: [{$ref: "#/components/schemas/BillingSubscription"}, {type: "null"}]}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "402": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/plan-change/cancel:
    post:
      tags: [Billing]
      operationId: cancelBillingPlanChange
      description: "Tenant owner only. Withdraws a cheaper plan scheduled for the next period: the paid plan's items are put back at Paddle without billing."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        "200":
          description: Withdrawn change and the subscription
          content:
            application/json:
              schema:
                type: object
                required: [change, subscription]
                properties:
                  change: {$ref: "#/components/schemas/BillingPlanChange"}
                  subscription: {oneOf: [{$ref: "#/components/schemas/BillingSubscription"}, {type: "null"}]}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/cancel:
    post:
      tags: [Billing]
      operationId: cancelBillingSubscription
      description: "Tenant owner only. Within 14 days of Paddle started_at, requests full refunds for completed subscription payments; access stays active until Paddle approves all refunds, then subscription and access end immediately. After 14 days, schedules cancellation and access ends at the paid period end. A rejected refund can be retried under the original withdrawal request. The optional reason is audited."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: {type: [string, "null"], maxLength: 2000}
      responses:
        "200":
          description: Subscription as read back from Paddle
          content:
            application/json:
              schema: {oneOf: [{$ref: "#/components/schemas/BillingSubscription"}, {type: "null"}]}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/resume:
    post:
      tags: [Billing]
      operationId: resumeBillingSubscription
      description: "Tenant owner only. Withdraws a scheduled cancellation (Paddle scheduled change removed); renewal continues. 409 cancel_not_scheduled, 409 version_conflict when expected_version is not the current subscription version."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expected_version: {type: [integer, "null"], minimum: 1}
      responses:
        "200":
          description: Subscription as read back from Paddle
          content:
            application/json:
              schema: {oneOf: [{$ref: "#/components/schemas/BillingSubscription"}, {type: "null"}]}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/retained-stores:
    put:
      tags: [Billing]
      operationId: retainBillingStores
      description: "Tenant owner only. Chooses which stores keep running when the plan allows fewer stores than the organisation has (at most the limit); the others are paused for browser checks, never deleted."
      security:
        - {UserSession: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [store_ids]
              properties:
                store_ids: {type: array, minItems: 1, items: {type: string, format: uuid}}
      responses:
        "200":
          description: Store capacity after the choice
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoreCapacity"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/webhooks/paddle:
    post:
      tags: [Billing]
      operationId: receivePaddleWebhook
      description: "Called by Paddle. `Paddle-Signature: ts=…;h1=…` is HMAC-SHA256 of `ts:raw body` with the destination secret (tolerance 300 s). The event is stored in the billing inbox with only ids, states, price ids and quantities, periods, totals and our custom data (no names, emails, addresses or payment details) and acknowledged; `billing:process-events` reads the affected subscription from Paddle and projects it. The same event id with the same content is a duplicate; with different content a conflict (kept, not applied)."
      security: []
      parameters:
        - {name: Paddle-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema: {type: object, required: [received, outcome], properties: {received: {const: true}, outcome: {enum: [stored, duplicate, conflict]}}}
        "400": {description: Signature or payload invalid}
        "409": {description: No webhook secret configured}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/entitlements:
    get:
      tags: [Billing]
      operationId: getEntitlements
      description: What the active tenant may use and why (ADR 0029). With `enforced` false (pilot) every feature is included and limits are not applied.
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Entitlements of the active tenant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Entitlements"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations:
    get:
      tags: [Integrations]
      operationId: listIntegrations
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Integrations of the active tenant
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Integration"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}:
    get:
      tags: [Integrations]
      operationId: getIntegration
      security:
        - {UserSession: []}
      parameters:
        - name: integration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Integration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}/revoke:
    post:
      tags: [Integrations]
      operationId: revokeIntegration
      security:
        - {UserSession: []}
      parameters:
        - name: integration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200":
          description: Revoked with credentials; provider revocation requeues the store reconciliation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}/rotate:
    post:
      tags: [Integrations]
      operationId: requestCredentialRotation
      security:
        - {UserSession: []}
      parameters:
        - name: integration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "202":
          description: Rotation requested; the connector picks it up on its next heartbeat
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/findings:
    get:
      tags: [Money]
      operationId: listFindings
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - name: status
          in: query
          schema: {enum: [ok, pending, mismatch, unsupported, unknown]}
        - name: rule_code
          in: query
          schema: {type: string}
        - name: currency
          in: query
          schema: {type: string, pattern: "^[A-Z]{3}$"}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 2048}
        - name: current
          in: query
          description: "Only findings of the latest run per order and of the latest store-wide unmatched-payment scan."
          schema: {type: boolean}
      responses:
        "200":
          description: "Findings, newest first; null amounts are unknown, not zero"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Finding"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/exports:
    post:
      tags: [Exports]
      operationId: createExport
      security:
        - {UserSession: []}
      description: Creates a private CSV export for one store. The first implementation completes synchronously and stores a private object; clients still poll the returned export id.
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, format]
              properties:
                kind: {enum: [findings, incidents, transactions]}
                format: {enum: [csv]}
                filters:
                  type: object
                  additionalProperties: false
                  properties:
                    from: {type: string, format: date-time}
                    to: {type: string, format: date-time}
                    current: {type: boolean}
                    status: {enum: [ok, pending, mismatch, unsupported, unknown]}
                    rule_code: {type: string, maxLength: 64}
                    state:
                      oneOf:
                        - {type: string, pattern: "^(open|acknowledged|resolved)(,(open|acknowledged|resolved)){0,2}$"}
                        - type: array
                          minItems: 1
                          maxItems: 3
                          items: {enum: [open, acknowledged, resolved]}
                    severity: {enum: [info, warning, critical]}
                    family: {type: string, maxLength: 64}
                    currency: {type: string, pattern: "^[A-Z]{3}$"}
                    kind: {enum: [capture, refund, fee, dispute_debit, dispute_credit, adjustment]}
                    transaction_status: {enum: [pending, succeeded, failed, cancelled]}
      responses:
        "202":
          description: Export accepted; state is usually ready in the current synchronous implementation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Export"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/exports/{export_id}:
    get:
      tags: [Exports]
      operationId: getExport
      security:
        - {UserSession: []}
      parameters:
        - name: export_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Tenant-scoped export metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Export"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/exports/{export_id}/download:
    get:
      tags: [Exports]
      operationId: downloadExport
      security:
        - {UserSession: []}
      parameters:
        - name: export_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Private CSV download; role and tenant checked at request time
          content:
            text/csv:
              schema: {type: string}
          headers:
            Cache-Control:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
