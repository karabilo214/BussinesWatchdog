        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/notification-channels/{channel_id}/verification-code:
    post:
      tags: [Notifications]
      operationId: resendNotificationChannelCode
      security:
        - {UserSession: []}
      description: Mails a new code to the address saved on the unverified channel; the previous code stops working. Once per minute.
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                required: [method, expires_in_seconds]
                properties:
                  method: {const: email_code}
                  expires_in_seconds: {type: integer}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/notification-channels/{channel_id}/test:
    post:
      tags: [Notifications]
      operationId: testNotificationChannel
      security:
        - {UserSession: []}
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "202":
          description: Test delivery queued (once per minute)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationDelivery"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/notification-deliveries:
    get:
      tags: [Notifications]
      operationId: listNotificationDeliveries
      security:
        - {UserSession: []}
      parameters:
        - name: incident_id
          in: query
          schema: {type: string, format: uuid}
        - name: channel_id
          in: query
          schema: {type: string, format: uuid}
        - name: status
          in: query
          schema: {enum: [queued, sending, sent, uncertain, failed, dead_letter, suppressed]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 2048}
      responses:
        "200":
          description: Delivery log
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/NotificationDelivery"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/scenarios:
    get:
      tags: [Checks]
      operationId: listCheckScenarios
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Scenarios of the store (one payment_form scenario in P0)
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/CheckScenario"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      tags: [Checks]
      operationId: createCheckScenario
      security:
        - {UserSession: []}
      description: "Owner/admin. Deviation from the catalogue until the plugin manifest exists: the product URL is given directly (HTTPS, store origin). 409 scenario_exists."
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/CheckScenarioInput"}
                - {required: [product_url]}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckScenario"}
          headers:
            ETag:
              description: Quoted version for If-Match
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/scenarios/{scenario_id}:
    get:
      tags: [Checks]
      operationId: getCheckScenario
      security:
        - {UserSession: []}
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Scenario
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckScenario"}
          headers:
            ETag:
              description: Quoted version for If-Match
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [Checks]
      operationId: updateCheckScenario
      security:
        - {UserSession: []}
      description: Owner/admin; If-Match carries the scenario version.
      parameters:
        - name: scenario_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CheckScenarioInput"}
      responses:
        "200":
          description: New scenario version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckScenario"}
          headers:
            ETag:
              description: Quoted version for If-Match
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/checks:
    get:
      tags: [Checks]
      operationId: listCheckRuns
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 2048}
      responses:
        "200":
          description: "Runs, newest first"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/CheckRun"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    post:
      tags: [Checks]
      operationId: createManualCheck
      security:
        - {UserSession: []}
      description: "Owner/admin; one manual run per minute per store (429 `manual_check_rate_limited`); when enforced, at most `manual_runs_per_day` runs per tenant per calendar day in the tenant's timezone (429 `usage_limit_reached` with `errors[0]` = {limit, value, used, resets_at} and Retry-After, ADR 0032); 409 while a run is active; 422 if the store is not eligible."
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scenario_id]
              properties:
                scenario_id: {type: string, format: uuid}
      responses:
        "202":
          description: Durable logical run created
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    required: [run_id]
                    properties:
                      run_id: {type: string, format: uuid}
                  - {$ref: "#/components/schemas/CheckRun"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/checks/{run_id}:
    get:
      tags: [Checks]
      operationId: getCheckRun
      security:
        - {UserSession: []}
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: "Run with attempts, sanitized steps and ready artifacts"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckRunDetail"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/checks/{run_id}/cancel:
    post:
      tags: [Checks]
      operationId: cancelCheckRun
      security:
        - {UserSession: []}
      parameters:
        - name: run_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 5, maxLength: 500}
      responses:
        "200":
          description: Cancelled; the active attempt is fenced out; not a site failure
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CheckRun"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/artifacts/{artifact_id}/download:
    get:
      tags: [Checks]
      operationId: downloadArtifact
      security:
        - {UserSession: []}
      description: Rate-limited; authorisation at issuance plus a private object.
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: "60-second link; Cache-Control: no-store"
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, content_type, size_bytes]
                properties:
                  url: {type: string, format: uri}
                  expires_at: {type: string, format: date-time}
                  content_type: {type: string}
                  size_bytes: {type: integer}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/ingest/heartbeat:
    post:
      tags: [Ingestion]
      operationId: ingestHeartbeat
      description: Every 5 minutes. Three missing heartbeats mark the connector stale; an old oldest_pending_at marks it partial (ADR 0009).
      parameters:
        - {$ref: "#/components/parameters/SignatureTimestamp"}
        - {$ref: "#/components/parameters/SignatureNonce"}
        - {$ref: "#/components/parameters/Signature"}
        - {$ref: "#/components/parameters/SignatureVersion"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Heartbeat"}
      responses:
        "200":
          description: Self-report stored; a heartbeat does not prove complete order coverage
          content:
            application/json:
              schema:
                type: object
                required: [status, integration_id, credential_rotation_requested, store_verification]
                properties:
                  status: {const: ok}
                  integration_id: {type: string, format: uuid}
                  credential_rotation_requested: {type: boolean}
                  store_verification:
                    type: [object, "null"]
                    description: Pending plugin challenge the connector must serve publicly.
                    properties:
                      id: {type: string, format: uuid}
                      challenge: {type: string}
                      url: {type: string, format: uri}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
      security:
        - {IntegrationKeyId: []}
  /api/v1/ingest/credentials/rotate:
    post:
      tags: [Ingestion]
      operationId: rotateConnectorCredential
      description: Called by the connector after the heartbeat reports credential_rotation_requested.
      parameters:
        - {$ref: "#/components/parameters/SignatureTimestamp"}
        - {$ref: "#/components/parameters/SignatureNonce"}
        - {$ref: "#/components/parameters/Signature"}
        - {$ref: "#/components/parameters/SignatureVersion"}
      responses:
        "201":
          description: New credential issued once; the previous key drains
          content:
            application/json:
              schema:
                type: object
                required: [integration_id, key_id, secret, secret_encoding, signature_version]
                properties:
                  integration_id: {type: string, format: uuid}
                  key_id: {type: string}
                  secret: {type: string}
                  secret_encoding: {const: base64}
                  signature_version: {const: 1}
                  previous_key_draining_until: {type: [string, "null"], format: date-time}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
      security:
        - {IntegrationKeyId: []}
  /internal/v1/browser/leases:
    post:
      tags: [BrowserInternal]
      operationId: leaseBrowserAttempt
      security:
        - WorkerToken: []
      description: Worker identity comes from token, not body. DB claim uses SKIP LOCKED and fencing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [browser_version, location]
              properties:
                browser_version: {type: string, minLength: 1, maxLength: 100}
                location: {type: string, minLength: 1, maxLength: 100}
      responses:
        '200':
          description: New attempt leased; secret token returned once and never logged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowserLease'
        '204':
          description: No eligible run; worker polls with bounded backoff and jitter
        '401':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /internal/v1/browser/attempts/{attempt_id}/heartbeat:
    post:
      tags: [BrowserInternal]
      operationId: heartbeatBrowserAttempt
      security:
        - WorkerToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/LeaseToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fencing_token]
              properties:
                fencing_token: {type: integer, minimum: 1}
      responses:
        '200':
          description: Valid lease heartbeat persisted; absolute deadline unchanged
          content:
            application/json:
              schema:
                type: object
                required: [lease_until, absolute_deadline_at]
                properties:
                  lease_until: {type: string, format: date-time}
                  absolute_deadline_at: {type: string, format: date-time}
        '409':
          $ref: '#/components/responses/Problem'
  /internal/v1/browser/attempts/{attempt_id}/artifacts:
    post:
      tags: [BrowserInternal]
      operationId: uploadBrowserArtifact
      security:
        - WorkerToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/LeaseToken'
        - {name: X-BW-Fencing-Token, in: header, required: true, schema: {type: integer, minimum: 1}}
        - {name: X-BW-Sha256, in: header, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
        - {name: X-BW-Redaction-Version, in: header, required: true, schema: {type: string, maxLength: 32}}
      description: |
        Redacted screenshot of a live attempt (deviation from a presigned upload URL, ADR 0013):
        the worker never receives storage credentials or URLs. The backend chooses the private
        object key, checks size (≤ 2 MiB), image signature and SHA-256, stores the object and
        records it as ready. At most 3 per attempt. Reference the id in the result's artifact_ids.
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, format: binary}}
          image/png: {schema: {type: string, format: binary}}
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [artifact_id, state]
                properties:
                  artifact_id: {type: string, format: uuid}
                  state: {const: ready}
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /internal/v1/browser/attempts/{attempt_id}/result:
    post:
      tags: [BrowserInternal]
      operationId: completeBrowserAttempt
      security:
        - WorkerToken: []
      parameters:
        - $ref: '#/components/parameters/AttemptId'
        - $ref: '#/components/parameters/LeaseToken'
      description: |
        Verify worker identity, current lease and fencing token transactionally.
        Repeated identical final result is 200; altered result or stale attempt is 409.
        Store attempt result and domain outbox in one transaction.
        Lease expiry never turns infrastructure error into a confirmed site failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserResult'
      responses:
        '200':
          description: Result durably persisted or known identical retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    IntegrationKeyId:
      type: apiKey
      in: header
      name: X-BW-Key-Id
      description: Key ID plus mandatory raw-body HMAC signature headers; key ID alone never authenticates.
    StaffSession:
      type: apiKey
      in: cookie
      name: bw-platform-session
      description: Control panel session, separate from the customer session; CSRF via the BW-PLATFORM-XSRF cookie and X-XSRF-TOKEN.
    UserSession:
      type: apiKey
      in: cookie
      name: watchdog_session
      description: Same-origin Sanctum session with CSRF on mutations.
    WorkerToken:
      type: http
      scheme: bearer
      description: Scoped worker credential restricted to private ingress.
  parameters:
    SignatureTimestamp:
      name: X-BW-Timestamp
      in: header
      required: true
      schema: {type: string, pattern: '^[0-9]{10,12}$'}
    SignatureNonce:
      name: X-BW-Nonce
      in: header
      required: true
      schema: {type: string, format: uuid}
    Signature:
      name: X-BW-Signature
      in: header
      required: true
      schema: {type: string, pattern: '^[a-f0-9]{64}$'}
    SignatureVersion:
      name: X-BW-Signature-Version
      in: header
      required: true
      schema: {type: string, const: '1'}
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AttemptId:
      name: attempt_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    LeaseToken:
      name: X-BW-Lease-Token
      in: header
      required: true
      schema: {type: string, minLength: 32, maxLength: 256}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag containing quoted incident revision, for example "3".
      schema: {type: string, pattern: '^"[0-9]+"$'}
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  responses:
    Problem:
      description: Structured safe problem response; HTTP status determines retry policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    PlatformConfirmation:
      type: object
      additionalProperties: false
      required: [reason, code]
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
        code: {type: string, maxLength: 32, description: Current authenticator code or an unused recovery code}
    PlatformPlanVersion:
      type: object
      required: [id, version, state, name, description, placeholder, trial_days, entitlements, published_at, subscribers, prices]
      properties:
        id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        version: {type: integer}
        state: {enum: [draft, published, retired]}
        name: {type: object, additionalProperties: {type: string}}
        description: {type: object, additionalProperties: {type: string}}
        placeholder: {type: boolean}
        trial_days: {type: integer}
        entitlements: {type: object}
        published_at: {type: [string, "null"], format: date-time}
        subscribers: {type: integer}
        prices:
          type: array
          items:
            type: object
            required: [id, kind, mode, currency, currency_exponent, amount_minor, interval, interval_count, state, at_provider]
            properties:
              id: {type: string, format: uuid}
              kind: {enum: [base, extra_store]}
              mode: {enum: [test, live]}
              currency: {type: string}
              currency_exponent: {type: integer}
              amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
              interval: {enum: [day, week, month, year]}
              interval_count: {type: integer}
              state: {enum: [draft, published, retired]}
              at_provider: {type: boolean}
    PlatformMe:
      type: object
      additionalProperties: false
      required: [staff_id, name, email, locale, role, mfa_enabled, capabilities, billing_mode, session]
      properties:
        staff_id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string}
        locale: {type: string}
        role: {enum: [platform_owner, platform_admin, platform_support, platform_billing]}
        mfa_enabled: {const: true}
        capabilities: {type: array, items: {type: string}}
        billing_mode: {enum: [test, live]}
        session:
          type: object
          required: [idle_minutes, absolute_hours]
          properties:
            idle_minutes: {type: integer}
            absolute_hours: {type: integer}
    BillingPlan:
      type: object
      additionalProperties: false
      required: [plan_code, plan_version_id, name, description, placeholder, trial_days, entitlements, prices, discounts]
      properties:
        plan_code: {type: string}
        plan_version_id: {type: string, format: uuid}
        name: {type: object, additionalProperties: {type: string}, description: Localized names by locale}
        description: {type: object, additionalProperties: {type: string}, description: Localized descriptions by locale}
        discounts: {type: array, items: {$ref: "#/components/schemas/BillingDiscount"}, description: "The best public offer and the organisation's own discount for this plan, in application order; a promo code comes third"}
        placeholder: {type: boolean, description: "Draft content not approved by the owner"}
        trial_days: {type: integer, minimum: 0}
        entitlements:
          type: object
          required: [features, limits]
          properties:
            features: {type: array, items: {type: string}}
            limits: {type: object, additionalProperties: {type: [integer, "null"]}}
        prices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, kind, currency, currency_exponent, amount_minor, interval, interval_count, tax_behavior]
            properties:
              id: {type: string, format: uuid}
              kind: {enum: [base, extra_store]}
              currency: {type: string, pattern: '^[A-Z]{3}$'}
              currency_exponent: {type: integer}
              amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
              interval: {enum: [day, week, month, year]}
              interval_count: {type: integer, minimum: 1}
              tax_behavior: {type: string}
    BillingDiscount:
      type: object
      additionalProperties: false
      required: [id, position, audience, label, kind, percent, amount_minor, currency, currency_exponent, duration, duration_periods, expires_at]
      properties:
        id: {type: string, format: uuid}
        position: {type: integer, enum: [1, 2, 3], description: "Application order: 1 offer, 2 personal, 3 promo code"}
        audience: {enum: [automatic, tenant, code]}
        label: {type: object, additionalProperties: {type: string}, description: Customer-facing text by locale}
        kind: {enum: [percentage, flat]}
        percent: {type: [string, "null"], description: "Percentage as a decimal string, e.g. \"12.5\""}
        amount_minor: {oneOf: [{$ref: "#/components/schemas/MoneyMinor"}, {type: "null"}]}
        currency: {type: [string, "null"]}
        currency_exponent: {type: [integer, "null"]}
        duration: {enum: [once, periods, forever]}
        duration_periods: {type: [integer, "null"]}
        expires_at: {type: [string, "null"], format: date-time}
    PlatformDiscount:
      allOf:
        - {$ref: "#/components/schemas/BillingDiscount"}
        - type: object
          required: [name, audience, code, usage_limit, used, plan_ids, tenants, starts_at, state, mode, created_at]
          properties:
            name: {type: string}
            audience: {enum: [code, tenant, automatic]}
            code: {type: [string, "null"]}
            usage_limit: {type: [integer, "null"]}
            used: {type: integer}
            plan_ids: {type: array, items: {type: string, format: uuid}}
            tenants: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}}}}
            starts_at: {type: [string, "null"], format: date-time}
            state: {enum: [active, archived]}
            mode: {enum: [test, live]}
            created_at: {type: [string, "null"], format: date-time}
    DiscountBreakdown:
      type: object
      required: [id, period_number, period_start, currency, currency_exponent, amount_before_minor, saving_minor, amount_after_minor, status, error_code, lines]
      properties:
        id: {type: string, format: uuid}
        period_number: {type: integer, minimum: 1, description: "1 = the purchase, 2 = the first renewal, ..."}
        period_start: {type: [string, "null"], format: date-time}
        currency: {type: string}
        currency_exponent: {type: integer}
        amount_before_minor: {$ref: "#/components/schemas/MoneyMinor"}
        saving_minor: {$ref: "#/components/schemas/MoneyMinor"}
        amount_after_minor: {$ref: "#/components/schemas/MoneyMinor"}
        status: {enum: [planned, applied, failed]}
        error_code: {type: [string, "null"]}
        lines:
          type: array
          description: In application order; each line starts from the previous line's amount after
          items:
            type: object
            required: [discount, position, amount_before_minor, saving_minor, amount_after_minor]
            properties:
              discount: {oneOf: [{$ref: "#/components/schemas/BillingDiscount"}, {type: "null"}]}
              position: {type: integer, enum: [1, 2, 3]}
              amount_before_minor: {$ref: "#/components/schemas/MoneyMinor"}
              saving_minor: {$ref: "#/components/schemas/MoneyMinor"}
              amount_after_minor: {$ref: "#/components/schemas/MoneyMinor"}
    BillingCheckout:
      type: object
      additionalProperties: false
      required: [id, status, error_code, expires_at, extra_store_quantity, discounts, access_state, provider_checkout]
      properties:
        id: {type: string, format: uuid}
        discounts: {oneOf: [{$ref: "#/components/schemas/DiscountBreakdown"}, {type: "null"}], description: "The first payment's discounts as charged: one combined Paddle discount"}
        status: {enum: [creating, pending, requires_action, confirmed, failed, cancelled, expired, unknown]}
        error_code: {type: [string, "null"]}
        expires_at: {type: string, format: date-time}
        extra_store_quantity: {type: integer, minimum: 0}
        access_state: {type: string}
        provider_checkout:
          description: What the browser needs to open the provider's checkout (Paddle.js); null unless the session is pending and not expired.
          oneOf:
            - {type: "null"}
            - type: object
              additionalProperties: false
              required: [provider, environment, client_token, transaction_id]
              properties:
                provider: {const: paddle}
                environment: {enum: [sandbox, production]}
                client_token: {type: string, description: Paddle client-side token (public by design)}
                transaction_id: {type: string}
    BillingSubscription:
      type: object
      additionalProperties: false
      required: [id, tenant_id, provider, plan_code, plan_version_id, status, access_state, access_reason_codes, paid_until, trial_ends_at, grace_until, period_end, cancel_at_period_end, extra_store_quantity, version, entitlements]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        provider: {type: string}
        plan_code: {type: string}
        plan_version_id: {type: [string, "null"], format: uuid}
        status: {enum: [trial, active, past_due, suspended, cancelled]}
        access_state: {type: string}
        access_reason_codes: {type: array, items: {type: string}}
        paid_until: {type: [string, "null"], format: date-time}
        trial_ends_at: {type: [string, "null"], format: date-time}
        grace_until: {type: [string, "null"], format: date-time}
        period_end: {type: [string, "null"], format: date-time}
        cancel_at_period_end: {type: boolean}
        extra_store_quantity: {type: integer, minimum: 0}
        price:
          type: [object, "null"]
          description: The base price of the period being paid (with a cheaper plan scheduled, still the old one)
          properties:
            id: {type: string, format: uuid}
            amount_minor: {type: string, pattern: "^[0-9]+$"}
            currency: {type: string}
            currency_exponent: {type: integer}
            billing_interval: {type: string}
            billing_interval_count: {type: integer}
        scheduled_change: {oneOf: [{$ref: "#/components/schemas/BillingPlanChange"}, {type: "null"}]}
        capacity: {$ref: "#/components/schemas/StoreCapacity"}
        version: {type: integer, minimum: 1}
        entitlements:
          type: object
          required: [features, limits]
          properties:
            features: {type: array, items: {type: string}}
            limits: {type: object, additionalProperties: {type: [integer, "null"]}}
    PlatformTenantRow:
      type: object
      required: [id, name, status, created_at, owner, access, subscription, stores, open_incidents, override_active]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {enum: [active, suspended, deleting]}
        created_at: {type: string, format: date-time}
        owner:
          type: object
          properties:
            name: {type: [string, "null"]}
            email: {type: [string, "null"], description: Masked unless the viewer is the platform owner}
            email_verified: {type: boolean}
        access:
          type: object
          properties:
            state: {type: string}
            reasons: {type: array, items: {type: string}}
            enforced: {type: boolean}
        subscription: {type: [object, "null"], description: "Only with billing.read"}
        stores: {$ref: "#/components/schemas/StoreCapacity"}
        open_incidents: {type: integer}
        override_active: {type: boolean}
    PlatformTenantActionInput:
      type: object
      properties:
        plan_version_id: {type: string, format: uuid}
        extra_stores: {type: integer, minimum: 0}
        ends_at: {type: string, format: date-time}
        override_id: {type: string, format: uuid}
        trial_ends_at: {type: string, format: date-time}
    BillingPlanChange:
      type: object
      additionalProperties: false
      required: [id, preview_token, kind, status, from, to, currency, currency_exponent, due_now_minor, next_amount_before_minor, next_amount_minor, effective_at, expires_at, retained_store_ids, error_code]
      properties:
        id: {type: string, format: uuid}
        preview_token: {type: [string, "null"], description: "Only while the preview can be confirmed (10 minutes)"}
        kind: {enum: [immediate, next_period], description: "immediate — the new recurring price is not lower: Paddle charges the prorated difference now; next_period — a cheaper plan from the next billing period, the paid plan stays until then"}
        status: {enum: [previewed, applying, applied, scheduled, failed, unknown, cancelled, expired]}
        from: {$ref: "#/components/schemas/BillingPlanChangeSide"}
        to: {$ref: "#/components/schemas/BillingPlanChangeSide"}
        currency: {type: string}
        currency_exponent: {type: integer}
        due_now_minor: {type: string, pattern: "^[0-9]+$", description: "Gross amount Paddle charges now for the rest of the period (0 for next_period), without discounts"}
        next_amount_before_minor: {type: string, pattern: "^[0-9]+$", description: Next period's price of the new plan before discounts}
        next_amount_minor: {type: string, pattern: "^[0-9]+$", description: "Next period's price after the discounts the subscription still holds that apply to the new plan"}
        effective_at: {type: [string, "null"], format: date-time}
        expires_at: {type: string, format: date-time}
        retained_store_ids: {type: [array, "null"], items: {type: string, format: uuid}}
        error_code: {type: [string, "null"]}
    BillingPlanChangeSide:
      type: object
      properties:
        plan_code: {type: [string, "null"]}
        plan_version_id: {type: [string, "null"], format: uuid}
        price_id: {type: string, format: uuid}
        amount_minor: {type: [string, "null"]}
        extra_store_quantity: {type: integer, minimum: 0}
    StoreCapacity:
      type: object
      additionalProperties: false
      required: [limit, stores, paused, choice_required]
      properties:
        limit: {type: [integer, "null"], description: "Stores the plan allows; null when not limited (also in pilot mode)"}
        stores: {type: integer}
        paused: {type: integer}
        choice_required: {type: boolean, description: "More stores run than the plan allows and the owner has not chosen: browser checks of the organisation are paused"}
    Entitlements:
      type: object
      additionalProperties: false
      required: [access_state, reason_codes, enforced, plan_code, features, limits, usage]
      properties:
        access_state: {type: string, enum: [pilot, active, override, trial, grace, paused_billing, paused_manual, no_service, onboarding]}
        reason_codes: {type: array, items: {type: string}}
        enforced: {type: boolean}
        plan_code: {type: [string, "null"]}
        features:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, included, reason]
            properties:
              code: {type: string, enum: [checkout_monitoring, payment_attempts_server, payment_attempts_script, money_reconciliation, order_outcomes, notifications_telegram, agency_workspace]}
              included: {type: boolean}
              reason: {type: string, description: "included, not_in_plan, pilot or the access state that pauses the service"}
        limits:
          type: object
          additionalProperties: false
          description: Null means no limit.
          properties:
            max_active_stores: {type: [integer, "null"]}
            max_extra_stores: {type: [integer, "null"]}
            min_check_interval_minutes: {type: [integer, "null"]}
            retention_days: {type: [integer, "null"]}
            monthly_event_budget: {type: [integer, "null"]}
            manual_runs_per_day: {type: [integer, "null"]}
        usage:
          type: object
          additionalProperties: false
          required: [manual_runs_per_day, monthly_event_budget]
          description: "Usage counted for count-bound limits in the current period (ADR 0032): calendar day / month in the tenant's timezone. Counted in pilot mode too; the limit applies only when enforced."
          properties:
            manual_runs_per_day: {$ref: "#/components/schemas/UsagePeriod"}
            monthly_event_budget: {$ref: "#/components/schemas/UsagePeriod"}
    UsagePeriod:
      type: object
      additionalProperties: false
      required: [used, period_start, period_end]
      properties:
        used: {type: integer, minimum: 0}
        period_start: {type: string, format: date-time}
        period_end: {type: string, format: date-time}
    MoneyMinor:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,18})$'
      description: Signed 64-bit integer encoded as decimal string; semantic validator enforces bigint bounds.
    Problem:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code: {type: string}
        message: {type: string}
        request_id: {type: string, format: uuid}
        errors: {type: array, items: {type: object}}
        retry_after_seconds: {type: integer, minimum: 0}
    Accepted:
      type: object
      additionalProperties: false
      required: [request_id, accepted]
      properties:
        request_id: {type: string, format: uuid}
        accepted: {const: true}
    BatchResult:
      type: object
      additionalProperties: false
      required: [request_id, results]
      properties:
        request_id: {type: string, format: uuid}
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [index, status]
            properties:
              index: {type: integer, minimum: 0, maximum: 99}
              event_id: {type: [string, 'null'], format: uuid}
              inbox_id: {type: [string, 'null'], format: uuid}
              status: {type: string, enum: [accepted, duplicate, invalid, conflict, temporarily_rejected]}
              code: {type: string}
    User:
      type: object
      required: [id, name, email, locale, email_verified, mfa_enabled]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        email: {type: string, format: email}
        locale: {enum: [ru, en, de]}
        email_verified: {type: boolean}
        mfa_enabled: {type: boolean}
    Membership:
      type: object
      required: [tenant_id, role, created_at]
      properties:
        tenant_id: {type: string, format: uuid}
        role: {enum: [owner, admin, operator, viewer]}
        created_at: {type: string, format: date-time}
    MfaRequired:
      type: object
      required: [mfa_required]
      properties:
        mfa_required: {const: true}
    MfaState:
      type: object
      required: [enabled, recovery_codes_remaining]
      properties:
        enabled: {type: boolean}
        recovery_codes_remaining: {type: integer}
    MfaStateWithCodes:
      allOf:
        - {$ref: "#/components/schemas/MfaState"}
        - type: object
          required: [recovery_codes]
          properties:
            recovery_codes:
              type: array
              items: {type: string}
    StepUp:
      type: object
      required: [current_password]
      properties:
        current_password: {type: string, maxLength: 128}
        code: {type: [string, "null"], maxLength: 32, description: Authenticator or recovery code; required when MFA is on}
    AuthSession:
      type: object
      required: [user, active_tenant_id, memberships]
      properties:
        user: {$ref: "#/components/schemas/User"}
        active_tenant_id: {type: [string, "null"], format: uuid}
        memberships:
          type: array
          items: {$ref: "#/components/schemas/Membership"}
    StoreCoverage:
      type: object
      required: [connector, money, payment_attempts, browser_checks]
      properties:
        connector:
          type: object
          required: [state]
          properties:
            state: {enum: [not_connected, warming_up, fresh, stale, partial]}
            provider: {type: [string, "null"], description: "woocommerce (plugin) or woocommerce_api (REST API key)"}
            last_heartbeat_at: {type: [string, "null"], format: date-time}
            last_sync_at: {type: [string, "null"], format: date-time, description: "Last successful sync of a REST API connection (it has no heartbeat)."}
            plugin_version: {type: [string, "null"]}
        money:
          type: object
          required: [state, providers]
          properties:
            state:
              enum: [provider_not_connected, store_not_connected, store_data_stale, reconciling]
              description: "Money is reconciled only with a connected independent provider and fresh store data; otherwise results are unknown, never \"fine\"."
            providers:
              type: array
              items:
                type: object
                required: [provider, status]
                properties:
                  provider: {type: string}
                  status: {type: string}
        payment_attempts:
          type: object
          required: [state]
          properties:
            state: {enum: [store_not_connected, store_data_stale, no_attempts_seen, no_recent_attempts, observing]}
            last_window_end_at: {type: [string, "null"], format: date-time}
        browser_checks:
          type: object
          required: [state]
          properties:
            state:
              enum:
                - store_not_verified
                - disabled
                - not_configured
                - scenario_disabled
                - scheduled
                - passing
                - failing
                - not_conclusive
            last_run_status: {type: [string, "null"]}
            last_run_error_code: {type: [string, "null"]}
            last_run_finished_at: {type: [string, "null"], format: date-time}
            next_due_at: {type: [string, "null"], format: date-time}
    Store:
      type: object
      required:
        - id
        - name
        - base_url
        - platform
        - timezone
        - locale
        - default_currency
        - status
        - verified_at
        - browser_enabled
        - telemetry_enabled
        - config_version
        - coverage
        - last_successful_check_at
        - active_incident_count
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        base_url: {type: string, format: uri}
        platform: {type: string}
        timezone: {type: string}
        locale: {enum: [ru, en, de]}
        default_currency: {type: string, pattern: "^[A-Z]{3}$"}
        status: {enum: [onboarding, active, paused, degraded, deleted]}
        verified_at: {type: [string, "null"], format: date-time}
        capacity_paused_at: {type: [string, "null"], format: date-time, description: "Set while the plan allows fewer stores and the owner did not keep this one: scheduled and manual browser checks are paused, history and setup stay (ADR 0037)"}
        browser_enabled: {type: boolean}
        telemetry_enabled: {type: boolean}
        config_version: {type: integer, minimum: 1}
        coverage: {$ref: "#/components/schemas/StoreCoverage"}
        last_successful_check_at: {type: [string, "null"], format: date-time}
        active_incident_count: {type: integer, minimum: 0}
    StoreVerification:
      type: object
      required: [id, store_id, method, state]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        method:
          enum: [dns, plugin_challenge, api_key]
          description: api_key is recorded only by connecting a working WooCommerce Read key on the store's own origin (ADR 0024); it cannot be started.
        state: {enum: [pending, verified, failed, expired]}
        verified_origin: {type: [string, "null"]}
        expires_at: {type: [string, "null"], format: date-time}
        verified_at: {type: [string, "null"], format: date-time}
        reason_code: {type: [string, "null"]}
        attempts: {type: integer}
        last_checked_at: {type: [string, "null"], format: date-time}
        instructions:
          type: object
          description: "Only while pending: DNS TXT name/value or the URL the connector must serve, so the instructions survive a page reload."
    IntegrationCredential:
      type: object
      required: [id, kind, key_id_suffix, status]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        key_id_suffix: {type: string}
        key_version: {type: integer}
        status: {enum: [active, draining, revoked]}
        expires_at: {type: [string, "null"], format: date-time}
        rotated_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    Integration:
      type: object
      required: [id, store_id, provider, mode, source_authority, status, capabilities, health, credentials]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        provider: {type: string}
        external_account_id: {type: [string, "null"]}
        install_id: {type: [string, "null"], format: uuid}
        mode: {enum: [live, test]}
        source_authority: {enum: [store_reported, independent_provider]}
        status: {enum: [pending, active, degraded, revoked, disabled]}
        capabilities: {type: object}
        api_version: {type: [string, "null"]}
        connector_version: {type: [string, "null"]}
        last_heartbeat_at: {type: [string, "null"], format: date-time}
        last_successful_sync_at: {type: [string, "null"], format: date-time}
        webhook_url: {type: [string, "null"], format: uri, description: "Where to point the provider webhook (Stripe, PayPal); null for other connectors."}
        health:
          type: object
          description: "Freshness (state, reason, since), last heartbeat self-report, rotation flags. No secrets."
        credentials:
          type: array
          items: {$ref: "#/components/schemas/IntegrationCredential"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Finding:
      type: object
      required: [id, run_id, rule_code, status, currency, evaluated_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        order_id: {type: [string, "null"], format: uuid}
        payment_id: {type: [string, "null"], format: uuid}
        rule_code: {type: string}
        status: {enum: [ok, pending, mismatch, unsupported, unknown]}
        reason_code: {type: [string, "null"]}
        currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: [integer, "null"]}
        expected_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        actual_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        difference_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        gross_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        captured_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        refund_expected_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        refund_actual_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        evidence: {type: object}
        evaluated_at: {type: string, format: date-time}
        order_display_number: {type: [string, "null"], description: "Store order number; present in finding lists and incident details."}
    Export:
      type: object
      required: [id, store_id, kind, format, filters, state, content_type, size_bytes, sha256, error_code, download_url, expires_at, created_at, completed_at]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        kind: {enum: [findings, incidents, transactions]}
        format: {enum: [csv]}
        filters: {type: object}
        state: {enum: [processing, ready, failed, deleted]}
        content_type: {type: [string, "null"]}
        size_bytes: {type: [integer, "null"]}
        sha256: {type: [string, "null"]}
        error_code: {type: [string, "null"]}
        download_url: {type: [string, "null"]}
        expires_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, "null"], format: date-time}
    ReconciliationRunSummary:
      type: object
      required: [run_id, store_id, status, findings_count]
      properties:
        run_id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        order_id: {type: [string, "null"], format: uuid}
        status: {type: string}
        algorithm_version: {type: string}
        config_version: {type: integer}
        findings_count: {type: integer}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
    Order:
      type: object
      required: [id, store_id, external_id, status, currency, currency_exponent, total_minor, financial_support]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        integration_id: {type: string, format: uuid}
        external_id: {type: string}
        display_number: {type: [string, "null"]}
        status: {type: string}
        gateway: {type: [string, "null"]}
        mode: {enum: [live, test]}
        mode_reported:
          type: boolean
          description: "false when the store did not report the payment's test/live mode (REST API connection without the plugin, ADR 0024); mode is then the live default and, against a test-mode provider, money checks are unknown (payment_mode_needs_plugin)."
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        total_minor: {$ref: "#/components/schemas/MoneyMinor"}
        payment_expected: {type: boolean}
        paid_marked_at: {type: [string, "null"], format: date-time}
        transaction_ref: {type: [string, "null"]}
        financial_support: {enum: [supported, unsupported, unknown]}
        is_synthetic: {type: boolean}
        source_created_at: {type: [string, "null"], format: date-time}
        source_updated_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    FinancialTransaction:
      type: object
      required: [id, payment_id, kind, status, currency, amount_minor]
      properties:
        id: {type: string, format: uuid}
        payment_id: {type: [string, "null"], format: uuid}
        external_operation_id: {type: string}
        kind: {enum: [capture, refund, fee, dispute_debit, dispute_credit, adjustment]}
        status: {enum: [pending, succeeded, failed, cancelled]}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        occurred_at: {type: [string, "null"], format: date-time}
    Refund:
      type: object
      required: [id, order_id, currency, amount_minor, status]
      properties:
        id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        external_id: {type: string}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        external_required: {type: [boolean, "null"]}
        provider_ref: {type: [string, "null"]}
        status: {enum: [requested, recorded, cancelled, deleted]}
        occurred_at: {type: [string, "null"], format: date-time}
        updated_at: {type: [string, "null"], format: date-time}
    OrderRevision:
      type: object
      required: [source_revision]
      properties:
        source_revision: {type: integer}
        status: {type: [string, "null"]}
        total_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        observed_at: {type: [string, "null"], format: date-time}
    PaymentAllocation:
      type: object
      required: [id, order_id, payment_id, capture_transaction_id, currency, amount_minor, strategy]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        order_id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid}
        capture_transaction_id: {type: string, format: uuid}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        strategy: {type: string}
        evidence: {type: object}
        created_by: {type: [string, "null"], format: uuid}
        revoked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    RefundAllocation:
      type: object
      required: [id, refund_id, refund_transaction_id, payment_allocation_id, currency, amount_minor]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        refund_id: {type: string, format: uuid}
        refund_transaction_id: {type: string, format: uuid}
        payment_allocation_id: {type: string, format: uuid}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        strategy: {type: string}
        evidence: {type: object}
        created_by: {type: [string, "null"], format: uuid}
        revoked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    Payment:
      type: object
      required: [id, store_id, mode, currency, status, source_authority]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        integration_id: {type: string, format: uuid}
        external_id: {type: string}
        intent_ref: {type: [string, "null"]}
        charge_ref: {type: [string, "null"]}
        mode: {enum: [live, test]}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        status: {enum: [pending, authorized, captured, failed, cancelled, unknown]}
        source_authority: {enum: [store_reported, independent_provider]}
        source_updated_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UnmatchedPayment:
      type: object
      required: [capture_transaction_id, currency, amount_minor, reason, candidates]
      properties:
        payment_id: {type: [string, "null"], format: uuid}
        capture_transaction_id: {type: string, format: uuid}
        external_operation_id: {type: string, description: Provider operation ID (e.g. the Stripe charge) to look the capture up.}
        currency: {type: string, pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: integer}
        amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
        mode: {type: [string, "null"]}
        occurred_at: {type: [string, "null"], format: date-time}
        reason: {enum: [no_candidate_found, review_required]}
        candidates:
          type: array
          description: "Suggestions only, never an allocation."
          items:
            type: object
            required: [order_id, confidence]
            properties:
              order_id: {type: string, format: uuid}
              display_number: {type: [string, "null"]}
              confidence: {enum: [exact_candidate, manual_review]}
              provider_ref: {type: [string, "null"]}
              amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
              currency: {type: string, pattern: "^[A-Z]{3}$"}
              currency_exponent: {type: integer}
              mode: {type: [string, "null"]}
    TeamMember:
      type: object
      required: [user_id, tenant_id, role, is_you]
      properties:
        user_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        name: {type: [string, "null"]}
        email: {type: [string, "null"]}
        email_verified: {type: boolean}
        role: {enum: [owner, admin, operator, viewer]}
        is_you: {type: boolean}
        created_at: {type: [string, "null"], format: date-time}
    Invitation:
      type: object
      required: [id, email, role, state, expires_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        role: {enum: [admin, operator, viewer]}
        state: {enum: [pending, accepted, revoked, expired]}
        invited_by: {type: [string, "null"]}
        expires_at: {type: string, format: date-time}
        created_at: {type: [string, "null"], format: date-time}
    ProviderIntegration:
      allOf:
        - {$ref: "#/components/schemas/Integration"}
        - type: object
          properties:
            webhook_url: {type: string, format: uri, description: Endpoint to register in the Stripe Dashboard.}
    Incident:
      type: object
      required:
        - id
        - store_id
        - family
        - component
        - state
        - severity
        - title_code
        - revision
        - first_seen_at
        - last_seen_at
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        family: {enum: [money, checkout, checkout_payment, integration]}
        component: {type: string}
        state: {enum: [open, acknowledged, resolved]}
        severity: {enum: [info, warning, critical]}
        title_code: {type: string, description: Stable code; the UI translates it (ru/en/de).}
        currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        currency_exponent: {type: [integer, "null"], minimum: 0, description: "Exponent of verified_discrepancy_minor, from the linked reconciliation finding; null when unknown."}
        verified_discrepancy_minor:
          oneOf:
            - {$ref: "#/components/schemas/MoneyMinor"}
            - {type: "null"}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        last_good_at: {type: [string, "null"], format: date-time}
        first_bad_at: {type: [string, "null"], format: date-time}
        acknowledged_by: {type: [string, "null"], format: uuid}
        acknowledged_at: {type: [string, "null"], format: date-time}
        resolved_at: {type: [string, "null"], format: date-time}
        resolution_reason: {type: [string, "null"]}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Signal:
      type: object
      required: [id, signal_type, family, severity, confidence, detected_at]
      properties:
        id: {type: string, format: uuid}
        signal_type: {enum: [reconciliation_finding, payment_attempts, connector_freshness, browser_check]}
        family: {type: string}
        component: {type: string}
        severity: {enum: [info, warning, critical]}
        confidence: {enum: [observed, corroborated, inferred, unknown]}
        rule_version: {type: string}
        config_version: {type: integer}
        currency: {type: [string, "null"], pattern: "^[A-Z]{3}$"}
        finding_id: {type: [string, "null"], format: uuid}
        evidence: {type: object, description: Sanitized facts; no customer data.}
        detected_at: {type: string, format: date-time}
    IncidentActivity:
      type: object
      required: [id, incident_id, kind, created_at]
      properties:
        id: {type: string, format: uuid}
        incident_id: {type: string, format: uuid}
        kind:
          enum: [created, signal_linked, acknowledged, comment, resolved, reopened, severity_changed, suppressed]
        actor_id: {type: [string, "null"], format: uuid}
        incident_revision: {type: integer}
        data: {type: object}
        created_at: {type: string, format: date-time}
    IncidentDetail:
      allOf:
        - {$ref: "#/components/schemas/Incident"}
        - type: object
          required: [signals, findings, activity, active_suppression]
          properties:
            signals:
              type: array
              items: {$ref: "#/components/schemas/Signal"}
            findings:
              type: array
              description: Reconciliation findings behind the linked signals, oldest first.
              items: {$ref: "#/components/schemas/Finding"}
            activity:
              type: array
              items: {$ref: "#/components/schemas/IncidentActivity"}
            active_suppression:
              description: Suppression in force now (notifications muted), or null.
              oneOf:
                - {$ref: "#/components/schemas/Suppression"}
                - {type: "null"}
    Suppression:
      type: object
      required: [id, incident_id, reason, starts_at, ends_at]
      properties:
        id: {type: string, format: uuid}
        incident_id: {type: string, format: uuid}
        reason: {type: string}
        created_by: {type: [string, "null"], format: uuid}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        revoked_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    NotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        min_severity: {enum: [info, warning, critical]}
        locale: {enum: [ru, en, de]}
        timezone: {type: string}
        quiet_hours:
          type: [object, "null"]
          required: [start, end]
          properties:
            start: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$"}
            end: {type: string, pattern: "^[0-2][0-9]:[0-5][0-9]$"}
        critical_bypasses_quiet_hours: {type: boolean}
        notify_recovery: {type: boolean}
        reminder_hours:
          type: [integer, "null"]
          minimum: 24
          maximum: 720
        store_ids:
          type: [array, "null"]
          maxItems: 100
          items: {type: string, format: uuid}
    NotificationChannel:
      type: object
      required: [id, kind, label, destination_masked, enabled, preferences, effective_preferences, health]
      properties:
        id: {type: string, format: uuid}
        kind: {enum: [email, telegram]}
        label: {type: string}
        destination_masked: {type: string}
        enabled: {type: boolean}
        verified_at: {type: [string, "null"], format: date-time}
        preferences: {$ref: "#/components/schemas/NotificationPreferences"}
        effective_preferences: {$ref: "#/components/schemas/NotificationPreferences"}
        health: {type: object}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    NotificationDelivery:
      type: object
      required: [id, channel_id, notification_kind, status, attempts]
      properties:
        id: {type: string, format: uuid}
        incident_id: {type: [string, "null"], format: uuid}
        channel_id: {type: string, format: uuid}
        notification_kind: {enum: [incident_opened, incident_reopened, incident_recovered, incident_reminder, test]}
        incident_revision: {type: [integer, "null"]}
        template_version: {type: string}
        status: {enum: [queued, sending, sent, uncertain, failed, dead_letter, suppressed]}
        delivery_uncertain: {type: boolean}
        attempts: {type: integer}
        next_attempt_at: {type: [string, "null"], format: date-time}
        sent_at: {type: [string, "null"], format: date-time}
        error_code: {type: [string, "null"]}
        content: {type: object, description: "Sanitized rendered message (subject, body, locale); no customer data."}
        created_at: {type: string, format: date-time}
        content: {type: object, description: "Sanitized template input, no PII."}
        created_at: {type: string, format: date-time}
    CheckScenario:
      type: object
      required:
        - id
        - store_id
        - name
        - mode
        - version
        - enabled
        - adapter_version
        - interval_seconds
        - supported_steps
        - untested_components
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        name: {type: string}
        mode: {const: payment_form}
        version: {type: integer, minimum: 1}
        enabled: {type: boolean}
        adapter_version: {type: string}
        product_external_id: {type: [string, "null"]}
        product_url: {type: [string, "null"], format: uri}
        cart_url: {type: [string, "null"], format: uri}
        checkout_url: {type: [string, "null"], format: uri}
        extra_allowed_origins:
          type: array
          items: {type: string, format: uri}
        synthetic_location:
          type: [object, "null"]
          properties:
            country: {type: string, pattern: "^[A-Z]{2}$"}
            postcode: {type: [string, "null"]}
        interval_seconds: {type: integer, minimum: 300, maximum: 86400}
        next_due_at: {type: [string, "null"], format: date-time}
        supported_steps:
          type: array
          items: {type: string}
        untested_components:
          type: array
          items: {type: string}
    CheckScenarioInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        product_url: {type: string, format: uri, description: HTTPS on the store origin.}
        cart_url: {type: [string, "null"], format: uri}
        checkout_url: {type: [string, "null"], format: uri}
        product_external_id: {type: [string, "null"], maxLength: 255}
        interval_seconds: {type: integer, minimum: 300, maximum: 86400}
        enabled: {type: boolean, description: Requires a verified store.}
        extra_allowed_origins:
          type: array
          maxItems: 10
          items: {type: string, format: uri}
          description: Public HTTPS gateway/CDN origins the check may load.
        synthetic_location:
          type: [object, "null"]
          additionalProperties: false
          required: [country]
          properties:
            country: {type: string, pattern: "^[A-Za-z]{2}$"}
            postcode: {type: [string, "null"], maxLength: 16}
    CheckRun:
      type: object
      required: [id, store_id, scenario_id, scenario_version, trigger, status, scheduled_at]
      properties:
        id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        scenario_id: {type: string, format: uuid}
        scenario_version: {type: integer}
        trigger: {enum: [scheduled, manual, incident]}
        status: {enum: [queued, running, passed, failed, inconclusive, blocked, unsupported, cancelled]}
        error_code: {type: [string, "null"]}
        scheduled_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
    CheckArtifact:
      type: object
      required: [id, kind, content_type, size_bytes, expires_at]
      properties:
        id: {type: string, format: uuid}
        kind: {enum: [screenshot]}
        content_type: {enum: [image/jpeg, image/png]}
        size_bytes: {type: integer}
        redaction_version: {type: string}
        expires_at: {type: string, format: date-time}
    CheckRunDetail:
      allOf:
        - {$ref: "#/components/schemas/CheckRun"}
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: array
              items:
                type: object
                required: [id, attempt_number, status, steps, artifacts]
                properties:
                  id: {type: string, format: uuid}
                  attempt_number: {type: integer}
                  status: {enum: [running, passed, failed, inconclusive, blocked, unsupported, cancelled, expired]}
                  error_code: {type: [string, "null"]}
                  location: {type: string}
                  browser_version: {type: string}
                  started_at: {type: string, format: date-time}
                  finished_at: {type: [string, "null"], format: date-time}
                  diagnostics: {type: [object, "null"], description: redaction_version and relevant_errors (sanitized metadata).}
                  artifacts:
                    type: array
                    items: {$ref: "#/components/schemas/CheckArtifact"}
                  steps:
                    type: array
                    items:
                      type: object
                      required: [index, code, status]
                      properties:
                        index: {type: integer}
                        code: {type: string}
                        status: {enum: [passed, failed, skipped, inconclusive, blocked]}
                        error_code: {type: [string, "null"]}
                        started_at: {type: string, format: date-time}
                        finished_at: {type: string, format: date-time}
                        assertions:
                          type: array
                          items: {type: object}
                        network_summary:
                          type: array
                          items: {type: object}
    Heartbeat:
      type: object
      additionalProperties: false
      properties:
        backlog_count: {type: integer, minimum: 0}
        oldest_pending_at: {type: [string, "null"], format: date-time}
        plugin_version: {type: string, maxLength: 64}
    BrowserLease:
      type: object
      additionalProperties: false
      required: [attempt_id, run_id, store_id, fencing_token, lease_token, lease_until, absolute_deadline_at, scenario, network_policy]
      properties:
        attempt_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        store_id: {type: string, format: uuid}
        fencing_token: {type: integer, minimum: 1}
        lease_token: {type: string, minLength: 32}
        lease_until: {type: string, format: date-time}
        absolute_deadline_at: {type: string, format: date-time}
        scenario:
          type: object
          required: [version, adapter_version, mode, store_origin, product_url, cart_url, checkout_url, steps]
          properties:
            version: {type: integer, minimum: 1}
            adapter_version: {type: string}
            mode: {const: payment_form}
            store_origin: {type: string, format: uri}
            product_url: {type: string, format: uri}
            cart_url: {type: string, format: uri}
            checkout_url: {type: string, format: uri}
            synthetic_token: {type: string, description: Short-lived store and run bound signed token, never logged.}
            synthetic_location:
              type: [object, 'null']
              properties:
                country: {type: string, pattern: '^[A-Z]{2}$'}
                postcode: {type: [string, 'null'], maxLength: 16}
            steps:
              type: array
              minItems: 1
              maxItems: 20
              items:
                type: object
                required: [code, action]
                properties:
                  code: {type: string}
                  action: {enum: [goto, click_safe, fill_synthetic, select, assert_visible, assert_cart, wait_response]}
                  target: {enum: [product_url, cart_url, checkout_url], description: Scenario URL the step navigates to; selectors live in the versioned worker adapter.}
                  selector: {type: string, maxLength: 1000}
                  timeout_ms: {type: integer, minimum: 1000, maximum: 30000}
        network_policy:
          type: object
          required: [version, allowed_origins, blocked_operations]
          properties:
            version: {type: string}
            allowed_origins: {type: array, items: {type: string, format: uri}}
            blocked_operations: {type: array, items: {type: string}}
    BrowserResult:
      type: object
      additionalProperties: false
      required: [fencing_token, status, finished_at, steps, diagnostics]
      properties:
        fencing_token: {type: integer, minimum: 1}
        status: {type: string, enum: [passed, failed, inconclusive, blocked, unsupported, cancelled]}
        finished_at: {type: string, format: date-time}
        error_code: {type: [string, 'null'], maxLength: 128}
        steps:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [index, code, status, started_at, finished_at, assertions]
            properties:
              index: {type: integer, minimum: 0}
              code: {type: string, maxLength: 128}
              status: {enum: [passed, failed, skipped, inconclusive, blocked]}
              started_at: {type: string, format: date-time}
              finished_at: {type: string, format: date-time}
              assertions:
                type: array
                maxItems: 20
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    code: {type: string}
                    passed: {type: boolean}
                    detail_code: {type: string}
              network_summary:
                type: array
                maxItems: 50
                items:
                  type: object
                  additionalProperties: false
                  description: Path without query string or fragment; no headers or bodies.
                  properties:
                    method: {type: string}
                    origin: {type: string}
                    path: {type: string, pattern: '^[^?#@]*$'}
                    status: {type: [integer, 'null']}
                    duration_ms: {type: integer}
                    party: {enum: [first, gateway, third]}
                    failure: {type: string}
              error_code: {type: [string, 'null']}
        diagnostics:
          type: object
          additionalProperties: false
          description: Sanitized metadata only, no response bodies, secrets, cookies or full headers.
          required: [redaction_version, relevant_errors]
          properties:
            redaction_version: {type: string}
            relevant_errors:
              type: array
              maxItems: 100
              items:
                type: object
                additionalProperties: false
                properties:
                  type: {type: string}
                  party: {enum: [first, gateway, third]}
                  origin: {type: string}
                  path: {type: string, pattern: '^[^?#@]*$'}
                  status: {type: [integer, 'null']}
                  step_code: {type: string}
                  message_code: {type: string}
                  count: {type: integer}
        artifact_ids:
          type: array
          maxItems: 10
          items: {type: string, format: uuid}
