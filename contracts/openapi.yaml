openapi: 3.1.0
info:
  title: Business Watchdog core API
  version: 1.0.0
  description: |
    Core contracts for P0 and P1. This document is a specification, not a running API.
    HMAC canonicalization and transport limits are normative in TZ sections 11 and 27.
    UI CRUD, auth, billing, export and credential rotation must be added before their implementation.
    All monetary amounts are decimal strings in minor units. All timestamps are RFC3339 UTC.
servers:
  - url: https://watchdog.example.invalid
tags:
  - name: Ingestion
  - name: Incidents
  - name: Checks
  - name: BrowserInternal
  - name: Billing
paths:
  /api/v1/ingest/events:
    post:
      tags: [Ingestion]
      operationId: ingestEvents
      security:
        - IntegrationKeyId: []
      description: |
        Derive tenant, store and integration from verified key; never from body fields.
        Verify raw-body HMAC before JSON parse. Maximum 100 events and 1 MiB uncompressed.
        Fresh transport nonce is required for retry; event IDs remain unchanged.
        Accepted means committed to durable PostgreSQL inbox, not fully processed.
      parameters:
        - $ref: '#/components/parameters/SignatureTimestamp'
        - $ref: '#/components/parameters/SignatureNonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/SignatureVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: ./event.schema.json
      responses:
        '202':
          description: All records durably accepted or known identical duplicates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '207':
          description: Valid batch envelope with mixed per-record results; retry only unaccepted records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      description: Rate-limited (signup per hour per IP). CSRF cookie required (Sanctum SPA).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              description: "organization_name and timezone are required unless invitation_token is given; with a token the account joins the inviting team (the email must be the invited one) and no tenant is created."
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                email: {type: string, format: email, maxLength: 255}
                password: {type: string, minLength: 12, maxLength: 128}
                password_confirmation: {type: string}
                organization_name: {type: string, minLength: 1, maxLength: 100}
                timezone: {type: string}
                invitation_token: {type: string, maxLength: 128}
                locale: {enum: [ru, en, de]}
                policy_version_ids: {type: array, maxItems: 10, items: {type: string, format: uuid}, description: "Ids of the published legal page versions the person accepted (ADR 0042); required when the owner marked terms pages, otherwise 422 policy_acceptance_required with details.documents"}
      responses:
        "201":
          description: Registered; owner of a new tenant; session started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/csrf-cookie:
    get:
      tags: [Platform]
      operationId: platformCsrfCookie
      description: "Starts the control panel session: sets the `bw-platform-session` cookie (host-only, SameSite=Strict, ends with the browser) and the `BW-PLATFORM-XSRF` CSRF cookie whose value goes back in `X-XSRF-TOKEN`. Customer cookies are never set or accepted here (ADR 0034)."
      security: []
      responses:
        "204": {description: Cookies set}
  /platform-api/v1/auth/login:
    post:
      tags: [Platform]
      operationId: platformLogin
      description: "First step for platform staff: email and password of the linked account. Wrong credentials, a customer account without a staff role and a disabled staff member all get the same 422 `platform_login_failed`. Staff without an authenticator get 403 `platform_mfa_enrollment_required` (enrollment happens only through `php artisan platform:create-owner` or a staff invitation, never after a password alone). 5 per minute per IP, 30 per hour per email."
      security: []
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, maxLength: 128}
      responses:
        "200":
          description: Password accepted; the authenticator code is required next
          content:
            application/json:
              schema:
                type: object
                required: [mfa_required]
                properties:
                  mfa_required: {const: true}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/auth/mfa:
    post:
      tags: [Platform]
      operationId: platformLoginMfa
      description: "Second step: an authenticator code or an unused recovery code. Valid for 5 minutes and 5 attempts after the password (401 `platform_mfa_expired`); a wrong code is 422 `mfa_code_invalid`. Success starts the staff session (idle 30 min, absolute 8 h, ended by a permission change)."
      security: []
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code]
              properties:
                code: {type: string, maxLength: 32}
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformMe"}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/plans:
    get:
      tags: [Platform]
      operationId: platformListPlans
      description: "Capability plans.read (owner, admin, billing). Every plan with its versions (newest first), prices of all modes, subscribers per version (trial/active/past_due) and the editable catalog: features, limits, per-store limits, supported currencies, intervals (day/week/month/year, every 1–365) and the trial maximum (365 days). ADR 0035."
      security:
        - {StaffSession: []}
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: object
                required: [data, mode, provider_configured, catalog]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, code, state, versions]
                      properties:
                        id: {type: string, format: uuid}
                        code: {type: string}
                        state: {enum: [draft, published, retired]}
                        versions: {type: array, items: {$ref: "#/components/schemas/PlatformPlanVersion"}}
                  mode: {enum: [test, live]}
                  provider_configured: {type: boolean}
                  catalog: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      tags: [Platform]
      operationId: platformCreatePlan
      description: "Capability plans.manage. Creates a plan with an immutable code (`^[a-z0-9][a-z0-9_-]{1,31}$`, 422 `plan_code_invalid`, 409 `plan_code_taken`) and its version 1 draft (no features, no limits, 14 trial days)."
      security:
        - {StaffSession: []}
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: {type: string}
                name: {type: object, additionalProperties: {type: string}}
      responses:
        "201":
          description: Draft version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformPlanVersion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/plans/{plan_id}/versions:
    post:
      tags: [Platform]
      operationId: platformCreatePlanVersion
      description: "Capability plans.manage. New draft copying the latest version (content, entitlements, trial and this mode's prices as drafts). 409 `draft_exists` while a draft exists."
      security:
        - {StaffSession: []}
      parameters:
        - {name: plan_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "201":
          description: Draft version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformPlanVersion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/plan-versions/{version_id}:
    patch:
      tags: [Platform]
      operationId: platformUpdatePlanVersion
      description: "Capability plans.manage. Drafts only (409 `version_not_draft`). Names up to 80 and descriptions up to 500 characters per locale (ru/en/de, HTML stripped), trial 0–365 days, entitlements validated against the catalog with minimums: stores ≥ 1, check interval ≥ 5 minutes, history ≥ 1 day; null means unlimited."
      security:
        - {StaffSession: []}
      parameters:
        - {name: version_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: object, additionalProperties: {type: string}}
                description: {type: object, additionalProperties: {type: string}}
                trial_days: {type: integer, minimum: 0, maximum: 365}
                entitlements:
                  type: object
                  properties:
                    features: {type: array, items: {type: string}}
                    limits: {type: object, additionalProperties: {type: [integer, "null"]}}
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformPlanVersion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/plan-versions/{version_id}/prices:
    post:
      tags: [Platform]
      operationId: platformAddPlanPrice
      description: "Capability plans.manage. Draft only. A base or extra-store price for the current payment mode: supported currency (exponent from ISO 4217), amount in minor units as a decimal string, billing period every 1–365 days, weeks, months or years. 409 `price_exists` for the same kind, currency and period."
      security:
        - {StaffSession: []}
      parameters:
        - {name: version_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, currency, amount_minor, interval, interval_count]
              properties:
                kind: {enum: [base, extra_store]}
                currency: {type: string}
                amount_minor: {$ref: "#/components/schemas/MoneyMinor"}
                interval: {enum: [day, week, month, year]}
                interval_count: {type: integer, minimum: 1, maximum: 365}
      responses:
        "201":
          description: Draft version with the price
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformPlanVersion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/plan-prices/{price_id}:
    delete:
      tags: [Platform]
      operationId: platformRemovePlanPrice
      description: "Capability plans.manage. Draft prices not yet created at Paddle only."
      security:
        - {StaffSession: []}
      parameters:
        - {name: price_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "204": {description: Removed}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/plan-versions/{version_id}/publish:
    post:
      tags: [Platform]
      operationId: platformPublishPlanVersion
      description: "Capability plans.manage, confirmed by a current authenticator code (403 `step_up_failed`) and a reason for the audit log. Requires names in ru/en/de and a base price for the current mode. Creates the plan's Paddle product (shared by its versions) and the prices with their billing cycle; on a Paddle failure the version stays a draft (502 `provider_unavailable`). Then the version and its prices are published and the previously published version of the plan is retired for new buyers — its subscribers keep their version."
      security:
        - {StaffSession: []}
      parameters:
        - {name: version_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlatformConfirmation"}
      responses:
        "200":
          description: Published version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformPlanVersion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/plan-versions/{version_id}/retire:
    post:
      tags: [Platform]
      operationId: platformRetirePlanVersion
      description: "Capability plans.manage, confirmed like publishing. Stops selling a published version; its subscribers keep it. The plan is retired when no version of it is on sale."
      security:
        - {StaffSession: []}
      parameters:
        - {name: version_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlatformConfirmation"}
      responses:
        "200":
          description: Retired version
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformPlanVersion"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/discounts:
    get:
      tags: [Platform]
      operationId: platformListDiscounts
      description: "Capability plans.read. Discounts of the current payment mode, active first, with confirmed uses, targeted organisations and plans."
      security:
        - {StaffSession: []}
      responses:
        "200":
          description: Discounts
          content:
            application/json:
              schema:
                type: object
                required: [data, mode]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/PlatformDiscount"}}
                  mode: {enum: [test, live]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      tags: [Platform]
      operationId: platformCreateDiscount
      description: "Capability plans.manage, confirmed by `confirmation_code` (authenticator) and `reason`. Audience `code` (promo code 3–32 of A–Z, 0–9, - and _, case-insensitive), `tenant` (chosen organisations, applied without a code) or `automatic` (everyone buying the chosen plans). Percentage in basis points (1–10000) or a flat amount in minor units with currency; duration `once`, `periods` (1–1000 billing periods) or `forever`; optional usage limit, start and end, plans (empty = all). Created in Paddle first (not enterable in Paddle's checkout; our server applies it). 502 `provider_unavailable` keeps nothing."
      security:
        - {StaffSession: []}
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, audience, kind, duration, reason, confirmation_code]
              properties:
                name: {type: string, maxLength: 100}
                label: {type: object, additionalProperties: {type: string, maxLength: 120}}
                audience: {enum: [code, tenant, automatic]}
                code: {type: [string, "null"]}
                kind: {enum: [percentage, flat]}
                percent_bps: {type: [integer, "null"], minimum: 1, maximum: 10000}
                amount_minor: {oneOf: [{$ref: "#/components/schemas/MoneyMinor"}, {type: "null"}]}
                currency: {type: [string, "null"]}
                duration: {enum: [once, periods, forever]}
                duration_periods: {type: [integer, "null"], minimum: 1, maximum: 1000}
                usage_limit: {type: [integer, "null"], minimum: 1}
                plan_ids: {type: array, items: {type: string, format: uuid}}
                tenant_ids: {type: array, items: {type: string, format: uuid}}
                starts_at: {type: [string, "null"], format: date-time}
                expires_at: {type: [string, "null"], format: date-time}
                reason: {type: string}
                confirmation_code: {type: string}
      responses:
        "201":
          description: Discount
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformDiscount"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/discount-applications:
    get:
      tags: [Platform]
      operationId: platformListDiscountApplications
      description: "Capability billing.read. What every paid purchase and every renewal got (ADR 0036): per period the amount before discounts, each discount in order (offer, personal, promo code) with the amount before it, its saving and the amount after it, the total saving, the amount after discounts, the combined Paddle discount and its status (`applied`, `failed` with the reason; failed renewals are retried). Newest first, 50 per page."
      security:
        - {StaffSession: []}
      parameters:
        - {name: tenant_id, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - {$ref: "#/components/schemas/DiscountBreakdown"}
                        - type: object
                          properties:
                            tenant: {type: object, properties: {id: {type: string}, name: {type: string}}}
                            created_at: {type: string, format: date-time}
                            applied_at: {type: [string, "null"], format: date-time}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/discounts/{discount_id}:
    patch:
      tags: [Platform]
      operationId: platformUpdateDiscount
      description: "Capability plans.manage, confirmed like creation. Name, label, plans, organisations, start, end and usage limit of an active discount; the amount, audience and duration do not change (create a new discount)."
      security:
        - {StaffSession: []}
      parameters:
        - {name: discount_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmation_code]
              properties:
                name: {type: string}
                label: {type: object, additionalProperties: {type: string}}
                plan_ids: {type: array, items: {type: string, format: uuid}}
                tenant_ids: {type: array, items: {type: string, format: uuid}}
                starts_at: {type: [string, "null"], format: date-time}
                expires_at: {type: [string, "null"], format: date-time}
                usage_limit: {type: [integer, "null"]}
                reason: {type: string}
                confirmation_code: {type: string}
      responses:
        "200":
          description: Discount
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformDiscount"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/discounts/{discount_id}/archive:
    post:
      tags: [Platform]
      operationId: platformArchiveDiscount
      description: "Capability plans.manage, confirmed like creation. Archived in Paddle and here: no new purchases get it; subscriptions that already have it keep it for its duration."
      security:
        - {StaffSession: []}
      parameters:
        - {name: discount_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmation_code]
              properties:
                reason: {type: string}
                confirmation_code: {type: string}
      responses:
        "200":
          description: Archived discount
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformDiscount"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/tenants:
    get:
      tags: [Platform]
      operationId: platformListTenants
      description: "Capability tenants.read (ADR 0038). Organisations newest first, 50 per page (cursor). Access state is reported apart from billing state; stores only as a capacity summary. Subscription fields and subscription filters need billing.read (null otherwise). Owner contact email in full for the platform owner, masked for other roles. Search by name, organisation id or the owner's verified email."
      security:
        - {StaffSession: []}
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 200}}
        - {name: tenant_status, in: query, schema: {enum: [active, suspended]}}
        - {name: subscription, in: query, schema: {enum: [none, trial, active, past_due, suspended, cancelled]}}
        - {name: plan, in: query, schema: {type: string}}
        - {name: cancel_scheduled, in: query, schema: {type: boolean}}
        - {name: trial_ends_before, in: query, schema: {type: string, format: date-time}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Organisations
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/PlatformTenantRow"}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/tenants/{tenant}:
    get:
      tags: [Platform]
      operationId: platformShowTenant
      description: "Capability tenants.read. Organisation card: access, store capacity, members (email masked unless platform owner), stores as a summary (host, platform, state, verification, capacity pause, open incident count — no findings, orders or screenshots), platform audit for this organisation; `billing` (subscription, provider contracts, plan changes, entitlement overrides) only with billing.read. No provider secrets."
      security:
        - {StaffSession: []}
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Organisation card
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/tenants/{tenant}/actions/{action}/preview:
    post:
      tags: [Platform]
      operationId: platformPreviewTenantAction
      description: "Capability tenants.manage (platform owner). Shows what an action would do without doing it: access state before and after, active stores, when it takes effect. Actions: suspend, resume, grant_override (plan_version_id, extra_stores, ends_at ≤ 180 days; one active override at a time), revoke_override (override_id), extend_trial (trial_ends_at, later than the current end, ≤ 90 days ahead; our own trial only), cancel_subscription (at the period end through the billing adapter), refresh_billing (read the provider subscriptions again)."
      security:
        - {StaffSession: []}
      parameters:
        - {name: tenant, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: action, in: path, required: true, schema: {enum: [suspend, resume, grant_override, revoke_override, extend_trial, cancel_subscription, refresh_billing]}}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PlatformTenantActionInput"}
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema:
                type: object
                required: [action, access_before, access_after, stores, effective_at]
                properties:
                  action: {type: string}
                  access_before: {type: object}
                  access_after: {type: object}
                  stores: {type: integer}
                  effective_at: {type: [string, "null"], format: date-time}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/tenants/{tenant}/actions/{action}:
    post:
