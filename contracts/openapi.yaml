      operationId: platformSavePageDraft
      description: "Capability content.manage. Saves the draft of one language. The body is HTML sanitized on the server: scripts, frames, forms, event handlers, inline styles and links other than http(s), mailto, tel and relative are removed; images only over https or relative. An ordinary page needs a body (422 body_required); an empty home body keeps the built-in text. Pricing and contact are changed only in code (409 edited_in_code)."
