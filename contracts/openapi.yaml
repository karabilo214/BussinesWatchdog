      responses:
        "200":
          description: Message
          content:
            application/json:
              schema: {type: object}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/payments:
    get:
      tags: [Platform]
      operationId: platformListPayments
      description: "Capability billing.read (ADR 0043). Every transaction of our subscriptions in the current mode, newest first, 50 per page, with the organisation; `month` sums the paid and completed transactions billed this calendar month (UTC) per currency — charged, tax, provider fee, earnings (fee and earnings null when a transaction has none yet) — never across currencies. `refunded_minor` per payment and per month counts refunds Paddle confirmed (ADR 0044)."
      security:
        - {StaffSession: []}
      parameters:
        - {name: status, in: query, schema: {enum: [draft, ready, billed, paid, completed, canceled, past_due]}}
        - {name: tenant_id, in: query, schema: {type: string, format: uuid}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, month, mode]
                properties:
                  data: {type: array, items: {type: object}}
                  next_cursor: {type: [string, "null"]}
                  month: {type: array, items: {type: object}}
                  mode: {enum: [test, live]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/refunds:
    get:
      tags: [Platform]
      operationId: platformListRefunds
      description: "Capability billing.read (ADR 0044). Up to 100 refunds of our subscriptions in the current mode, newest first, with the organisation, the payment, who requested and who decided. Status `requested` (waiting for the owner), `rejected`, `submitting`, `pending` (Paddle reviewing), `refunded`, `declined` (by Paddle), `failed` or `unknown` (Paddle's answer was lost; settled later from the transaction's adjustments). Refunds made in the Paddle dashboard appear here with no requester."
      security:
        - {StaffSession: []}
      parameters:
        - {name: status, in: query, schema: {enum: [requested, rejected, submitting, pending, refunded, declined, failed, unknown]}}
        - {name: transaction_id, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Refunds
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {type: array, items: {type: object}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/payments/{payment}/refunds:
    post:
      tags: [Platform]
      operationId: platformRequestRefund
      description: "Capability refunds.request (owner and billing staff, ADR 0044). Asks to refund a completed payment; nothing goes to Paddle until the owner approves. `amount_minor` is a minor-unit string in the payment currency, tax included; requested, sent and done refunds together never exceed the payment total (422 `refund_exceeds_payment` with `details.left_minor`). 409 `refund_not_available` when the payment is not completed, 422 `refund_amount_invalid`, 404 `payment_not_found`. `cancel_subscription` also cancels the subscription at the end of the paid period once the refund is approved; otherwise the subscription is untouched."
      security:
        - {StaffSession: []}
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
        - {name: payment, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, reason]
              properties:
                amount_minor: {type: string, pattern: "^[1-9][0-9]{0,14}$"}
                reason: {type: string, minLength: 3, maxLength: 500}
                cancel_subscription: {type: boolean}
      responses:
        "201":
          description: Requested
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/refunds/{refund}/approve:
    post:
      tags: [Platform]
      operationId: platformApproveRefund
      description: "Capability refunds.approve (platform owner only), confirmed by `confirmation_code` (authenticator, 403 `step_up_failed`) and `reason`. Sends the refund to Paddle as an adjustment: a full refund when it covers the whole untouched payment, otherwise partial amounts spread over the line items. 409 `refund_already_decided`; 422 `refund_rejected_by_provider` when Paddle refuses; when Paddle's answer is lost the refund stays `unknown` and is settled later."
      security:
        - {StaffSession: []}
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
        - {name: refund, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, confirmation_code]
              properties:
                reason: {type: string, minLength: 3, maxLength: 500}
                confirmation_code: {type: string, maxLength: 32}
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string, format: uuid}
                  status: {enum: [pending, refunded, declined, failed, unknown]}
                  provider_adjustment_ref: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/refunds/{refund}/reject:
    post:
      tags: [Platform]
      operationId: platformRejectRefund
      description: "Capability refunds.approve (platform owner only). Rejects a requested refund with a reason; its amount becomes refundable again. 409 `refund_already_decided`."
      security:
        - {StaffSession: []}
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
        - {name: refund, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: {type: string, minLength: 3, maxLength: 500}
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string, format: uuid}
                  status: {enum: [rejected]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/tenants/lookup:
    get:
      tags: [Platform]
      operationId: platformLookupTenants
      description: "Capability tenants.read. Up to 20 organisations whose name contains the query (or with this id), for targeting discounts. Only id, name and creation time."
      security:
        - {StaffSession: []}
      parameters:
        - {name: query, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 100}}
      responses:
        "200":
          description: Organisations
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, created_at]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        created_at: {type: [string, "null"], format: date-time}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/me:
    get:
      tags: [Platform]
      operationId: platformMe
      description: "The signed-in staff member. 401 `platform_unauthenticated` without a staff session, 401 `platform_session_expired` after 30 idle minutes, 8 hours or a permission change."
      security:
        - {StaffSession: []}
      responses:
        "200":
          description: Staff member
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PlatformMe"}
        "401": {$ref: "#/components/responses/Problem"}
  /platform-api/v1/auth/logout:
    post:
      tags: [Platform]
      operationId: platformLogout
      security:
        - {StaffSession: []}
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "204": {description: Signed out}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      description: Generic failure that does not reveal whether the e-mail exists; 5 per minute per e-mail+IP. With MFA on, a correct password answers {mfa_required true} and no session is signed in until POST /auth/mfa/challenge (ADR 0021).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string}
                remember: {type: boolean}
      responses:
        "200":
          description: Session started, or the second factor is required
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: "#/components/schemas/AuthSession"}
                  - {$ref: "#/components/schemas/MfaRequired"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/challenge:
    post:
      tags: [Auth]
      operationId: completeMfaChallenge
      description: Second sign-in step for the sign-in waiting in this session (5 minutes, 5 attempts) with an authenticator code or an unused recovery code; each code works once. mfa_challenge_expired (401) sends the user back to the password; 10 per minute per IP.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, maxLength: 32}
      responses:
        "200":
          description: Session started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa:
    get:
      tags: [Auth]
      operationId: showMfa
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Second-factor state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaState"}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      operationId: beginMfaSetup
      security:
        - {UserSession: []}
      description: Requires the current password; issues a new secret that changes nothing until confirmed. mfa_already_enabled (409) when MFA is on. 10 per minute per user.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password]
              properties:
                current_password: {type: string, maxLength: 128}
      responses:
        "200":
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauth_uri, qr_svg]
                properties:
                  secret: {type: string, description: Base32}
                  otpauth_uri: {type: string}
                  qr_svg: {type: string, description: SVG image of otpauth_uri}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/confirm:
    post:
      tags: [Auth]
      operationId: confirmMfa
      security:
        - {UserSession: []}
      description: A code from the app turns MFA on and returns 10 recovery codes once; every other session of the user ends.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string, maxLength: 32}
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaStateWithCodes"}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/disable:
    post:
      tags: [Auth]
      operationId: disableMfa
      security:
        - {UserSession: []}
      description: Requires the current password and an authenticator or recovery code.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StepUp"}
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaState"}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/mfa/recovery-codes:
    post:
      tags: [Auth]
      operationId: regenerateMfaRecoveryCodes
      security:
        - {UserSession: []}
      description: Requires the current password and a code; replaces all recovery codes and returns the new ones once.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StepUp"}
      responses:
        "200":
          description: New codes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MfaStateWithCodes"}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security:
        - {UserSession: []}
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "204": {description: Session revoked}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: me
      security:
        - {UserSession: []}
      responses:
        "200":
          description: "Current user, active tenant and memberships"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "401": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [Auth]
      operationId: updateProfile
      security:
        - {UserSession: []}
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                locale: {enum: [ru, en, de]}
      responses:
        "200":
          description: Updated session view
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/password-reset/request:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      description: Same answer for known and unknown addresses; a one-time link (60 min) is mailed to known active users. 3/hour per address, 20/hour per IP.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, maxLength: 255}
      responses:
        "202":
          description: Requested
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {const: requested}}}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/password-reset/complete:
    post:
      tags: [Auth]
      operationId: completePasswordReset
      description: Consumes the token, ends every session of the user and confirms the address. Unknown, wrong or expired tokens all answer password_reset_invalid.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: {type: string, maxLength: 255}
                token: {type: string, maxLength: 128}
                password: {type: string, minLength: 12, maxLength: 128}
                password_confirmation: {type: string}
      responses:
        "204": {description: Password changed}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/email-verification/{user_id}/{hash}:
    get:
      tags: [Auth]
      operationId: verifyEmail
      description: Signed expiring link (24 h) from the email; works without a session and redirects to /app/overview?email_verified=1|0.
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: hash, in: path, required: true, schema: {type: string}}
        - {name: expires, in: query, required: true, schema: {type: integer}}
        - {name: signature, in: query, required: true, schema: {type: string}}
      responses:
        "302": {description: Redirect to the dashboard with the result}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/email-verification/resend:
    post:
      tags: [Auth]
      operationId: resendEmailVerification
      security:
        - {UserSession: []}
      description: Once a minute; 409 email_already_verified.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "202":
          description: Sent
          content:
            application/json:
              schema: {type: object, required: [status], properties: {status: {const: sent}}}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      security:
        - {UserSession: []}
      description: Requires the current password; ends every other session of the user.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: {type: string, maxLength: 128}
                password: {type: string, minLength: 12, maxLength: 128}
                password_confirmation: {type: string}
      responses:
        "204": {description: Changed}
        "401": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/ownership-transfer:
    post:
      tags: [Team]
      operationId: transferOwnership
      security:
        - {UserSession: []}
      description: Owner only. The target is an existing member with a confirmed address; it becomes owner and the current owner becomes admin in one transaction (ADR 0021). Requires the current password and, with MFA on, a code. cannot_transfer_to_self, target_email_unverified (422), member_not_found (404).
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/StepUp"}
                - type: object
                  required: [target_user_id]
                  properties:
                    target_user_id: {type: string, format: uuid}
      responses:
        "204": {description: Transferred}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/invitations/lookup:
    get:
      tags: [Team]
      operationId: lookupInvitation
      description: Public; what a pending invitation offers. Unknown, expired, revoked or accepted tokens answer invitation_invalid.
      parameters:
        - {name: token, in: query, required: true, schema: {type: string, maxLength: 128}}
      responses:
        "200":
          description: Pending invitation
          content:
            application/json:
              schema:
                type: object
                required: [tenant_name, email, role, expires_at, account_exists]
                properties:
                  tenant_name: {type: string}
                  email: {type: string}
                  role: {enum: [admin, operator, viewer]}
                  expires_at: {type: string, format: date-time}
                  account_exists: {type: boolean}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/invitations/accept:
    post:
      tags: [Team]
      operationId: acceptInvitation
      security:
        - {UserSession: []}
      description: The signed-in user's address must be the invited one; accepting confirms that address and makes the team active.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [token], properties: {token: {type: string, maxLength: 128}}}
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamMember"}
        "401": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/memberships:
    get:
      tags: [Team]
      operationId: listMembers
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Members of the active team and the roles the viewer may assign
          content:
            application/json:
              schema:
                type: object
                required: [data, assignable_roles]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/TeamMember"}
                  assignable_roles:
                    type: array
                    items: {enum: [admin, operator, viewer]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/memberships/{user_id}:
    patch:
      tags: [Team]
      operationId: changeMemberRole
      security:
        - {UserSession: []}
      description: "ADR 0019: owner assigns admin/operator/viewer; admin manages only operators and viewers; nobody changes their own role; the owner role is not assignable."
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [role], properties: {role: {enum: [admin, operator, viewer]}}}
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamMember"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
    delete:
      tags: [Team]
      operationId: removeMember
      security:
        - {UserSession: []}
      description: Removes a member (same rules as role changes) or lets any non-owner leave; access ends with the next request.
      parameters:
        - {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "204": {description: Removed}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/invitations:
    get:
      tags: [Team]
      operationId: listInvitations
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Pending invitations of the active team
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Invitation"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
    post:
      tags: [Team]
      operationId: inviteMember
      security:
        - {UserSession: []}
      description: Mails a 7-day link; a new invitation to the same address replaces the pending one. 30/hour per user.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: {type: string, format: email, maxLength: 255}
                role: {enum: [admin, operator, viewer]}
      responses:
        "201":
          description: Invited
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invitation"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/invitations/{invitation_id}/revoke:
    post:
      tags: [Team]
      operationId: revokeInvitation
      security:
        - {UserSession: []}
      parameters:
        - {name: invitation_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Invitation"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/tenants/{tenant_id}/activate:
    post:
      tags: [Tenancy]
      operationId: activateTenant
      security:
        - {UserSession: []}
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200":
          description: Active tenant switched
          content:
            application/json:
              schema:
                type: object
                required: [active_tenant_id]
                properties:
                  active_tenant_id: {type: string, format: uuid}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/tenants/context:
    get:
      tags: [Tenancy]
      operationId: tenantContext
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Resolved tenant context
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_tenant_id: {type: [string, "null"], format: uuid}
                  tenant_context_id: {type: [string, "null"], format: uuid}
                  tenant_context_source: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/stores:
    get:
      tags: [Stores]
      operationId: listStores
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Stores of the active tenant with coverage
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Store"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
    post:
      tags: [Stores]
      operationId: createStore
      security:
        - {UserSession: []}
      description: Owner/admin.
      parameters:
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, base_url, timezone, default_currency]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                base_url:
                  type: string
                  format: uri
                  description: "Public HTTPS origin; private destinations, credentials, fragments and non-standard ports are rejected."
                timezone: {type: string}
                locale: {enum: [ru, en, de]}
                default_currency: {type: string, pattern: "^[A-Z]{3}$"}
                platform: {enum: [woocommerce, shopware], default: woocommerce}
      responses:
        "201":
          description: "Created (onboarding, unverified)"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Store"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}:
    get:
      tags: [Stores]
      operationId: getStore
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Store with coverage summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Store"}
          headers:
            ETag:
              description: Quoted version for If-Match
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
    patch:
      tags: [Stores]
      operationId: updateStore
      security:
        - {UserSession: []}
      description: Owner/admin; If-Match carries config_version. Activation and browser checks require a verified domain (422 store_not_verified).
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IfMatch"}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                base_url: {type: string, format: uri, description: Changing it clears verification and browser checks.}
                timezone: {type: string}
                locale: {enum: [ru, en, de]}
                default_currency: {type: string, pattern: "^[A-Z]{3}$"}
                status: {enum: [paused, active]}
                browser_enabled: {type: boolean}
                telemetry_enabled: {type: boolean}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Store"}
          headers:
            ETag:
              description: Quoted version for If-Match
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/verify:
    post:
      tags: [Stores]
      operationId: startStoreVerification
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method]
              properties:
                method: {enum: [dns, plugin_challenge]}
      responses:
        "202":
          description: Verification started
          content:
            application/json:
              schema:
                type: object
                required: [id, method, instructions]
                properties:
                  id: {type: string, format: uuid}
                  method: {enum: [dns, plugin_challenge]}
                  challenge: {type: string}
                  instructions: {type: object, description: DNS TXT name/value or the URL the connector must serve.}
                  expires_at: {type: string, format: date-time}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/verification:
    get:
      tags: [Stores]
      operationId: getStoreVerification
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Latest verification
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoreVerification"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/verification/check:
    post:
      tags: [Stores]
      operationId: checkStoreVerification
      security:
        - {UserSession: []}
      description: SSRF-safe DNS/HTTP check; rate-limited.
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200":
          description: Checked now
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoreVerification"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/pairing-codes:
    post:
      tags: [Stores]
      operationId: createPairingCode
      security:
        - {UserSession: []}
      description: Owner/admin.
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "201":
          description: "One-time code (15 min), shown once, never logged"
          content:
            application/json:
              schema:
                type: object
                required: [id, store_id, pairing_code, expires_at, saas_endpoint, service_url]
                properties:
                  id: {type: string, format: uuid}
                  store_id: {type: string, format: uuid}
                  pairing_code: {type: string}
                  expires_at: {type: string, format: date-time}
                  saas_endpoint: {type: string, format: uri}
                  service_url: {type: string, format: uri, description: "Service URL the connector settings ask for (the exchange path is appended by the connector)."}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations:
    get:
      tags: [Integrations]
      operationId: listStoreIntegrations
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Integrations of the store
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Integration"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations/stripe:
    post:
      tags: [Integrations]
      operationId: connectStripe
      security:
        - {UserSession: []}
      description: "Owner/admin (ADR 0020). Only restricted keys (rk_test_/rk_live_) are accepted; full secret keys answer stripe_secret_key_refused. Read access to payment intents, charges and refunds is probed before anything is stored; the account is read when the key allows it. Secrets are stored encrypted and never returned. Connecting re-queues the store's reconciliation window."
      parameters:
        - {name: store_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restricted_api_key]
              properties:
                restricted_api_key: {type: string, maxLength: 255, writeOnly: true}
                webhook_secret: {type: [string, "null"], maxLength: 255, writeOnly: true}
                expected_account_id: {type: [string, "null"], pattern: "^acct_[A-Za-z0-9]+$"}
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderIntegration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}/webhook-secret:
    put:
      tags: [Integrations]
      operationId: setStripeWebhookSecret
      security:
        - {UserSession: []}
      description: Replaces the webhook signing secret (whsec_…); the previous one stops working.
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, required: [webhook_secret], properties: {webhook_secret: {type: string, maxLength: 255, writeOnly: true}}}
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderIntegration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}/sync:
    post:
      tags: [Integrations]
      operationId: syncProviderIntegration
      security:
        - {UserSession: []}
      description: Runs a bounded delta (default) or audit poll now for a Stripe or PayPal integration; twice a minute at most. 502 when the provider request failed (details in integration.health.last_error). A PayPal audit already done in the last 23 hours answers status skipped.
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        content:
          application/json:
            schema: {type: object, properties: {kind: {enum: [delta, audit]}}}
      responses:
        "200":
          description: Synchronised
          content:
            application/json:
              schema:
                type: object
                required: [status, emitted, unchanged, complete, integration]
                properties:
                  status: {enum: [ok, failed, skipped]}
                  emitted: {type: integer}
                  unchanged: {type: integer}
                  complete: {type: boolean}
                  error: {type: string}
                  integration: {$ref: "#/components/schemas/ProviderIntegration"}
        "502": {description: Provider request failed}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/webhooks/stripe/{integration_id}:
    post:
      tags: [Integrations]
      operationId: receiveStripeWebhook
      description: "Called by Stripe. The Stripe-Signature header is verified by the official library over the raw body (tolerance 300 s). Only payment_intent, charge and refund objects are used; they go through the same change-detecting path as polling, so repeats are harmless."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Stripe-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema: {type: object, required: [received], properties: {received: {const: true}, emitted: {type: integer}, ignored: {type: string}}}
        "400": {description: Signature invalid}
        "404": {description: Unknown integration}
        "409": {description: No webhook secret configured}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations/paypal:
    post:
      tags: [Integrations]
      operationId: connectPayPal
      security:
        - {UserSession: []}
      description: "Owner/admin (ADR 0022). PayPal REST app credentials always allow refunds and captures, so write_access_acknowledged must be true (paypal_write_access_not_acknowledged otherwise; nothing is sent to PayPal before). The app must have Transaction Search (paypal_transaction_search_missing). The adapter only calls the OAuth token, verify-webhook-signature and an allowlist of GET endpoints. health.write_scopes lists what the credentials could do. Secrets are stored encrypted and never returned. Connecting re-queues the store's reconciliation window."
      parameters:
        - {name: store_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [environment, client_id, client_secret, write_access_acknowledged]
              properties:
                environment: {enum: [sandbox, live]}
                client_id: {type: string, maxLength: 255}
                client_secret: {type: string, maxLength: 255, writeOnly: true}
                webhook_id: {type: [string, "null"], maxLength: 64}
                write_access_acknowledged: {type: boolean}
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderIntegration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations/woocommerce-api:
    post:
      tags: [Integrations]
      operationId: connectWooCommerceApi
      security:
        - {UserSession: []}
      description: "Owner/admin (ADR 0024). Connects the store's orders through a WooCommerce REST API key with Read permission, on the store's own https base URL (/wp-json/wc/v3, pretty permalinks). The key must read orders (woocommerce_key_rejected, woocommerce_key_not_recognized, woocommerce_api_unavailable otherwise) and must not be able to write (woocommerce_key_not_read_only; checked with a request that cannot change anything). A store has one order source: 409 order_source_already_connected when the plugin is paired, provider_already_connected when a key is already connected. Only GET order endpoints are polled. The key is stored encrypted and never returned. Connecting re-queues the store's reconciliation window."
      parameters:
        - {name: store_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consumer_key, consumer_secret]
              properties:
                consumer_key: {type: string, maxLength: 255, pattern: "^ck_[a-f0-9]{40}$"}
                consumer_secret: {type: string, maxLength: 255, writeOnly: true, pattern: "^cs_[a-f0-9]{40}$"}
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderIntegration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations/shopware:
    post:
      tags: [Integrations]
      operationId: connectShopware
      security:
        - {UserSession: []}
      description: "Owner/admin (ADR 0025/0026). Connects a Shopware 6.6/6.7 store's orders through an Integration key (access key + secret) on the store's own https origin. Shopware lets even a read-only role change order, payment and delivery states, so state_change_risk_acknowledged must be true (shopware_state_change_risk_not_acknowledged otherwise; nothing is sent before). The key must get a token (shopware_key_rejected) and search orders (shopware_order_read_missing). Only the OAuth token and order searches are sent, always without customer data. A working key confirms the store (verification method api_key). One order source per store (409 order_source_already_connected / provider_already_connected). Refunds are reported as a payment state (refund_state). The key is stored encrypted and never returned."
      parameters:
        - {name: store_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_key, secret_access_key, state_change_risk_acknowledged]
              properties:
                access_key: {type: string, maxLength: 255, pattern: "^SWIA[A-Za-z0-9]{10,60}$"}
                secret_access_key: {type: string, maxLength: 255, writeOnly: true}
                state_change_risk_acknowledged: {type: boolean}
      responses:
        "201":
          description: Connected
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderIntegration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/integrations/shopware-app:
    post:
      tags: [Integrations]
      operationId: downloadShopwareApp
      security:
        - {UserSession: []}
      description: "Owner/admin (ADR 0027). Creates the store's pending Shopware app integration and returns the app archive (BusinessWatchdog.zip) to upload in Shopware (Extensions → My extensions → Upload). The manifest lists only read permissions, a registration URL for this integration and its own secret. A new archive replaces a still pending one. 409 order_source_already_connected / provider_already_connected while another order source is connected. X-Integration-Id names the pending integration."
      parameters:
        - {name: store_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state_change_risk_acknowledged]
              properties:
                state_change_risk_acknowledged: {type: boolean, description: "Must be true: Shopware lets the app's read-only role change order, payment and delivery states (ADR 0025)."}
      responses:
        "200":
          description: App archive
          content:
            application/zip:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/shopware/app/{integration_id}/register:
    get:
      tags: [Integrations]
      operationId: registerShopwareApp
      security: []
      description: "Called by Shopware when the app is installed: query shop-id, shop-url, timestamp signed with the manifest secret (header shopware-app-signature). Answers proof, a new shop secret and the confirmation URL; errors as {error} for Shopware."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Registration accepted
          content:
            application/json:
              schema:
                type: object
                required: [proof, secret, confirmation_url]
                properties:
                  proof: {type: string}
                  secret: {type: string}
                  confirmation_url: {type: string, format: uri}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/shopware/app/{integration_id}/confirm:
    post:
      tags: [Integrations]
      operationId: confirmShopwareApp
      security: []
      description: "Called by Shopware after registration with the app's API key, signed with the shop secret (header shopware-shop-signature). The key is checked against the shop's Admin API; the integration becomes the store's order source and, when the shop URL host is the store's host, confirms the store."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Confirmed}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/shopware/app/{integration_id}/webhook:
    post:
      tags: [Integrations]
      operationId: receiveShopwareAppWebhook
      security: []
      description: "Signed Shopware app webhooks (shopware-shop-signature): order.written and order_transaction.written read the named orders right away; app.deactivated/app.activated/app.deleted move the integration (deleted → revoked). The body is only a hint."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Received}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}/webhook-id:
    put:
      tags: [Integrations]
      operationId: setPayPalWebhookId
      security:
        - {UserSession: []}
      description: Stores the id of the webhook created in the PayPal app (needed to verify deliveries); replaces the previous one.
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [webhook_id]
              properties:
                webhook_id: {type: string, maxLength: 64}
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderIntegration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/webhooks/paypal/{integration_id}:
    post:
      tags: [Integrations]
      operationId: receivePayPalWebhook
      description: "Called by PayPal. The PAYPAL-* transmission headers and the raw body are checked by PayPal's verify-webhook-signature with the stored webhook id (transmission time within 600 s). The body is only a hint: the affected PayPal order is read through the API and goes through the same change-detecting path as polling; nothing from the body is stored."
      parameters:
        - {name: integration_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: PAYPAL-TRANSMISSION-ID, in: header, required: true, schema: {type: string}}
        - {name: PAYPAL-TRANSMISSION-TIME, in: header, required: true, schema: {type: string}}
        - {name: PAYPAL-TRANSMISSION-SIG, in: header, required: true, schema: {type: string}}
        - {name: PAYPAL-CERT-URL, in: header, required: true, schema: {type: string}}
        - {name: PAYPAL-AUTH-ALGO, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema: {type: object, required: [received], properties: {received: {const: true}, emitted: {type: integer}, ignored: {type: string}}}
        "400": {description: Signature invalid}
        "404": {description: Unknown integration}
        "409": {description: No webhook id configured}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {description: PayPal unavailable for verification or reading}
  /api/v1/pairing/exchange:
    post:
      tags: [Pairing]
      operationId: exchangePairingCode
      description: Called by the store connector; base_url must equal the store base URL. Rate-limited per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pairing_code, install_id, connector_code, plugin_version, base_url]
              properties:
                pairing_code: {type: string, minLength: 16, maxLength: 128}
                install_id: {type: string, format: uuid}
                connector_code: {type: string, pattern: "^[a-z][a-z0-9_]{1,63}$"}
                plugin_version: {type: string, maxLength: 100}
                base_url: {type: string, format: uri}
      responses:
        "201":
          description: Credential issued once (at-most-once exchange)
          content:
            application/json:
              schema:
                type: object
                required: [integration_id, key_id, secret, secret_encoding, signature_version]
                properties:
                  integration_id: {type: string, format: uuid}
                  key_id: {type: string}
                  secret: {type: string}
                  secret_encoding: {const: base64}
                  signature_version: {const: "1"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "410": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/checkout:
    post:
      tags: [Billing]
      operationId: createBillingCheckout
      description: "Tenant owner only. Starts a purchase of a base price (and optionally extra stores of the same plan version, interval and currency) through the billing provider (Paddle, ADR 0030). The amount comes from our stored price, never from the request. A local session is written first; the provider transaction is created outside the database transaction, a lost answer leaves the session `unknown` (resolved later from provider events). Repeating the same Idempotency-Key returns the same session; a different body with the same key is 409. Opening the provider checkout never grants access: paid access comes only from the provider's verified subscription state."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [price_id]
              properties:
                price_id: {type: string, format: uuid, description: A base price}
                extra_stores: {type: integer, minimum: 0, maximum: 1000, default: 0}
                discount_code: {type: [string, "null"], maxLength: 32, description: "Optional promo code; it is applied after the best public offer and the organisation's own discount (ADR 0036)"}
                faster_checks: {type: boolean, default: false, description: "Add the package's faster-checks add-on (ADR 0041); 422 faster_checks_unavailable when the package has none"}
                policy_version_ids: {type: array, maxItems: 10, items: {type: string, format: uuid}, description: "Ids of the published legal page versions the person accepted (ADR 0042); required when the owner marked terms pages, otherwise 422 policy_acceptance_required with details.documents"}
      responses:
        "202":
          description: Checkout session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingCheckout"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/trial:
    post:
      tags: [Billing]
      operationId: startBillingTrial
      description: "Tenant owner with a verified email only. Our own trial without a payment method (ADR 0030): once per tenant (consumed under the tenant lock, kept even if the subscription row is later replaced) and once per store domain (ADR 0031: `www.` and the bare host are one domain; the tenant's verified stores claim their domains, 409 `trial_store_already_used` when another organisation already had a trial for one of them), for the trial days of the plan version. Needs consent to the current service terms and subscription terms when the owner marked such pages (ADR 0042)."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [plan_version_id]
              properties:
                policy_version_ids: {type: array, maxItems: 10, items: {type: string, format: uuid}, description: "Ids of the published legal page versions the person accepted (ADR 0042); required when the owner marked terms pages, otherwise 422 policy_acceptance_required with details.documents"}
                plan_version_id: {type: string, format: uuid}
      responses:
        "201":
          description: Trial started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingSubscription"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/checkouts/{checkout_id}:
    get:
      tags: [Billing]
      operationId: getBillingCheckout
      description: Tenant owner only. The browser returning from the provider never grants paid access; poll this until `confirmed`.
      security:
        - {UserSession: []}
      parameters:
        - {name: checkout_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingCheckout"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/discounts/check:
    get:
      tags: [Billing]
      operationId: checkBillingDiscount
      description: "Tenant owner only, 10 per minute. Whether a promo code can be used with a published base price for this organisation (ADR 0036): 422 `discount_code_invalid` (unknown, not started or archived), `discount_expired`, `discount_not_applicable` (other plan or other currency), 409 `discount_used_up`. Only an indication: the checkout checks again and applies the code after the offer and the personal discount."
      security:
        - {UserSession: []}
      parameters:
        - {name: code, in: query, required: true, schema: {type: string, maxLength: 32}}
        - {name: price_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: The discount the code gives
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingDiscount"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/plans:
    get:
      tags: [Billing]
      operationId: listBillingPlans
      description: "Any member. The latest published version of each plan (managed in the owner panel, ADR 0035) with its published prices for the current mode; any billing period `every interval_count interval`. Plans with a base price come first, cheapest first. Amounts are minor units as strings; `tax_behavior` tells whether taxes are included (ADR 0030: gross for consumers). `trial_available` is false once the organisation had a trial or any subscription; the store domain check (ADR 0031) happens when the trial starts."
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Sellable plans
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, mode, checkout_available, trial_available]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/BillingPlan"}
                  mode: {enum: [test, live]}
                  checkout_available: {type: boolean}
                  trial_available: {type: boolean}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/subscription:
    get:
      tags: [Billing]
      operationId: getBillingSubscription
      description: Tenant owner only. Billing status (from the provider) and access state (from the entitlement calculator) are reported separately.
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Current subscription projection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingSubscription"}
        "204": {description: No trial or paid subscription yet; the client shows onboarding}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/invoices:
    get:
      tags: [Billing]
      operationId: listBillingInvoices
      description: "Tenant owner only (ADR 0043). Transactions of the organisation's own subscription in the current billing mode, newest first, 50 per page; drafts and not yet billed transactions are left out. Amounts are minor-unit strings in the transaction currency; `total_minor` is what was charged (after discounts and credits, with tax); `refunded_minor` is what was refunded of it (ADR 0044)."
      security:
        - {UserSession: []}
      parameters:
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: {type: array, items: {type: object}}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/invoices/{invoice}/download:
    get:
      tags: [Billing]
      operationId: downloadBillingInvoice
      description: "Tenant owner only. A short-lived link to the invoice PDF at the billing provider; 409 invoice_not_available for a transaction that was not billed, 404 for another organisation's invoice."
      security:
        - {UserSession: []}
      parameters:
        - {name: invoice, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Link
          content:
            application/json:
              schema: {type: object, required: [url], properties: {url: {type: string, format: uri}}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/payment-method:
    post:
      tags: [Billing]
      operationId: changeBillingPaymentMethod
      description: "Tenant owner only. Returns the provider's payment-method update transaction to open with Paddle.js like a checkout; nothing is charged. 409 no_active_subscription."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        "200":
          description: Provider checkout
          content:
            application/json:
              schema: {type: object, required: [provider_checkout], properties: {provider_checkout: {type: object}}}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/plan-change-preview:
    post:
      tags: [Billing]
      operationId: previewBillingPlanChange
      description: "Tenant owner only (ADR 0037). Previews a change of the live subscription to another base price of the same currency and interval (and a number of extra stores). A recurring price that is not lower takes effect at once with Paddle's prorated charge for the rest of the period; a lower one takes effect at the next period. While a cheaper plan is scheduled only another cheaper plan can be previewed (409 scheduled_change_pending). When the new plan allows fewer stores than the organisation has, `retained_store_ids` (at most the new limit) is required: 422 retained_stores_required with details {limit, stores}. The returned token is valid for 10 minutes."
      security:
        - {UserSession: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [price_id]
              properties:
                price_id: {type: string, format: uuid}
                extra_stores: {type: integer, minimum: 0, maximum: 1000, default: 0}
                retained_store_ids: {type: [array, "null"], items: {type: string, format: uuid}}
                faster_checks: {type: boolean, default: false, description: "With the package's faster-checks add-on (ADR 0041)"}
      responses:
        "200":
          description: Preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BillingPlanChange"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/plan-change:
    post:
      tags: [Billing]
      operationId: confirmBillingPlanChange
      description: "Tenant owner only. Confirms a preview by its token. 409 preview_expired / preview_stale (the subscription changed since the preview) / preview_used. An immediate change is sent to Paddle with on_payment_failure=prevent_change: if the charge fails, 402 payment_failed and the subscription stays as it was. A lost Paddle answer leaves the change `unknown` (502 provider_outcome_unknown) until the subscription is read again — never retried automatically. Access follows only the subscription read back from Paddle. The same Idempotency-Key returns the same change."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [preview_token]
              properties:
                policy_version_ids: {type: array, maxItems: 10, items: {type: string, format: uuid}, description: "Ids of the published legal page versions the person accepted (ADR 0042); required when the owner marked terms pages, otherwise 422 policy_acceptance_required with details.documents"}
                preview_token: {type: string}
      responses:
        "202":
          description: Applied (immediate) or scheduled (next period)
          content:
            application/json:
              schema:
                type: object
                required: [change, subscription]
                properties:
                  change: {$ref: "#/components/schemas/BillingPlanChange"}
                  subscription: {oneOf: [{$ref: "#/components/schemas/BillingSubscription"}, {type: "null"}]}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "402": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/plan-change/cancel:
    post:
      tags: [Billing]
      operationId: cancelBillingPlanChange
      description: "Tenant owner only. Withdraws a cheaper plan scheduled for the next period: the paid plan's items are put back at Paddle without billing."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      responses:
        "200":
          description: Withdrawn change and the subscription
          content:
            application/json:
              schema:
                type: object
                required: [change, subscription]
                properties:
                  change: {$ref: "#/components/schemas/BillingPlanChange"}
                  subscription: {oneOf: [{$ref: "#/components/schemas/BillingSubscription"}, {type: "null"}]}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/cancel:
    post:
      tags: [Billing]
      operationId: cancelBillingSubscription
      description: "Tenant owner only. Cancels renewal at the end of the paid period (Paddle scheduled cancel); access, monitoring and history stay until then, nothing is refunded or deleted. Repeating it while a cancellation is scheduled changes nothing. The reason is optional and stored in the audit log only."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [at_period_end]
              properties:
                at_period_end: {const: true}
                reason: {type: [string, "null"], maxLength: 2000}
      responses:
        "200":
          description: Subscription as read back from Paddle
          content:
            application/json:
              schema: {oneOf: [{$ref: "#/components/schemas/BillingSubscription"}, {type: "null"}]}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/resume:
    post:
      tags: [Billing]
      operationId: resumeBillingSubscription
      description: "Tenant owner only. Withdraws a scheduled cancellation (Paddle scheduled change removed); renewal continues. 409 cancel_not_scheduled, 409 version_conflict when expected_version is not the current subscription version."
      security:
        - {UserSession: []}
      parameters:
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expected_version: {type: [integer, "null"], minimum: 1}
      responses:
        "200":
          description: Subscription as read back from Paddle
          content:
            application/json:
              schema: {oneOf: [{$ref: "#/components/schemas/BillingSubscription"}, {type: "null"}]}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/billing/retained-stores:
    put:
      tags: [Billing]
      operationId: retainBillingStores
      description: "Tenant owner only. Chooses which stores keep running when the plan allows fewer stores than the organisation has (at most the limit); the others are paused for browser checks, never deleted."
      security:
        - {UserSession: []}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [store_ids]
              properties:
                store_ids: {type: array, minItems: 1, items: {type: string, format: uuid}}
      responses:
        "200":
          description: Store capacity after the choice
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StoreCapacity"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/webhooks/paddle:
    post:
      tags: [Billing]
      operationId: receivePaddleWebhook
      description: "Called by Paddle. `Paddle-Signature: ts=…;h1=…` is HMAC-SHA256 of `ts:raw body` with the destination secret (tolerance 300 s). The event is stored in the billing inbox with only ids, states, price ids and quantities, periods, totals and our custom data (no names, emails, addresses or payment details) and acknowledged; `billing:process-events` reads the affected subscription from Paddle and projects it. The same event id with the same content is a duplicate; with different content a conflict (kept, not applied)."
      security: []
      parameters:
        - {name: Paddle-Signature, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema: {type: object, required: [received, outcome], properties: {received: {const: true}, outcome: {enum: [stored, duplicate, conflict]}}}
        "400": {description: Signature or payload invalid}
        "409": {description: No webhook secret configured}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/entitlements:
    get:
      tags: [Billing]
      operationId: getEntitlements
      description: What the active tenant may use and why (ADR 0029). With `enforced` false (pilot) every feature is included and limits are not applied.
      security:
        - {UserSession: []}
      responses:
        "200":
          description: Entitlements of the active tenant
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Entitlements"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations:
    get:
      tags: [Integrations]
      operationId: listIntegrations
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: query
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Integrations of the active tenant
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Integration"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}:
    get:
      tags: [Integrations]
      operationId: getIntegration
      security:
        - {UserSession: []}
      parameters:
        - name: integration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Integration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}/revoke:
    post:
      tags: [Integrations]
      operationId: revokeIntegration
      security:
        - {UserSession: []}
      parameters:
        - name: integration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "200":
          description: Revoked with credentials; provider revocation requeues the store reconciliation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/integrations/{integration_id}/rotate:
    post:
      tags: [Integrations]
      operationId: requestCredentialRotation
      security:
        - {UserSession: []}
      parameters:
        - name: integration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/CsrfToken"}
      responses:
        "202":
          description: Rotation requested; the connector picks it up on its next heartbeat
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Integration"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/findings:
    get:
      tags: [Money]
      operationId: listFindings
      security:
        - {UserSession: []}
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: from
          in: query
          schema: {type: string, format: date-time}
        - name: to
          in: query
          schema: {type: string, format: date-time}
        - name: status
          in: query
          schema: {enum: [ok, pending, mismatch, unsupported, unknown]}
        - name: rule_code
          in: query
          schema: {type: string}
        - name: currency
          in: query
          schema: {type: string, pattern: "^[A-Z]{3}$"}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
        - name: cursor
          in: query
          schema: {type: string, maxLength: 2048}
        - name: current
          in: query
          description: "Only findings of the latest run per order and of the latest store-wide unmatched-payment scan."
          schema: {type: boolean}
      responses:
        "200":
          description: "Findings, newest first; null amounts are unknown, not zero"
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Finding"}
                  next_cursor: {type: [string, "null"]}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/stores/{store_id}/exports:
    post:
      tags: [Exports]
      operationId: createExport
      security:
        - {UserSession: []}
      description: Creates a private CSV export for one store. The first implementation completes synchronously and stores a private object; clients still poll the returned export id.
      parameters:
        - name: store_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - {$ref: "#/components/parameters/IdempotencyKey"}
        - {$ref: "#/components/parameters/CsrfToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind, format]
              properties:
                kind: {enum: [findings, incidents, transactions]}
                format: {enum: [csv]}
                filters:
                  type: object
                  additionalProperties: false
                  properties:
                    from: {type: string, format: date-time}
                    to: {type: string, format: date-time}
                    current: {type: boolean}
                    status: {enum: [ok, pending, mismatch, unsupported, unknown]}
                    rule_code: {type: string, maxLength: 64}
                    state:
                      oneOf:
                        - {type: string, pattern: "^(open|acknowledged|resolved)(,(open|acknowledged|resolved)){0,2}$"}
                        - type: array
                          minItems: 1
                          maxItems: 3
                          items: {enum: [open, acknowledged, resolved]}
                    severity: {enum: [info, warning, critical]}
                    family: {type: string, maxLength: 64}
                    currency: {type: string, pattern: "^[A-Z]{3}$"}
                    kind: {enum: [capture, refund, fee, dispute_debit, dispute_credit, adjustment]}
                    transaction_status: {enum: [pending, succeeded, failed, cancelled]}
      responses:
        "202":
          description: Export accepted; state is usually ready in the current synchronous implementation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Export"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/exports/{export_id}:
    get:
      tags: [Exports]
      operationId: getExport
      security:
        - {UserSession: []}
      parameters:
        - name: export_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Tenant-scoped export metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Export"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/exports/{export_id}/download:
    get:
      tags: [Exports]
      operationId: downloadExport
      security:
        - {UserSession: []}
      parameters:
        - name: export_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Private CSV download; role and tenant checked at request time
          content:
            text/csv:
              schema: {type: string}
          headers:
            Cache-Control:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
