name: business-watchdog-prod

x-backend: &backend
  image: business-watchdog/backend:${RELEASE:-latest}
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - internal

x-cli: &cli
  <<: *backend
  user: www-data
  working_dir: /var/www/html

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    <<: *backend
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
      target: production

  scheduler:
    <<: *cli
    command: ["php", "artisan", "schedule:work"]

  sync-worker:
    <<: *cli
    command: ["php", "artisan", "queue:work", "redis", "--queue=sync", "--sleep=3", "--max-time=3600", "--timeout=840"]
    deploy:
      replicas: ${BW_SYNC_WORKERS:-2}

  reconciliation-worker:
    <<: *cli
    command: ["php", "artisan", "reconciliation:work", "--max-time=3600"]
    deploy:
      replicas: ${BW_RECONCILIATION_WORKERS:-2}

  mail:
    image: business-watchdog/mail:${RELEASE:-latest}
    build:
      context: ../docker/mail
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: bw-mail
    environment:
      MAIL_HOSTNAME: mail.${SITE_DOMAIN}
      MAIL_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "0.0.0.0:25:25"
      - "0.0.0.0:465:465"
      - "0.0.0.0:587:587"
      - "0.0.0.0:993:993"
    volumes:
      - mail-queue:/var/spool/postfix
      - mail-data:/var/mail
      - caddy-data:/caddy:ro
    depends_on:
      rspamd:
        condition: service_healthy
    networks:
      - internal

  rspamd:
    image: business-watchdog/rspamd:${RELEASE:-latest}
    build:
      context: ../docker/rspamd
    restart: unless-stopped
    environment:
      MAIL_DOMAIN: ${SITE_DOMAIN}
      MAIL_DKIM_SELECTOR: ${MAIL_DKIM_SELECTOR}
      MAIL_DKIM_PRIVATE_KEY: ${MAIL_DKIM_PRIVATE_KEY}
    volumes:
      - rspamd-data:/var/lib/rspamd
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11332"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal

  web:
    image: business-watchdog/web:${RELEASE:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - internal
      - browser-api

  browser-worker:
    image: business-watchdog/browser-worker:${RELEASE:-latest}
    build:
      context: ../../apps/browser-worker
    profiles:
      - browser
    environment:
      NODE_ENV: production
      BW_API_URL: http://web:8080
      BW_WORKER_TOKEN: ${BW_WORKER_TOKEN:-}
      BW_WORKER_LOCATION: ${BW_WORKER_LOCATION:-eu-de}
      BW_EGRESS_PROXY: http://browser-egress:3128
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - apparmor=bw-browser-worker
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    restart: unless-stopped
    deploy:
      replicas: ${BW_BROWSER_WORKERS:-1}
    depends_on:
      - browser-egress
    networks:
      - browser-api
      - browser-egress

  browser-egress:
    build:
      context: ../docker/egress
    image: business-watchdog/browser-egress:${RELEASE:-latest}
    profiles:
      - browser
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - browser-egress
      - browser-internet

networks:
  internal:
  browser-api:
    internal: true
  browser-egress:
    internal: true
  browser-internet:

volumes:
  postgres-data:
  redis-data:
  storage:
  caddy-data:
  caddy-config:
  mail-queue:
  mail-data:
  rspamd-data:
