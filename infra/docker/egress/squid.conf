# Egress proxy for the browser worker (spec §19). Squid resolves the destination itself and
# applies the dst ACL to the resolved addresses it connects to, so DNS rebinding cannot reach
# private networks. Only HTTPS (CONNECT to port 443) leaves; nothing is cached or logged
# beyond method, destination host and status.

http_port 3128

acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl private_dst dst ::/128 ::1/128 ::ffff:0:0/96 64:ff9b::/96 fc00::/7 fe80::/10 ff00::/8
acl https_port port 443
acl CONNECT method CONNECT

http_access deny private_dst
http_access deny !CONNECT
http_access deny CONNECT !https_port
http_access allow CONNECT https_port
http_access deny all

cache deny all
via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
dns_v4_first on
pid_filename none
cache_log /dev/stderr
logformat bw %ts.%03tu %rm %ru %>Hs %<st
access_log stdio:/dev/stdout bw
strip_query_terms on
coredump_dir /tmp
